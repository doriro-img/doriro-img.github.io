<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f4f9f5;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #20342a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #5f7a6c; margin-bottom: 16px; font-weight: 600; }
  .banner { background: #17a06a; border-radius: 14px; padding: 15px 22px; color: #fff; margin-bottom: 14px;
    display: flex; align-items: center; gap: 14px; }
  .banner .ck { font-size: 30px; font-weight: 800; }
  .banner .bt { font-size: 18px; font-weight: 800; }
  .banner .bt small { display: block; font-size: 13px; font-weight: 600; opacity: .92; margin-top: 2px; }
  .three { display: flex; gap: 12px; }
  .c { flex: 1; background: #fff; border-radius: 13px; padding: 14px 15px; text-align: center;
    box-shadow: 0 5px 13px rgba(30,110,70,.07); border: 1px solid #dcebe2; }
  .c .ic { font-size: 24px; }
  .c .t { font-size: 13.5px; font-weight: 800; color: #20342a; margin: 6px 0 3px; }
  .c .d { font-size: 12px; color: #6a8478; line-height: 1.45; font-weight: 600; }
</style>

<div id="art">
  <h1>2026년, 애드센스 아직 할만한가요?</h1>
  <p class="sub">결론부터요. 여전히 되는데, 예전보단 빡세졌어요</p>

  <div class="banner">
    <div class="ck">✓</div>
    <div class="bt">여전히 유효한 부업<small>단, "글만 쓰면 돈"이던 시절은 지났어요</small></div>
  </div>

  <div class="three">
    <div class="c"><div class="ic">💼</div><div class="t">부업으로 인기</div><div class="d">N잡·재택 부업으로<br/>여전히 많이 해요</div></div>
    <div class="c"><div class="ic">📈</div><div class="t">트래픽이 전부</div><div class="d">방문자 없으면<br/>수익도 거의 없어요</div></div>
    <div class="c"><div class="ic">🔍</div><div class="t">구글 유입이 관건</div><div class="d">한국은 네이버 강세라<br/>구글 검색 노려야 해요</div></div>
  </div>
</div>
