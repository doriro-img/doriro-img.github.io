<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f4f9f5;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #20342a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #5f7a6c; margin-bottom: 16px; font-weight: 600; }
  .eq { background: #fff; border-radius: 14px; padding: 18px 20px; border: 1px solid #dcebe2;
    box-shadow: 0 5px 13px rgba(30,110,70,.06); margin-bottom: 13px; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .term { text-align: center; }
  .term .v { font-size: 17px; font-weight: 800; color: #17a06a; }
  .term .l { font-size: 11.5px; color: #7a9488; font-weight: 700; margin-top: 2px; }
  .op { font-size: 20px; font-weight: 800; color: #b7c8bf; }
  .msg { background: #fdf3e0; border: 1.5px solid #f0d9a8; border-radius: 12px; padding: 13px 18px; margin-bottom: 13px;
    font-size: 13.5px; color: #93641a; line-height: 1.6; font-weight: 600; }
  .msg b { color: #b5822a; }
  .when { background: #eef2fb; border: 1.5px solid #cdd9f2; border-radius: 12px; padding: 13px 18px;
    font-size: 13.5px; color: #2f4a86; line-height: 1.6; font-weight: 600; }
  .when b { color: #24408a; }
</style>

<div id="art">
  <h1>얼마나 벌 수 있나요? (환상 깨기)</h1>
  <p class="sub">'글만 쓰면 돈'은 아니더라고요</p>

  <div class="eq">
    <div class="term"><div class="v">방문자 수</div><div class="l">트래픽</div></div>
    <div class="op">×</div>
    <div class="term"><div class="v">노출·클릭</div><div class="l">광고 반응</div></div>
    <div class="op">×</div>
    <div class="term"><div class="v">광고 단가</div><div class="l">주제별 상이</div></div>
    <div class="op">=</div>
    <div class="term"><div class="v" style="color:#eaa521">수익</div><div class="l">편차 큼</div></div>
  </div>

  <div class="msg"><b>결국 트래픽이 핵심이에요.</b> 방문자가 적으면 승인받아도 수익은 커피값 수준일 수 있어요. 주제 단가와 유입이 같이 받쳐줘야 해요</div>

  <div class="when"><b>승인은 '출발선'일 뿐이에요.</b> 심사 기간은 평균 2~4주(빠르면 1주, 늦으면 한 달 이상). 승인 후부터가 진짜 시작이더라고요</div>
</div>
