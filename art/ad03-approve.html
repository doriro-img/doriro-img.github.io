<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f4f9f5;

  .ck { flex: none; width: 27px; height: 27px; border-radius: 8px; background: #17a06a; color: #fff;

  .tx .em { color: #128055; font-weight: 800; }
</style>

    <div class="item"><div class="ck">✓</div><div class="tx"><b>기술 완성도</b> — HTTPS 적용 · 모바일 최적화 · 빠른 로딩 속도</div></div>
    <div class="item"><div class="ck">✓</div><div class="tx"><b>사이트맵 등록</b> — 구글이 내 글을 잘 수집하도록 서치콘솔에 제출</div></div>
    <div class="item"><div class="ck">✓</div><div class="tx"><b>주제의 일관성</b> — 이것저것 말고 한 방향으로. 신뢰도 있는 블로그로 보여야 해요</div></div>
  </div>
</div>
