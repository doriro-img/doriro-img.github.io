<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #eef3f5;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #232838; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #647079; margin-bottom: 18px; font-weight: 600; }
  .hero { background: #0e9aa7; border-radius: 15px; padding: 18px 22px; color: #fff; margin-bottom: 14px; text-align: center; }
  .hero .big { font-size: 24px; font-weight: 800; line-height: 1.35; }
  .hero .big span { color: #d9f7f5; }
  .two { display: flex; gap: 13px; }
  .c { flex: 1; background: #fff; border-radius: 13px; padding: 15px 18px; border: 1px solid #d8e6e8;
    box-shadow: 0 5px 13px rgba(20,110,120,.06); }
  .c .l { font-size: 12.5px; font-weight: 800; margin-bottom: 4px; }
  .old .l { color: #99a2ab; } .new .l { color: #0a7783; }
  .c .d { font-size: 13.5px; color: #3a434e; line-height: 1.5; font-weight: 600; }
  .c .d b { color: #232838; }
</style>

<div id="art">
  <h1>에이전틱 AI가 뭔가요?</h1>
  <p class="sub">2026년 IT 업계 최대 화두예요</p>

  <div class="hero">
    <div class="big">쉽게 말하면<br/><span>'스스로 일하는 AI'</span>예요</div>
  </div>

  <div class="two">
    <div class="c old"><div class="l">지금까지 AI</div><div class="d">내가 <b>매번 시켜야</b> 움직여요. 질문하면 답을 주는 정도</div></div>
    <div class="c new"><div class="l">에이전틱 AI</div><div class="d"><b>목표만 던지면</b> 알아서 계획하고 끝까지 처리해요</div></div>
  </div>
</div>
