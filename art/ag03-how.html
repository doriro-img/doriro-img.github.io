<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #eef3f5;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #232838; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #647079; margin-bottom: 16px; font-weight: 600; }
  .three { display: flex; gap: 12px; margin-bottom: 14px; }
  .c { flex: 1; background: #fff; border-radius: 14px; padding: 16px 15px; text-align: center;
    box-shadow: 0 5px 13px rgba(20,110,120,.07); border: 1px solid #d8e6e8; }
  .ic { width: 52px; height: 52px; border-radius: 14px; background: #e2f4f3; margin: 0 auto 10px;
    display: flex; align-items: center; justify-content: center; font-size: 25px; }
  .c .t { font-size: 14.5px; font-weight: 800; color: #0a7783; margin-bottom: 4px; }
  .c .d { font-size: 12.5px; color: #55616b; line-height: 1.45; font-weight: 600; }
  .loop { background: #232838; border-radius: 13px; padding: 14px 20px; display: flex; align-items: center; justify-content: center;
    gap: 12px; flex-wrap: wrap; }
  .loop .step { color: #fff; font-size: 14.5px; font-weight: 800; }
  .loop .ar { color: #0e9aa7; font-size: 16px; font-weight: 800; }
</style>

<div id="art">
  <h1>어떻게 스스로 일하나요?</h1>
  <p class="sub">이 세 가지가 핵심이에요</p>

  <div class="three">
    <div class="c"><div class="ic">🎯</div><div class="t">자율성</div><div class="d">매 단계 지시 안 해도<br/>알아서 판단해요</div></div>
    <div class="c"><div class="ic">🪜</div><div class="t">다단계 실행</div><div class="d">한 번 답하고 끝이 아니라<br/>목표까지 계속 이어가요</div></div>
    <div class="c"><div class="ic">🔧</div><div class="t">도구 사용</div><div class="d">앱·검색·시스템을<br/>직접 조작해 행동해요</div></div>
  </div>

  <div class="loop">
    <span class="step">목표</span><span class="ar">→</span>
    <span class="step">계획</span><span class="ar">→</span>
    <span class="step">실행</span><span class="ar">→</span>
    <span class="step">평가</span><span class="ar">↻</span>
  </div>
</div>
