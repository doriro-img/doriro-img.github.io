<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #eef3f5;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #232838; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #647079; margin-bottom: 16px; font-weight: 600; }
  .stat { background: #232838; border-radius: 14px; padding: 16px 22px; color: #fff; margin-bottom: 13px;
    display: flex; align-items: center; gap: 20px; }
  .stat .big { font-size: 34px; font-weight: 800; color: #ff8a6b; line-height: 1; }
  .stat .r { font-size: 13.8px; line-height: 1.55; font-weight: 600; }
  .stat .r b { color: #f0b429; }
  .list { display: flex; flex-direction: column; gap: 9px; }
  .item { background: #fff; border-radius: 12px; padding: 12px 17px; display: flex; align-items: flex-start; gap: 13px;
    box-shadow: 0 4px 11px rgba(20,110,120,.05); border: 1px solid #d8e6e8; }
  .m { flex: none; width: 24px; height: 24px; border-radius: 7px; background: #e0932e; color: #fff;
    font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .tx { font-size: 13.8px; color: #3a434e; line-height: 1.45; padding-top: 1px; }
  .tx b { color: #232838; }
</style>

<div id="art">
  <h1>근데 아직 '만능'은 아니에요</h1>
  <p class="sub">기대는 크지만 현실은 냉정해요</p>

  <div class="stat">
    <div class="big">40%↑</div>
    <div class="r">시장조사기관 가트너는 <b>2027년 말까지 에이전틱 AI 프로젝트의 40% 이상이 중단</b>될 거라 전망했어요 (비용·불확실한 성과 때문)</div>
  </div>

  <div class="list">
    <div class="item"><div class="m">!</div><div class="tx"><b>일부만 틀려도 전체가 무너져요.</b> 여러 단계를 스스로 하다 보니 중간 실수 하나가 결과 전체를 망칠 수 있어요</div></div>
    <div class="item"><div class="m">!</div><div class="tx"><b>'에이전트 워싱'을 조심하세요.</b> 그냥 챗봇에 이름만 '에이전트'로 바꿔 파는 마케팅도 많아요</div></div>
    <div class="item"><div class="m">!</div><div class="tx">아직 초기 단계라, <b>중요한 일은 사람이 검토</b>하는 게 필수예요</div></div>
  </div>
</div>
