<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art {
    width: 860px; padding: 34px 40px 30px; background: linear-gradient(160deg,#f6f3ec,#ece5d4);
    font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; color: #33302a;
  }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #8a7a60; margin-bottom: 22px; font-weight: 600; }
  .card { display: flex; gap: 26px; background: #fffdf8; border: 1px solid #e6dcc8; border-radius: 16px;
    padding: 26px 28px; box-shadow: 0 6px 16px rgba(120,100,70,.08); align-items: center; }
  .photo { flex: none; text-align: center; }
  .cap { font-size: 11px; color: #b0a48a; margin-top: 6px; font-weight: 600; }
  .info { flex: 1; }
  .nm { font-size: 27px; font-weight: 800; }
  .nm .han { font-size: 16px; color: #9a8a6f; font-weight: 700; margin-left: 8px; }
  .rows { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
  .r { display: flex; gap: 11px; align-items: baseline; font-size: 14.5px; }
  .r .k { flex: none; width: 24px; height: 24px; border-radius: 7px; background: #ece2ce; color: #8a7a60;
    font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .r .v { color: #4a453b; line-height: 1.45; }
  .r .v b { color: #33302a; }
  .tags { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 12.5px; font-weight: 700; padding: 6px 13px; border-radius: 14px; background: #eaefe3; color: #5c6a4c; }
  .tag.warn { background: #f6e3e0; color: #b23a3a; }
</style>

<div id="art">
  <h1>하영 증조부, 안상호(安商浩)는 누구인가</h1>
  <p class="sub">한 인물의 두 얼굴 — 앞서간 의사, 그리고 친일 행적</p>

  <div class="card">
    <div class="photo">
      <svg width="150" height="158" viewBox="0 0 150 158">
        <clipPath id="cp"><circle cx="75" cy="76" r="70"/></clipPath>
        <circle cx="75" cy="76" r="70" fill="#e7dfce"/>
        <g clip-path="url(#cp)">
          <circle cx="75" cy="64" r="27" fill="#9a8a6f"/>
          <path d="M26,158 Q28,106 75,102 Q122,106 124,158 Z" fill="#9a8a6f"/>
          <path d="M75,102 L61,158 L75,128 L89,158 Z" fill="#83745a"/>
          <rect x="71" y="110" width="8" height="30" rx="2" fill="#75664e"/>
        </g>
        <circle cx="75" cy="76" r="70" fill="none" stroke="#d8ccb2" stroke-width="2"/>
      </svg>
      <div class="cap">※ 사진 아닌 실루엣</div>
    </div>

    <div class="info">
      <div class="nm">안상호<span class="han">安商浩 · 1876년생</span></div>
      <div class="rows">
        <div class="r"><span class="k">學</span><span class="v">1902년 일본 <b>동경자혜의학전문학교</b> 졸업</span></div>
        <div class="r"><span class="k">醫</span><span class="v">한국인 <b>최초로 일본 의사 자격증</b> 취득</span></div>
        <div class="r"><span class="k">院</span><span class="v">한반도 <b>첫 서양식 개인병원</b> 개설</span></div>
      </div>
      <div class="tags">
        <span class="tag">4대째 의사 집안의 시작점</span>
        <span class="tag warn">● 친일 행적 논란</span>
      </div>
    </div>
  </div>
</div>
