<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art {
    width: 860px; padding: 34px 40px 30px; background: #f4f1ea;
    font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; color: #33302a;
  }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #8a7a60; margin-bottom: 20px; font-weight: 600; }
  .plate { background: linear-gradient(#6b5a45,#584734); color: #f4ecd8; text-align: center;
    font-size: 23px; font-weight: 800; padding: 15px; border-radius: 12px; letter-spacing: 3px;

  .legend { display: flex; gap: 22px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .lg { font-size: 13.5px; font-weight: 700; color: #4a453b; display: flex; align-items: center; gap: 8px; }
  .lg::before { content: ""; width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
  .lg.red::before { background: #b23a3a; }
  .lg.dark::before { background: #5a5140; }
  .lg.light::before { background: #c9bda3; }
  .glabel { font-size: 12.5px; font-weight: 800; font-family: 'Pretendard','Malgun Gothic',sans-serif; }
</style>
