<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art {
    width: 860px; padding: 34px 40px 30px; background: #f4f1ea;
    font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; color: #33302a;
  }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #8a7a60; margin-bottom: 20px; font-weight: 600; }
  .paper { background: #fbf8f1; border: 1px solid #ddd0b8; border-radius: 12px; overflow: hidden;
    box-shadow: 0 6px 18px rgba(90,70,45,.1); }
  .mast { background: #4a3f2e; color: #f2e9d4; text-align: center; font-size: 19px; font-weight: 800;
    letter-spacing: 2px; padding: 13px; border-bottom: 3px double #8a7a60; }
  .body { padding: 30px 40px 26px; position: relative; }
  .quote { font-family: 'Batang', 'Apple SD Gothic Neo', serif; font-size: 27px; line-height: 1.7;
    font-weight: 700; color: #2a2620; text-align: center; position: relative; }
  .quote .mk { color: #b23a3a; font-size: 40px; font-weight: 800; }
  .by { text-align: right; margin-top: 18px; font-size: 14px; color: #8a7a60; font-weight: 700; }
  .note { margin-top: 16px; background: #fff; border: 1px solid #ecdfd0; border-left: 4px solid #b23a3a;
    border-radius: 8px; padding: 14px 18px; font-size: 13.5px; color: #5a5142; line-height: 1.65; }
  .note b { color: #b23a3a; }
</style>

<div id="art">
  <h1>1918년, 매일신보 인터뷰</h1>
  <p class="sub">조선총독부 기관지에 실린 발언 — 내선일체 선전에 그대로 이용됐습니다</p>

  <div class="paper">
    <div class="mast">每日申報 · 매일신보 　1918</div>
    <div class="body">
      <div class="quote"><span class="mk">“</span>나는 일본 사람과 똑같다.<br />조선 옷은 한 벌도 없고,<br />조선 사람과 상종하지 않는다<span class="mk">”</span></div>
      <div class="by">— 안상호, 매일신보 인터뷰 중</div>
    </div>
  </div>

  <div class="note"><b>이것만이 아니에요.</b> 자녀도 완전히 일본식으로 양육했고, 집에서 조선어를 쓰는 것 외에는 생활 전부가 일본식이었다고 전해집니다</div>
</div>
