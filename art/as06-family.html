<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art {
    width: 860px; padding: 34px 40px 30px; background: #f4f1ea;
    font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; color: #33302a;
  }
  h1 { font-size: 22px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #8a7a60; margin-bottom: 20px; font-weight: 600; }
  .tree { display: flex; align-items: stretch; }
  .node { flex: 1; background: #fffdf8; border: 2px solid #e6dcc8; border-radius: 14px;
    padding: 16px 8px 15px; text-align: center; }
  .node.warn { border-color: #e6b2aa; }
  .node.warn2 { border-color: #e8c79a; }
  .node.ok { border-color: #bcd0c4; }
  .gen { font-size: 12px; font-weight: 800; color: #8a7a60; letter-spacing: 1px; }
  .name { font-size: 17px; font-weight: 800; margin-top: 2px; }
  .tagl { margin-top: 9px; font-size: 11.5px; font-weight: 700; padding: 5px 9px; border-radius: 10px;
    display: inline-block; line-height: 1.3; }
  .warn .tagl { background: #f6e3e0; color: #b23a3a; }
  .warn2 .tagl { background: #f7ecd6; color: #b5822a; }
  .ok .tagl { background: #e7f0ea; color: #4c7a5f; }
  .arrow { flex: none; width: 30px; display: flex; align-items: center; justify-content: center;
    color: #cabfa6; font-size: 20px; font-weight: 800; }
  .foot { margin-top: 18px; text-align: center; font-size: 13px; color: #8a7a60; line-height: 1.6; }
  .foot b { color: #b23a3a; }
</style>

<div id="art">
  <h1>안상호 · 안부호 · 하영 — 4대, 섞지 말고 보기</h1>
  <p class="sub">세대마다 사안이 다릅니다. 조상의 일과 후손의 일은 나눠서 봐야죠</p>

  <div class="tree">
    <div class="node warn">
      <div class="gen">증조부</div>
      <svg width="56" height="58" viewBox="0 0 56 58"><clipPath id="s1"><circle cx="28" cy="26" r="24"/></clipPath>
        <circle cx="28" cy="26" r="24" fill="#f6e3e0"/><g clip-path="url(#s1)"><circle cx="28" cy="21" r="11" fill="#c98a82"/><path d="M9,58 Q10,39 28,37 Q46,39 47,58 Z" fill="#c98a82"/></g></svg>
      <div class="name">안상호</div>
      <div class="tagl">친일 행적 논란</div>
    </div>

    <div class="arrow">→</div>

    <div class="node warn2">
      <div class="gen">조부</div>
      <svg width="56" height="58" viewBox="0 0 56 58"><clipPath id="s2"><circle cx="28" cy="26" r="24"/></clipPath>
        <circle cx="28" cy="26" r="24" fill="#f7ecd6"/><g clip-path="url(#s2)"><circle cx="28" cy="21" r="11" fill="#cda869"/><path d="M9,58 Q10,39 28,37 Q46,39 47,58 Z" fill="#cda869"/></g></svg>
      <div class="name">안부호</div>
      <div class="tagl">소록도 근무 논란</div>
    </div>

    <div class="arrow">→</div>

    <div class="node ok">
      <div class="gen">아버지</div>
      <svg width="56" height="58" viewBox="0 0 56 58"><clipPath id="s3"><circle cx="28" cy="26" r="24"/></clipPath>
        <circle cx="28" cy="26" r="24" fill="#e7f0ea"/><g clip-path="url(#s3)"><circle cx="28" cy="21" r="11" fill="#86a894"/><path d="M9,58 Q10,39 28,37 Q46,39 47,58 Z" fill="#86a894"/></g></svg>
      <div class="name">아버지</div>
      <div class="tagl">의사 (일반인)</div>
    </div>

    <div class="arrow">→</div>

    <div class="node ok">
      <div class="gen">본인</div>
      <svg width="56" height="58" viewBox="0 0 56 58"><clipPath id="s4"><circle cx="28" cy="26" r="24"/></clipPath>
        <circle cx="28" cy="26" r="24" fill="#e7f0ea"/><g clip-path="url(#s4)"><circle cx="28" cy="21" r="11" fill="#86a894"/><path d="M9,58 Q10,39 28,37 Q46,39 47,58 Z" fill="#86a894"/></g></svg>
      <div class="name">하영</div>
      <div class="tagl">몰랐다며 사과</div>
    </div>
  </div>

  <p class="foot">증조부의 <b>친일</b>과 조부의 <b>소록도 건</b>은 세대도 사안도 다른 별개예요. 후손이 조상의 모든 행적에 책임지는 건 아니고요</p>
</div>
