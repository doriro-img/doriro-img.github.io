<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art {
    width: 860px; padding: 34px 40px 30px; background: #f6f7f9;
    font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; color: #1b1b1b;
  }
  h1 { font-size: 21px; letter-spacing: -0.4px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #757f8c; margin-bottom: 24px; }

  .row { display: flex; align-items: stretch; gap: 18px; }
  .card { flex: 1; background: #fff; border-radius: 14px; padding: 22px 22px 20px; box-shadow: 0 6px 16px rgba(80,95,120,.08); }
  .scene { height: 108px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .s1 { background: #eef7ea; }
  .s2 { background: #eef2fb; }
  .word { font-size: 19px; font-weight: 800; }
  .card.a .word { color: #3b8a4e; }
  .card.b .word { color: #4a72c0; }
  .han { font-size: 13px; color: #9aa4af; font-weight: 600; margin-left: 6px; }
  .desc { margin-top: 8px; font-size: 14px; line-height: 1.75; color: #48505a; }
  .desc b { color: #1b1b1b; }
  .when { margin-top: 12px; display: inline-block; font-size: 12.5px; padding: 5px 12px; border-radius: 16px; }
  .card.a .when { background: #eaf6e6; color: #3b8a4e; }
  .card.b .when { background: #eaf0fb; color: #4a72c0; }

  .mid { align-self: center; font-size: 13px; color: #9aa4af; font-weight: 700; white-space: nowrap; }
  .note { margin-top: 20px; background: #fff; border-radius: 10px; padding: 14px 18px; font-size: 13.5px; color: #48505a; line-height: 1.7; border: 1px solid #e8ebf0; }
  .note b { color: #1b1b1b; }
</style>

<div id="art">
  <h1>벌초와 성묘, 뭐가 다른가요?</h1>
  <p class="sub">헷갈리기 쉬운데 하나는 '작업', 하나는 '인사'입니다</p>

  <div class="row">
    <div class="card a">
      <div class="scene s1">
        <svg width="120" height="80" viewBox="0 0 120 80">
          <rect x="0" y="62" width="120" height="6" rx="3" fill="#bfe0b3"/>
          <g stroke="#7cbf82" stroke-width="3" stroke-linecap="round">
            <line x1="18" y1="62" x2="18" y2="46"/><line x1="30" y1="62" x2="30" y2="42"/><line x1="42" y1="62" x2="42" y2="48"/>
          </g>
          <path d="M70 30 q26 2 34 24" fill="none" stroke="#8a8f96" stroke-width="4" stroke-linecap="round"/>
          <path d="M104 54 a10 10 0 0 1 -18 6" fill="none" stroke="#c9ccd1" stroke-width="6" stroke-linecap="round"/>
          <line x1="66" y1="26" x2="78" y2="36" stroke="#6b4f2a" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </div>
      <div><span class="word">벌초</span><span class="han">伐草 · 풀을 베다</span></div>
      <p class="desc">묘의 <b>잡초·잡목을 베어</b> 정리하는 작업입니다. 낫이나 예초기로 하는 힘쓰는 일이에요.</p>
      <span class="when">추석 2~3주 전 (음력 7월 말경)</span>
    </div>

    <div class="mid">VS</div>

    <div class="card b">
      <div class="scene s2">
        <svg width="120" height="80" viewBox="0 0 120 80">
          <rect x="0" y="62" width="120" height="6" rx="3" fill="#c3d0ea"/>
          <path d="M40 62 a20 20 0 0 1 40 0Z" fill="#dfe7f5" stroke="#b9c6e2" stroke-width="2"/>
          <circle cx="94" cy="40" r="7" fill="#8fa8d6"/>
          <rect x="90" y="47" width="8" height="15" rx="4" fill="#8fa8d6"/>
          <g stroke="#e8a24b" stroke-width="2" stroke-linecap="round"><line x1="20" y1="40" x2="20" y2="30"/><line x1="26" y1="42" x2="26" y2="32"/></g>
          <rect x="15" y="42" width="16" height="12" rx="2" fill="#f0d19a"/>
        </svg>
      </div>
      <div><span class="word">성묘</span><span class="han">省墓 · 묘를 살피다</span></div>
      <p class="desc">조상 묘를 찾아 <b>살피고 절하는</b> 의례입니다. 벌초로 정리된 묘에서 인사를 드려요.</p>
      <span class="when">설 · 한식 · 추석 등 명절</span>
    </div>
  </div>

  <div class="note">
    <b>한 줄 정리</b> — 설·한식엔 성묘만 하고 벌초는 안 합니다. 벨 풀이 없거든요. 벌초는 추석 성묘를 위한 <b>사전 정비</b> 성격이에요.
  </div>
</div>
