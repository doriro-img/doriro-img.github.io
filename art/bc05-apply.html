<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art {
    width: 860px; padding: 34px 40px 30px; background: #f2f7f6;
    font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; color: #1b1b1b;
  }
  h1 { font-size: 21px; letter-spacing: -0.4px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6d8582; margin-bottom: 22px; }

  .ch { display: flex; gap: 12px; margin-bottom: 20px; }
  .c { flex: 1; background: #fff; border-radius: 12px; padding: 18px 12px; text-align: center; box-shadow: 0 4px 12px rgba(70,110,105,.07); }
  .cico { width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 10px; background: #e6f2ef; display: flex; align-items: center; justify-content: center; }
  .c h3 { font-size: 14px; margin-bottom: 3px; }
  .c p { font-size: 12px; color: #7d918e; line-height: 1.5; }

  .two { display: flex; gap: 12px; }
  .box { flex: 1; border-radius: 12px; padding: 16px 18px; }
  .disc { background: #fff6e8; border: 1px solid #f0dcb4; }
  .disc h3 { font-size: 14px; color: #c6871f; margin-bottom: 8px; }
  .disc .li { font-size: 13px; color: #6b5f45; line-height: 1.9; }
  .disc b { color: #c6871f; }
  .warn { background: #fdeee6; border: 1px solid #f2cbb8; display: flex; align-items: center; }
  .warn p { font-size: 13.5px; color: #a24a2f; line-height: 1.65; }
  .warn b { color: #c1462f; }
  .foot { margin-top: 14px; font-size: 12px; color: #90a5a2; }
</style>

<div id="art">
  <h1>산림조합 벌초 대행 신청하는 법</h1>
  <p class="sub">사설업체보다 저렴하고 조합원은 할인까지 됩니다</p>

  <div class="ch">
    <div class="c">
      <div class="cico"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 4 h4 l2 5 -3 2 a10 10 0 0 0 5 5 l2 -3 5 2 v4 a2 2 0 0 1 -2 2 A16 16 0 0 1 3 6 a2 2 0 0 1 2 -2Z" fill="#4fa08a"/></svg></div>
      <h3>전화</h3><p>지역 산림조합에<br />직접 문의</p>
    </div>
    <div class="c">
      <div class="cico"><svg width="24" height="24" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" fill="#4fa08a"/><rect x="8" y="18" width="8" height="2" rx="1" fill="#4fa08a"/></svg></div>
      <h3>인터넷</h3><p>iforest.<br />nfcf.or.kr</p>
    </div>
    <div class="c">
      <div class="cico"><svg width="24" height="24" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2" fill="#4fa08a"/><rect x="10" y="17" width="4" height="2" rx="1" fill="#fff"/></svg></div>
      <h3>모바일</h3><p>m.nfcf.or.kr<br />에서 신청</p>
    </div>
    <div class="c">
      <div class="cico"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 11 L12 4 L20 11 v9 h-5 v-6 h-6 v6 H4Z" fill="#4fa08a"/></svg></div>
      <h3>방문</h3><p>가까운 조합<br />직접 방문</p>
    </div>
  </div>

  <div class="two">
    <div class="box disc">
      <h3>이런 할인이 있어요</h3>
      <div class="li">· 산림조합원 <b>10% 할인</b><br />· 3년 이상 연속 이용 시 <b>추가 5%</b></div>
    </div>
    <div class="box warn">
      <p>⏰ 성수기엔 <b>조기 마감</b>됩니다.<br />늦어도 <b>8월 중</b>엔 예약하세요.</p>
    </div>
  </div>

  <p class="foot">출처: 산림조합중앙회 iforest · 서비스 범위엔 잔디 보수·묘역 조경도 포함됩니다</p>
</div>
