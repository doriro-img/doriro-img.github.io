<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #eef4f4;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #26384a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #5f7480; margin-bottom: 18px; font-weight: 600; }
  .hero { background: #218b82; border-radius: 15px; padding: 18px 22px; color: #fff; text-align: center; margin-bottom: 13px; }
  .hero .l { font-size: 13.5px; font-weight: 700; opacity: .92; }
  .hero .v { font-size: 34px; font-weight: 800; margin-top: 3px; }
  .hero .v small { font-size: 17px; font-weight: 700; }
  .two { display: flex; gap: 13px; margin-bottom: 14px; }
  .c { flex: 1; background: #fff; border-radius: 14px; padding: 15px 18px; text-align: center;
    box-shadow: 0 5px 13px rgba(40,110,100,.07); border: 1px solid #d8e6e3; }
  .c .l { font-size: 12.5px; font-weight: 800; color: #5f7480; }
  .c .v { font-size: 21px; font-weight: 800; color: #e07a5f; margin-top: 4px; }
  .c .v small { font-size: 13px; color: #8a7566; font-weight: 700; }
  .box { background: #fff3ec; border: 1.5px solid #f3c3ac; border-radius: 12px; padding: 13px 18px;
    font-size: 13.5px; color: #b0472c; line-height: 1.6; font-weight: 600; }
  .box b { color: #8a2f1a; }
</style>

<div id="art">
  <h1>간병비, 생각보다 무서워요</h1>
  <p class="sub">한 번 길게 아프면 목돈이 통째로 나가요</p>

  <div class="hero">
    <div class="l">개인 간병인 1:1, 하루 평균</div>
    <div class="v">12만 ~ 15만원</div>
  </div>

  <div class="two">
    <div class="c"><div class="l">한 달 꼬박 쓰면</div><div class="v">약 370만원<small> 이상</small></div></div>
    <div class="c"><div class="l">몇 달 길어지면</div><div class="v">천만원<small> 단위로</small></div></div>
  </div>

  <div class="box"><b>'간병 파산'이라는 말이 괜히 나온 게 아니더라고요.</b> 초고령사회로 접어들면서, 부모님이든 나든 언젠가 마주할 수 있는 현실 비용이에요</div>
</div>
