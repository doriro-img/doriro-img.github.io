<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #eef4f4;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #26384a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #5f7480; margin-bottom: 18px; font-weight: 600; }
  .two { display: flex; gap: 13px; margin-bottom: 13px; }
  .col { flex: 1; background: #fff; border-radius: 14px; padding: 16px 18px; border: 1px solid #d8e6e3;
    box-shadow: 0 5px 13px rgba(40,110,100,.06); }
  .col .h { font-size: 15px; font-weight: 800; margin-bottom: 10px; }
  .gen .h { color: #e07a5f; } .fix .h { color: #218b82; }
  .yr { display: flex; align-items: center; justify-content: space-between; font-size: 13px; padding: 5px 0; }
  .yr .a { color: #5f7480; font-weight: 700; }
  .yr .b { font-weight: 800; }
  .gen .b { color: #d85f3c; } .fix .b { color: #1a6b64; }
  .col .cap { font-size: 12px; color: #8a97a0; margin-top: 8px; line-height: 1.5; font-weight: 600; }
  .tip { background: #e7f2f0; border: 1.5px solid #b7ddd7; border-radius: 12px; padding: 13px 18px;
    font-size: 13.5px; color: #176b62; line-height: 1.6; font-weight: 600; }
  .tip b { color: #0f544c; }
</style>

<div id="art">
  <h1>보험료랑 갱신, 이게 핵심이에요</h1>
  <p class="sub">싸 보여도 나중에 확 오를 수 있어요</p>

  <div class="two">
    <div class="col gen">
      <div class="h">갱신형 (싸게 시작)</div>
      <div class="yr"><span class="a">40세</span><span class="b">월 5,000원</span></div>
      <div class="yr"><span class="a">45세 갱신</span><span class="b">월 6,200원</span></div>
      <div class="yr"><span class="a">55세 갱신</span><span class="b">월 12,500원 ↑</span></div>
      <div class="cap">나이 들수록 계속 올라요 (예시)</div>
    </div>
    <div class="col fix">
      <div class="h">비갱신형 (고정)</div>
      <div class="yr"><span class="a">초기 보험료</span><span class="b">다소 높음</span></div>
      <div class="yr"><span class="a">납입 기간 후</span><span class="b">인상 없음</span></div>
      <div class="yr"><span class="a">만기까지</span><span class="b">그대로 보장</span></div>
      <div class="cap">길게 보면 부담이 예측돼요</div>
    </div>
  </div>

  <div class="tip"><b>50~65세에 가입하는 게 보험료·보장 다 유리</b>하다고 해요. 보통 75세가 넘으면 신규 가입 자체가 어려워지니, 필요하다면 미루지 않는 게 좋아요</div>
</div>
