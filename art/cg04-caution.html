<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #eef4f4;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #26384a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #5f7480; margin-bottom: 18px; font-weight: 600; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { background: #fff; border-radius: 12px; padding: 13px 18px; display: flex; align-items: flex-start; gap: 13px;
    box-shadow: 0 5px 13px rgba(40,110,100,.06); border: 1px solid #d8e6e3; }
  .q { flex: none; width: 26px; height: 26px; border-radius: 7px; background: #218b82; color: #fff;
    font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .tx { font-size: 14px; line-height: 1.5; color: #3a4a5a; padding-top: 2px; }
  .tx b { color: #26384a; }
  .foot { margin-top: 14px; background: #fbf0e4; border: 1.5px solid #f0d3a8; border-radius: 12px; padding: 13px 18px;
    font-size: 13px; color: #9a5a1e; line-height: 1.6; font-weight: 600; }
  .foot b { color: #b5822a; }
</style>

<div id="art">
  <h1>가입 전, 이건 꼭 따지세요 (분쟁 1순위)</h1>
  <p class="sub">약관 문구 하나로 보험금이 갈려요</p>

  <div class="list">
    <div class="item"><div class="q">?</div><div class="tx"><b>가족 간병도 인정되나요?</b> 가족이 돌보면 안 주는 보험사도 있어요</div></div>
    <div class="item"><div class="q">?</div><div class="tx"><b>어느 병원이 되나요?</b> 상급종합·요양병원 등 적용 병원 종류가 정해져 있어요</div></div>
    <div class="item"><div class="q">?</div><div class="tx"><b>입원 간병만? 통원도?</b> 지급 대상 범위를 약관에서 확인해야 해요</div></div>
    <div class="item"><div class="q">?</div><div class="tx"><b>청구 기간이 있나요?</b> 간병 끝나고 일정 기간 안에 청구해야 하는 경우가 많아요</div></div>
  </div>

  <div class="foot"><b>보험금 분쟁이 유독 잦은 상품이에요.</b> 이의가 있으면 보험사 콜센터 → 그래도 안 풀리면 금융감독원 금융소비자보호처에 분쟁조정을 신청할 수 있어요</div>
</div>
