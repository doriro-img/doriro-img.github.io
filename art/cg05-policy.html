<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #eef4f4;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #26384a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #5f7480; margin-bottom: 16px; font-weight: 600; }
  .gov { background: #fff; border-radius: 15px; padding: 17px 20px; border: 1px solid #d8e6e3;
    box-shadow: 0 5px 13px rgba(40,110,100,.06); margin-bottom: 13px; }
  .gov .h { font-size: 14.5px; font-weight: 800; color: #3a7ca5; margin-bottom: 12px; }
  .arrow { display: flex; align-items: center; gap: 14px; }
  .pill { flex: 1; text-align: center; border-radius: 11px; padding: 12px 8px; }
  .before { background: #f4e7e3; } .after { background: #e2f1ee; }
  .pill .l { font-size: 12px; font-weight: 700; color: #7a7066; }
  .after .l { color: #4a7a72; }
  .pill .v { font-size: 19px; font-weight: 800; margin-top: 2px; }
  .before .v { color: #c0563c; } .after .v { color: #1a6b64; }
  .ar { font-size: 22px; color: #9aa6ae; font-weight: 800; }
  .gov .note { font-size: 12.5px; color: #5f7480; margin-top: 11px; line-height: 1.5; font-weight: 600; }
  .gap { background: #fbf0e4; border: 1.5px solid #f0d3a8; border-radius: 12px; padding: 14px 18px;
    font-size: 13.5px; color: #9a5a1e; line-height: 1.6; font-weight: 600; }
  .gap b { color: #b5822a; }
</style>

<div id="art">
  <h1>정부가 간병비 지원한다던데요?</h1>
  <p class="sub">2027년부터 시작해요. 근데 아직 갭이 있어요</p>

  <div class="gov">
    <div class="h">요양병원 간병비, 건강보험 적용 (2027년~ 단계 시행)</div>
    <div class="arrow">
      <div class="pill before"><div class="l">지금 본인부담</div><div class="v">100%</div></div>
      <div class="ar">→</div>
      <div class="pill after"><div class="l">지원 후</div><div class="v">30% 안팎</div></div>
    </div>
    <div class="note">월 200만~267만원 간병비가 약 60만~80만원까지 줄어들 걸로 추산돼요</div>
  </div>

  <div class="gap"><b>단, 요양병원 중증 환자부터 단계적으로 시작해요.</b> 일반 병원 입원 간병이나 경증까지 다 커버되는 건 아니라서, 그 빈자리를 사보험으로 채울지 고민하게 되는 거예요</div>
</div>
