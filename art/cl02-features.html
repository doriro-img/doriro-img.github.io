<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f1f1fb;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2a2a3a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6b6b80; margin-bottom: 16px; font-weight: 600; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; border-radius: 13px; overflow: hidden;
    box-shadow: 0 5px 13px rgba(80,80,180,.07); border: 1px solid #e2e2f2; }
  th, td { padding: 12px 10px; text-align: center; font-size: 14px; border-bottom: 1px solid #eeedf8; }
  th { background: #6366e0; color: #fff; font-weight: 800; font-size: 13.5px; }
  th:first-child, td:first-child { text-align: left; padding-left: 18px; font-weight: 700; color: #3a3a4a; }
  tr:last-child td { border-bottom: none; }
  .o { color: #35b37e; font-weight: 800; font-size: 16px; }
  .x { color: #c9c9d6; font-weight: 800; font-size: 16px; }
  .note { margin-top: 13px; background: #edecfb; border: 1.5px solid #d4d3f2; border-radius: 12px; padding: 13px 18px;
    font-size: 13.5px; color: #4a4bc4; line-height: 1.6; font-weight: 600; }
  .note b { color: #3634a8; }
</style>

<div id="art">
  <h1>돈 내면 뭐가 달라지나요?</h1>
  <p class="sub">무료와 Pro 사이에 큰 벽이 있어요</p>

  <table>
    <tr><th>기능</th><th>무료</th><th>Pro 이상</th></tr>
    <tr><td>Opus (최상위 모델)</td><td class="x">✕</td><td class="o">○</td></tr>
    <tr><td>프로젝트(Projects)</td><td class="x">✕</td><td class="o">○</td></tr>
    <tr><td>Claude Code (코딩 도구)</td><td class="x">✕</td><td class="o">○</td></tr>
    <tr><td>MCP 연동 · 확장 사고</td><td class="x">✕</td><td class="o">○</td></tr>
  </table>

  <div class="note"><b>포인트 두 개예요.</b> ① 고급 기능은 죄다 Pro부터 열려요. ② <b>Pro든 Max든 '기능'은 똑같아요.</b> Max는 기능을 더 주는 게 아니라 '사용량'만 5배·20배로 늘린 거예요</div>
</div>
