<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f4f5f8;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #22314a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6f7c92; margin-bottom: 24px; font-weight: 600; }
  .tl { display: flex; align-items: stretch; gap: 0; }
  .st { flex: 1; background: #fff; border-radius: 14px; padding: 18px 18px; box-shadow: 0 6px 15px rgba(40,60,100,.07);
    border: 1px solid #e2e6ee; }
  .st.on { border: 1.5px solid #c0922f; background: #fdfaf2; }
  .yr { font-size: 15px; font-weight: 800; color: #2c3e5c; }
  .st.on .yr { color: #c0922f; }
  .wh { font-size: 15px; font-weight: 800; margin-top: 5px; }
  .de { font-size: 12.5px; color: #6f7c92; margin-top: 4px; line-height: 1.45; }
  .arr { flex: none; display: flex; align-items: center; padding: 0 12px; color: #b3bccb; font-size: 22px; font-weight: 800; }
  .note { margin-top: 16px; background: #eaeef6; border-radius: 12px; padding: 13px 18px; font-size: 13px;
    color: #45526c; line-height: 1.6; text-align: center; }
  .note b { color: #22314a; }
</style>

<div id="art">
  <h1>지금 친일재산 환수가 다시 이슈예요</h1>
  <p class="sub">'친일재산조사위원회'가 16년 만에 부활했어요</p>

  <div class="tl">
    <div class="st">
      <div class="yr">2006년</div>
      <div class="wh">1기 조사위 설치</div>
      <div class="de">대통령 직속으로 4년간 활동</div>
    </div>
    <div class="arr">→</div>
    <div class="st">
      <div class="yr">2010년</div>
      <div class="wh">활동 종료</div>
      <div class="de">이후 16년간 전담기구 없음</div>
    </div>
    <div class="arr">→</div>
    <div class="st on">
      <div class="yr">2026년 12월 3일</div>
      <div class="wh">특별법 시행 · 조사위 부활</div>
      <div class="de">환수 다시 시작</div>
    </div>
  </div>

  <div class="note">8·15 광복절을 계기로 <b>친일재산 환수를 다시 추진</b>하기로 하면서, 조사·환수 전담기구가 16년 만에 되살아났어요</div>
</div>
