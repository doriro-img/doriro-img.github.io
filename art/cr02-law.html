<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f4f5f8;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #22314a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6f7c92; margin-bottom: 18px; font-weight: 600; }
  .law { background: #2c3e5c; border-radius: 14px; padding: 15px 22px; text-align: center; margin-bottom: 20px; }
  .law .t { font-size: 16.5px; font-weight: 800; color: #fff; }
  .law .y { font-size: 12.5px; color: #b9c6dd; font-weight: 700; margin-top: 3px; }
  .flow { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .box { background: #fff; border-radius: 16px; padding: 20px 18px; text-align: center; box-shadow: 0 6px 15px rgba(40,60,100,.07);
    border: 1px solid #e2e6ee; width: 210px; }
  .box .ic { height: 60px; display: flex; align-items: center; justify-content: center; }
  .box .l { font-size: 14.5px; font-weight: 800; margin-top: 6px; }
  .box .s { font-size: 12px; color: #6f7c92; margin-top: 3px; line-height: 1.4; }
  .mid { text-align: center; }
  .mid .a { color: #c0922f; font-size: 26px; font-weight: 800; }
  .mid .m { font-size: 12.5px; font-weight: 800; color: #c0922f; margin-top: 2px; }
</style>

<div id="art">
