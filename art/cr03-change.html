<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f4f5f8;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #22314a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6f7c92; margin-bottom: 20px; font-weight: 600; }
  .two { display: flex; gap: 16px; align-items: stretch; }
  .p { flex: 1; border-radius: 16px; padding: 22px; text-align: center; }
  .old { background: #eceef2; border: 1px solid #dce0e8; }
  .new { background: #fdfaf2; border: 1.5px solid #c0922f; }
  .tag { font-size: 13px; font-weight: 800; padding: 4px 13px; border-radius: 14px; display: inline-block; margin-bottom: 12px; }
  .old .tag { background: #d8dce4; color: #6f7c92; } .new .tag { background: #f0e2c2; color: #a9791f; }
  .ic { height: 72px; display: flex; align-items: center; justify-content: center; }
  .p .d { font-size: 15px; color: #45526c; line-height: 1.5; margin-top: 8px; }
  .p .d b { color: #22314a; }
  .new .d b { color: #a9791f; }
  .res { margin-top: 6px; font-size: 15px; font-weight: 800; }
  .old .res { color: #8894a8; } .new .res { color: #2c3e5c; }
</style>

<div id="art">
  <h1>이번 핵심 — '이미 팔았어도' 환수해요</h1>
  <p class="sub">가장 큰 변화예요. 후손이 처분한 대가까지 추적합니다</p>

  <div class="two">
    <div class="p old">
      <span class="tag">예전</span>
      <div class="ic"><svg width="90" height="66" viewBox="0 0 90 66"><path d="M20,30 L34,20 L48,30 Z" fill="#b6bcc8"/><rect x="26" y="30" width="16" height="16" fill="#c7ccd6"/><path d="M52,24 h22 M68,18 l8,6 -8,6" fill="none" stroke="#b6bcc8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="46" r="14" fill="#e6e0e0"/><path d="M64,40 l12,12 M76,40 l-12,12" stroke="#c0392b" stroke-width="3" stroke-linecap="round" opacity="0.6"/></svg></div>
      <div class="d">후손이 재산을<br /><b>팔아넘기면</b></div>
      <div class="res">환수 어려웠음</div>
    </div>
    <div class="p new">
      <span class="tag">이번</span>
      <div class="ic"><svg width="90" height="66" viewBox="0 0 90 66"><circle cx="34" cy="28" r="15" fill="none" stroke="#2c3e5c" stroke-width="4"/><line x1="45" y1="39" x2="58" y2="52" stroke="#2c3e5c" stroke-width="5" stroke-linecap="round"/><circle cx="34" cy="28" r="8" fill="#c0922f"/><text x="34" y="32" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">₩</text><path d="M64,46 l6,6 10,-12" fill="none" stroke="#2c9a5c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="d">판 돈 <b>(처분 대가)</b>까지<br />끝까지 추적해서</div>
      <div class="res">환수 대상</div>
    </div>
  </div>
</div>
