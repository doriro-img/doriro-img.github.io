<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f4f5f8;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #22314a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6f7c92; margin-bottom: 20px; font-weight: 600; }
  .two { display: flex; gap: 16px; align-items: stretch; }
  .c { flex: 1; background: #fff; border-radius: 16px; padding: 20px 22px; box-shadow: 0 6px 15px rgba(40,60,100,.07); border: 1px solid #e2e6ee; }
  .c.g { border: 1.5px solid #c0922f; background: #fdfaf2; }
  .ct { font-size: 15px; font-weight: 800; margin-bottom: 14px; }
  .c1 .ct { color: #2c3e5c; } .c.g .ct { color: #a9791f; }
  .stat { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0; border-bottom: 1px dashed #e6e9f0; }
  .stat:last-child { border-bottom: 0; }
  .stat .k { font-size: 13px; color: #6f7c92; font-weight: 700; }
  .stat .v { font-size: 17px; font-weight: 800; color: #2c3e5c; }
  .big { text-align: center; padding: 14px 0 4px; }
  .big .n { font-size: 34px; font-weight: 800; color: #c0922f; letter-spacing: -1px; }
  .big .l { font-size: 13px; color: #8a7333; font-weight: 700; margin-top: 4px; }
</style>

<div id="art">
  <h1>1기가 환수한 규모, 그리고 2기 목표</h1>
  <p class="sub">2006~2010년 1기 조사위가 이만큼 되찾았어요</p>

  <div class="two">
    <div class="c c1">
      <div class="ct">1기 조사위 (2006~2010)</div>
      <div class="stat"><span class="k">조사한 친일행위자</span><span class="v">168명</span></div>
      <div class="stat"><span class="k">환수 토지</span><span class="v">2,359필지</span></div>
      <div class="stat"><span class="k">환수 규모 (시가)</span><span class="v">약 2,106억원</span></div>
    </div>
    <div class="c g">
      <div class="ct">2기 조사위 (부활) 목표</div>
      <div class="big">
        <div class="n">최소 325억+</div>
        <div class="l">추가 환수 예상</div>
      </div>
      <div class="stat" style="justify-content:center;border-top:1px dashed #ecdcb5;border-bottom:0;margin-top:8px;padding-top:12px;"><span class="k" style="color:#a9791f;">이번엔 처분 대가까지 포함</span></div>
    </div>
  </div>
</div>
