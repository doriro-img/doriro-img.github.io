<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f4f5f8;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #22314a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6f7c92; margin-bottom: 22px; font-weight: 600; }
  .steps { display: flex; align-items: stretch; gap: 8px; }
  .step { flex: 1; background: #fff; border-radius: 16px; padding: 20px 16px 18px; text-align: center;
    box-shadow: 0 6px 15px rgba(40,60,100,.07); border: 1px solid #e2e6ee; }
  .n { width: 30px; height: 30px; border-radius: 50%; background: #2c3e5c; color: #fff; font-size: 15px;
    font-weight: 800; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
  .ic { height: 54px; display: flex; align-items: center; justify-content: center; }
  .t { font-size: 15px; font-weight: 800; margin-top: 8px; }
  .d { font-size: 12.5px; color: #6f7c92; line-height: 1.5; margin-top: 5px; }
  .ar { flex: none; display: flex; align-items: center; color: #b3bccb; font-size: 22px; font-weight: 800; }
</style>

<div id="art">
  <h1>앞으로 어떻게 되나요?</h1>
  <p class="sub">2026년 12월 3일부터 조사·환수가 본격 시작돼요</p>

  <div class="steps">
    <div class="step">
      <div class="n">1</div>
      <div class="ic"><svg width="46" height="48" viewBox="0 0 46 48"><rect x="10" y="6" width="26" height="36" rx="3" fill="#2c3e5c"/><line x1="16" y1="16" x2="30" y2="16" stroke="#fff" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="23" x2="30" y2="23" stroke="#fff" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="30" x2="24" y2="30" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></div>
      <div class="t">특별법 시행</div>
      <div class="d">2026년 12월 3일</div>
    </div>
    <div class="ar">→</div>
    <div class="step">
      <div class="n">2</div>
      <div class="ic"><svg width="46" height="48" viewBox="0 0 46 48"><circle cx="23" cy="24" r="14" fill="none" stroke="#2c3e5c" stroke-width="4"/><path d="M23,10 v-5 M31,14 l4,-4" stroke="#2c3e5c" stroke-width="3" stroke-linecap="round"/><path d="M35,20 a13,13 0 1,1 -6,-8" fill="none" stroke="#c0922f" stroke-width="4" stroke-linecap="round"/><path d="M31,8 l4,4 -5,3" fill="#c0922f"/></svg></div>
      <div class="t">조사위 재가동</div>
      <div class="d">16년 만에 전담기구 부활</div>
    </div>
    <div class="ar">→</div>
    <div class="step">
      <div class="n">3</div>
      <div class="ic"><svg width="46" height="48" viewBox="0 0 46 48"><circle cx="20" cy="21" r="13" fill="none" stroke="#2c3e5c" stroke-width="4"/><line x1="30" y1="31" x2="40" y2="41" stroke="#2c3e5c" stroke-width="5" stroke-linecap="round"/><circle cx="20" cy="21" r="6" fill="#c0922f"/></svg></div>
      <div class="t">조사·환수</div>
      <div class="d">새 친일재산 조사 후<br />국고 환수 (범위 확대)</div>
    </div>
  </div>
</div>
