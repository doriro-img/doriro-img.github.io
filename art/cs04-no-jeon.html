<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art {
    width: 860px; padding: 32px 40px 30px; background: #fbf7ef;
    font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; color: #3a2e22;
  }
  h1 { font-size: 22px; letter-spacing: -0.5px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #a08a6b; margin-bottom: 18px; font-weight: 600; }
  .row { display: flex; gap: 20px; }
  .panel { flex: 1; background: #fff; border-radius: 16px; padding: 18px 18px 20px; text-align: center;
    box-shadow: 0 6px 15px rgba(120,95,60,.08); border: 1.5px solid #f0e7d6; }
  .ph { font-size: 16.5px; font-weight: 800; margin-bottom: 4px; }
  .svgwrap { height: 172px; display: flex; align-items: center; justify-content: center; }
  .panel p { font-size: 14px; color: #6a5a45; line-height: 1.6; margin-top: 6px; }
  .panel p b { color: #c0392b; }
</style>

<div id="art">
  <h1>이 두 가지, 안 하셔도 됩니다</h1>
  <p class="sub">명절 부담 1·2위 — 성균관도 "괜찮다"고 했어요</p>

  <div class="row">
    <div class="panel">
      <div class="ph">전 부치기</div>
      <div class="svgwrap">
        <svg width="300" height="172" viewBox="0 0 300 172">
          <path d="M118,52 q-7,-11 2,-18" stroke="#cfcfcf" stroke-width="3" fill="none" opacity="0.65"/>
          <path d="M150,48 q7,-11 -2,-18" stroke="#cfcfcf" stroke-width="3" fill="none" opacity="0.55"/>
          <ellipse cx="132" cy="104" rx="74" ry="54" fill="#565656"/>
          <ellipse cx="132" cy="98" rx="74" ry="54" fill="#727272"/>
          <ellipse cx="132" cy="94" rx="61" ry="44" fill="#828282"/>
          <rect x="196" y="86" width="84" height="15" rx="7.5" fill="#4a4a4a" transform="rotate(-9 196 93)"/>
          <ellipse cx="112" cy="88" rx="23" ry="15" fill="#f0c85a" stroke="#d69a3a" stroke-width="2"/>
          <ellipse cx="152" cy="104" rx="23" ry="15" fill="#f2d072" stroke="#d69a3a" stroke-width="2"/>
          <g transform="rotate(-13 214 58)">
            <circle cx="214" cy="58" r="43" fill="#ffffff" opacity="0.93"/>
            <circle cx="214" cy="58" r="43" fill="none" stroke="#c0392b" stroke-width="3.5"/>
            <circle cx="214" cy="58" r="35" fill="none" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="3 3"/>
            <text x="214" y="53" text-anchor="middle" font-size="16" font-weight="800" fill="#c0392b">안 해도</text>
            <text x="214" y="74" text-anchor="middle" font-size="20" font-weight="900" fill="#c0392b">OK</text>
          </g>
        </svg>
      </div>
      <p>기름에 지지고 튀긴 음식, <b>꼭 안 올려도 됩니다</b></p>
    </div>

    <div class="panel">
      <div class="ph">홍동백서 · 조율이시</div>
      <div class="svgwrap">
        <svg width="300" height="172" viewBox="0 0 300 172">
          <text x="140" y="52" text-anchor="middle" font-size="30" font-weight="800" fill="#6a5a45" letter-spacing="3">紅東白西</text>
          <line x1="34" y1="44" x2="246" y2="44" stroke="#c0392b" stroke-width="3.5"/>
          <text x="140" y="72" text-anchor="middle" font-size="12.5" fill="#a89a80">붉은 건 동쪽, 흰 건 서쪽?</text>
          <text x="140" y="120" text-anchor="middle" font-size="30" font-weight="800" fill="#6a5a45" letter-spacing="3">棗栗梨枾</text>
          <line x1="34" y1="112" x2="246" y2="112" stroke="#c0392b" stroke-width="3.5"/>
          <text x="140" y="140" text-anchor="middle" font-size="12.5" fill="#a89a80">대추 · 밤 · 배 · 감 순서?</text>
          <g transform="rotate(12 244 130)">
            <circle cx="244" cy="130" r="35" fill="#ffffff" opacity="0.93"/>
            <circle cx="244" cy="130" r="35" fill="none" stroke="#c0392b" stroke-width="2.8"/>
            <text x="244" y="126" text-anchor="middle" font-size="13.5" font-weight="800" fill="#c0392b">문헌에</text>
            <text x="244" y="144" text-anchor="middle" font-size="13.5" font-weight="800" fill="#c0392b">없음</text>
          </g>
        </svg>
      </div>
      <p>예법 문헌엔 <b>없는 말</b>이에요. 순서 스트레스 그만</p>
    </div>
  </div>
</div>
