<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art {
    width: 860px; padding: 34px 40px 30px; background: #fbf7ef;
    font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; color: #3a2e22;
  }
  h1 { font-size: 22px; letter-spacing: -0.5px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #a08a6b; margin-bottom: 22px; font-weight: 600; }
  .cards { display: flex; gap: 16px; }
  .c { flex: 1; background: #fff; border-radius: 16px; padding: 20px 16px 18px; text-align: center;
    box-shadow: 0 6px 15px rgba(120,95,60,.08); border-top: 4px solid #ddd; }
  .c1 { border-top-color: #5a9f52; } .c2 { border-top-color: #e8862e; } .c3 { border-top-color: #c0392b; }
  .ic { height: 80px; display: flex; align-items: center; justify-content: center; }
  .ct { font-size: 16.5px; font-weight: 800; margin-top: 4px; }
  .cd { font-size: 13px; color: #6a5a45; line-height: 1.55; margin-top: 6px; }
  .cb { margin-top: 12px; display: inline-block; font-size: 12.5px; font-weight: 800; padding: 6px 13px; border-radius: 14px; }
  .c1 .cb { background: #e9f4e4; color: #4f8a45; } .c2 .cb { background: #fbeede; color: #c67a1e; } .c3 .cb { background: #f7e4de; color: #c0392b; }
</style>

<div id="art">
  <h1>비용 줄이는 세 가지</h1>
  <p class="sub">간소하게, 그리고 알뜰하게</p>

  <div class="cards">
    <div class="c c1">
      <div class="ic">
        <svg width="84" height="76" viewBox="0 0 84 76">
          <rect x="12" y="16" width="60" height="9" rx="1.5" fill="#4f8a45"/>
          <path d="M12,25 l7.5,10 7.5,-10 7.5,10 7.5,-10 7.5,10 7.5,-10 7.5,10 7.5,-10 z" fill="#7cbf6e"/>
          <rect x="16" y="16" width="9" height="9" fill="#eaf5e5"/><rect x="34" y="16" width="9" height="9" fill="#eaf5e5"/><rect x="52" y="16" width="9" height="9" fill="#eaf5e5"/>
          <path d="M26,42 h32 l-4.5,24 h-23 z" fill="#c99a63"/>
          <path d="M33,42 q9,-11 18,0" fill="none" stroke="#a9743f" stroke-width="2.5"/>
          <circle cx="38" cy="52" r="4" fill="#d94b3d"/><circle cx="48" cy="54" r="4" fill="#e3c469"/>
        </svg>
      </div>
      <div class="ct">전통시장에서</div>
      <div class="cd">나물 · 과일 · 생선은<br />시장이 특히 유리해요</div>
      <div class="cb">마트보다 10~14% ↓</div>
    </div>

    <div class="c c2">
      <div class="ic">
        <svg width="84" height="76" viewBox="0 0 84 76">
          <circle cx="32" cy="42" r="20" fill="#d94b3d"/><path d="M32,22 q6,-5 12,-1" fill="none" stroke="#4f8a45" stroke-width="3.5"/>
          <circle cx="58" cy="46" r="17" fill="#e3c469"/><path d="M58,29 v-5" stroke="#7a5a2a" stroke-width="3.5"/>
        </svg>
      </div>
      <div class="ct">제철 과일로</div>
      <div class="cd">추석 즈음 물량이 풀려<br />사과 · 배 값이 내려가요</div>
      <div class="cb">작년 사과·배 30% ↓</div>
    </div>

    <div class="c c3">
      <div class="ic">
        <svg width="84" height="76" viewBox="0 0 84 76">
          <ellipse cx="42" cy="50" rx="32" ry="10" fill="#efe6d4" stroke="#d8cbb0" stroke-width="2"/>
          <ellipse cx="42" cy="47" rx="21" ry="6.5" fill="#f6f0e2"/>
          <path d="M29,45 A13 13 0 0 1 55,45 Z" fill="#8bc06e" stroke="#4f8a45" stroke-width="1.5"/>
          <path d="M42,45 A11 11 0 0 1 64,45 Z" fill="#f0ead6" stroke="#4f8a45" stroke-width="1.5"/>
          <text x="42" y="24" text-anchor="middle" font-size="20" font-weight="800" fill="#c0392b">단출</text>
        </svg>
      </div>
      <div class="ct">간소하게</div>
      <div class="cd">품목을 줄이는 게<br />가장 큰 절약이에요</div>
      <div class="cb">성균관도 OK</div>
    </div>
  </div>
</div>
