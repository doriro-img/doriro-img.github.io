<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f3f6f3;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #34423b; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #7a8a80; margin-bottom: 18px; font-weight: 600; }
  .top { background: #fbeee4; border: 2px solid #e0a03a; border-radius: 14px; padding: 15px 20px; margin-bottom: 12px;
    display: flex; align-items: center; gap: 15px; }
  .top .star { flex: none; font-size: 30px; }
  .top .tt .h { font-size: 15.5px; font-weight: 800; color: #c47a12; }
  .top .tt .d { font-size: 13.5px; color: #6a5836; line-height: 1.5; margin-top: 2px; font-weight: 600; }
  .list { display: flex; flex-direction: column; gap: 9px; }
  .item { background: #fff; border-radius: 12px; padding: 12px 17px; display: flex; align-items: center; gap: 13px;
    box-shadow: 0 4px 11px rgba(70,120,100,.06); border: 1px solid #dde8e2; }
  .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: #5f9e8a; }
  .tx { font-size: 14px; color: #44524b; line-height: 1.45; }
  .tx b { color: #34423b; }
</style>

<div id="art">
  <h1>이런 신호는 살펴보세요</h1>
  <p class="sub">특히 첫 번째, '퇴행'은 가장 중요한 경고예요</p>

  <div class="top">
    <div class="star">⚠️</div>
    <div class="tt">
      <div class="h">잘하던 걸 못하게 된다 (퇴행)</div>
      <div class="d">하던 말이 줄거나, 손 사용·눈맞춤·반응이 사라지면 <b>가장 주의 깊게 봐야 할 신호</b>예요</div>
    </div>
  </div>

  <div class="list">
    <div class="item"><div class="dot"></div><div class="tx"><b>24개월</b>이 됐는데 의미 있는 말로 표현하거나 간단한 지시를 이해 못 해요</div></div>
    <div class="item"><div class="dot"></div><div class="tx">이름을 불러도 반응이 적고, <b>눈맞춤이나 상호작용</b>이 잘 안 돼요</div></div>
    <div class="item"><div class="dot"></div><div class="tx">여러 발달 영역이 <b>또래보다 함께, 오래</b> 늦어요</div></div>
  </div>
</div>
