<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f3f6f3;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #34423b; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #7a8a80; margin-bottom: 18px; font-weight: 600; }
  .tl { display: flex; flex-direction: column; gap: 9px; margin-bottom: 13px; }
  .row { background: #fff; border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 15px;
    box-shadow: 0 4px 11px rgba(70,120,100,.06); border: 1px solid #dde8e2; }
  .age { flex: none; width: 74px; text-align: center; font-size: 14px; font-weight: 800; color: #fff;
    background: #5f9e8a; border-radius: 9px; padding: 7px 0; }
  .what { font-size: 13.8px; color: #44524b; line-height: 1.45; }
  .what b { color: #34423b; }
  .note { background: #eef4f0; border: 1.5px solid #cfe0d8; border-radius: 12px; padding: 12px 18px;
    font-size: 13px; color: #4a8171; line-height: 1.6; font-weight: 600; }
  .note b { color: #3a6b5c; }
</style>

<div id="art">
  <h1>연령별 발달 이정표</h1>
  <p class="sub">이 시기에 이게 잘 안 보이면 한번 체크해보세요</p>

  <div class="tl">
    <div class="row"><div class="age">4~6개월</div><div class="what"><b>목 가누기</b>, 뒤집기, 소리 나는 쪽 쳐다보기</div></div>
    <div class="row"><div class="age">9개월</div><div class="what"><b>혼자 앉기</b>, 옹알이, 낯가림 시작</div></div>
    <div class="row"><div class="age">12개월</div><div class="what"><b>첫 단어</b>(엄마·아빠), 붙잡고 서기, 손 흔들기</div></div>
    <div class="row"><div class="age">18개월</div><div class="what"><b>혼자 걷기</b>, 낱말 몇 개, 손가락으로 가리키기</div></div>
    <div class="row"><div class="age">24개월</div><div class="what"><b>두 단어 문장</b>("엄마 물"), 뛰기, 간단한 지시 이해</div></div>
  </div>

  <div class="note"><b>개인차는 있어요.</b> 조금 늦어도 곧 따라잡는 아이가 많아요. 딱 한 시기를 놓쳤다고 걱정하기보다, 전체 흐름을 보는 게 중요해요</div>
</div>
