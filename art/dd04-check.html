<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f3f6f3;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #34423b; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #7a8a80; margin-bottom: 16px; font-weight: 600; }
  .hero { background: #5f9e8a; border-radius: 15px; padding: 17px 22px; color: #fff; margin-bottom: 13px;
    display: flex; align-items: center; gap: 18px; }
  .hero .big { font-size: 27px; font-weight: 800; line-height: 1.1; }
  .hero .big small { display: block; font-size: 14px; font-weight: 700; opacity: .92; margin-top: 3px; }
  .hero .r { font-size: 13.8px; line-height: 1.55; font-weight: 600; }
  .flow { display: flex; align-items: center; gap: 10px; }
  .step { flex: 1; background: #fff; border-radius: 12px; padding: 13px 12px; text-align: center; border: 1px solid #dde8e2;
    box-shadow: 0 4px 11px rgba(70,120,100,.05); }
  .step .n { font-size: 12px; font-weight: 800; color: #4a8171; }
  .step .d { font-size: 12.8px; color: #44524b; line-height: 1.4; margin-top: 3px; font-weight: 600; }
  .arr { font-size: 18px; color: #a9c4b8; font-weight: 800; }
</style>

<div id="art">
  <h1>국가 영유아 건강검진, 꼭 챙기세요 (무료)</h1>
  <p class="sub">발달지연을 일찍 찾아내는 가장 확실한 통로예요</p>

  <div class="hero">
    <div class="big">만 6세<small>미만 무료</small></div>
    <div class="r"><b style="color:#fdf3d0">생후 9개월부터</b> 발달평가가 포함돼요. 정해진 시기에 빠짐없이 받는 것만으로도 조기 발견에 큰 도움이 돼요</div>
  </div>

  <div class="flow">
    <div class="step"><div class="n">1단계</div><div class="d">건강검진 때<br/>발달 선별검사</div></div>
    <div class="arr">→</div>
    <div class="step"><div class="n">2단계</div><div class="d">'심화평가 권고'<br/>나오면</div></div>
    <div class="arr">→</div>
    <div class="step"><div class="n">3단계</div><div class="d">발달 정밀검사<br/>(검사비 지원)</div></div>
  </div>
</div>
