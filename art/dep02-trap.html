<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 34px 36px 30px; background: #fff;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1b1b1b; }
  h1 { font-size: 20px; letter-spacing: -0.4px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6b6b6b; margin-bottom: 20px; }
  .grid { display: flex; flex-wrap: wrap; gap: 11px; }
  .c { width: calc(50% - 5.5px); border: 1px solid #f0b8b1; border-radius: 11px;
       padding: 15px 17px; background: #fdf3f1; display: flex; gap: 13px; align-items: flex-start; }
  .c .num { width: 26px; height: 26px; border-radius: 50%; background: #cf4f43; color: #fff;
            font-size: 13px; font-weight: 800; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .c .t { font-size: 14.5px; font-weight: 800; color: #b8463a; margin-bottom: 4px; }
  .c p { font-size: 12.5px; line-height: 1.65; color: #55606c; }
  .c p b { color: #1b1b1b; }
</style>
<div id="art">
  <h1>이런 데서 많이 걸립니다</h1>
  <p class="sub">본인은 소득이 늘었다고 생각도 못 하는 경우예요</p>
  <div class="grid">
    <div class="c"><div class="num">1</div><div><div class="t">국민연금 받기 시작했을 때</div>
      <p>연금도 소득입니다. <b>다른 소득과 합쳐서</b> 2,000만원을 넘기면 그 순간 탈락이에요</p></div></div>
    <div class="c"><div class="num">2</div><div><div class="t">배당이나 이자가 늘었을 때</div>
      <p>금융소득도 들어갑니다. <b>주식 배당이 커지면</b> 모르는 사이에 넘어갈 수 있어요</p></div></div>
    <div class="c"><div class="num">3</div><div><div class="t">사업자등록만 내둔 경우</div>
      <p>매출이 없어도 <b>등록이 있으면 소득 1원에 탈락</b>입니다. 안 쓰는 등록은 정리하는 게 낫습니다</p></div></div>
    <div class="c"><div class="num">4</div><div><div class="t">집값이나 공시가격이 올랐을 때</div>
      <p>가만히 있었는데 <b>재산세 과세표준이 올라</b> 5.4억을 넘기는 경우가 있습니다</p></div></div>
  </div>
</div>
