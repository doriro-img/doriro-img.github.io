<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 34px 36px 30px; background: #fff;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1b1b1b; }
  h1 { font-size: 20px; letter-spacing: -0.4px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6b6b6b; margin-bottom: 20px; }
  .flow { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .b { flex: 1; border-radius: 12px; padding: 16px 18px; text-align: center; }
  .b .k { font-size: 12px; font-weight: 700; margin-bottom: 5px; }
  .b .v { font-size: 21px; font-weight: 800; letter-spacing: -0.7px; }
  .b .n { font-size: 11.5px; margin-top: 4px; }
  .b1 { background: #eef9f3; border: 1px solid #a9dcc4; }
  .b1 .k { color: #3d9b74; } .b1 .v { color: #1d7050; } .b1 .n { color: #6aa78d; }
  .b2 { background: #fdf3f1; border: 1px solid #f0b8b1; }
  .b2 .k { color: #a8695f; } .b2 .v { color: #b8463a; } .b2 .n { color: #b0837b; }
  .arw { font-size: 22px; color: #b8c2cc; font-weight: 800; flex-shrink: 0; }
  .two { display: flex; gap: 12px; }
  .c { flex: 1; border: 1px solid #e2e6ea; border-radius: 11px; padding: 14px 17px; background: #fafbfc; }
  .c .t { font-size: 14px; font-weight: 800; margin-bottom: 5px; }
  .c p { font-size: 12.5px; line-height: 1.65; color: #5a6672; }
  .c p b { color: #1b1b1b; }
  .c.hi { background: #eef9f3; border-color: #a9dcc4; } .c.hi .t { color: #1d7050; }
</style>
<div id="art">
  <h1>탈락하면 이렇게 됩니다</h1>
  <p class="sub">안 내던 보험료가 갑자기 생깁니다</p>
  <div class="flow">
    <div class="b b1"><div class="k">피부양자일 때</div><div class="v">0원</div><div class="n">보험료를 안 냅니다</div></div>
    <div class="arw">→</div>
    <div class="b b2"><div class="k">지역가입자가 되면</div><div class="v">월 15~30만원</div><div class="n">소득·재산에 따라 달라집니다</div></div>
  </div>
  <div class="two">
    <div class="c hi"><div class="t">임의계속가입을 쓸 수 있는 경우</div>
      <p>본인이 <b>직장을 다니다 그만둔 상황</b>이라면 임의계속가입으로 3년간 부담을 줄일 수 있습니다</p></div>
    <div class="c"><div class="t">소득을 조절할 수 있다면</div>
      <p>배당이나 금융소득처럼 <b>시기를 나눌 수 있는 소득</b>은 해를 걸쳐 분산하는 방법이 있습니다</p></div>
    <div class="c"><div class="t">안 쓰는 사업자등록 정리</div>
      <p>실제로 영업을 안 하는 등록이 남아 있으면 <b>폐업 신고</b>를 해두는 게 낫습니다</p></div>
  </div>
</div>
