<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 34px 36px 30px; background: #fff;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1b1b1b; }
  h1 { font-size: 20px; letter-spacing: -0.4px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6b6b6b; margin-bottom: 22px; }
  .steps { display: flex; gap: 11px; margin-bottom: 15px; }
  .s { flex: 1; border: 1px solid #e2e6ea; border-radius: 11px; padding: 15px 16px; background: #fafbfc; }
  .s .n { display: inline-block; width: 24px; height: 24px; border-radius: 50%; background: #2f6fb0;
          color: #fff; font-size: 13px; font-weight: 800; text-align: center; line-height: 24px; margin-bottom: 9px; }
  .s .t { font-size: 14.5px; font-weight: 800; margin-bottom: 5px; }
  .s p { font-size: 12.5px; line-height: 1.65; color: #5a6672; }
  .s p b { color: #1b1b1b; }
  .call { background: linear-gradient(160deg,#eff6fb,#d9e7f5); border: 1px solid #cfe0f0;
          border-radius: 11px; padding: 15px 20px; display: flex; align-items: center; gap: 20px; }
  .call .big { font-size: 24px; font-weight: 800; color: #1f4a7a; letter-spacing: -0.8px; white-space: nowrap; }
  .call p { font-size: 13.5px; line-height: 1.7; color: #4a5561; }
  .call p b { color: #1b1b1b; }
</style>
<div id="art">
  <h1>내 자격은 이렇게 확인합니다</h1>
  <p class="sub">공단 홈페이지에서 몇 분이면 됩니다</p>
  <div class="steps">
    <div class="s"><span class="n">1</span><div class="t">공단 홈페이지 접속</div>
      <p>국민건강보험공단 사이트나 <b>The건강보험 앱</b>에 로그인합니다</p></div>
    <div class="s"><span class="n">2</span><div class="t">자격 조회 메뉴</div>
      <p>자격득실확인서를 떼보면 <b>지금 내가 어느 자격인지</b> 바로 나옵니다</p></div>
    <div class="s"><span class="n">3</span><div class="t">소득 자료 확인</div>
      <p>공단이 보는 소득은 <b>국세청 자료 기준</b>이라 시차가 있습니다</p></div>
  </div>
  <div class="call">
    <div class="big">1577-1000</div>
    <p>애매하면 전화가 제일 빠릅니다. <b>지금 자격이 유지되는지, 언제 재산정되는지</b> 알려줍니다.<br />
      소득이 늘 것 같으면 미리 물어보고 대비하는 게 낫더라고요</p>
  </div>
</div>
