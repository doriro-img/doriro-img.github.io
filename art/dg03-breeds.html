<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #fdf5f2;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #4a2e2a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #a5807a; margin-bottom: 18px; font-weight: 600; }
  .sec { background: #fff; border-radius: 14px; padding: 16px 18px; box-shadow: 0 5px 14px rgba(180,100,90,.07);
    border: 1px solid #f2ddd6; margin-bottom: 12px; }
  .st { font-size: 14px; font-weight: 800; margin-bottom: 11px; }
  .st .di { font-size: 12px; color: #a5807a; font-weight: 700; margin-left: 6px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: 13.5px; font-weight: 700; padding: 7px 14px; border-radius: 18px; background: #fbe8e2; color: #b5544a; }
  .warn { background: #fdeee8; border: 1.5px solid #f0b8a8; border-radius: 12px; padding: 13px 16px; margin-bottom: 12px;
    display: flex; align-items: center; gap: 12px; }
  .warn .b { flex: none; font-size: 12px; font-weight: 800; color: #fff; background: #e0644a; padding: 5px 11px; border-radius: 12px; }
  .warn .t { font-size: 13.5px; color: #8a4030; line-height: 1.5; } .warn .t b { color: #c0392b; }
</style>

<div id="art">
  <h1>유전적으로 잘 걸리는 견종</h1>
  <p class="sub">이 견종이면 조금 더 신경 써주면 좋아요</p>

  <div class="sec">
    <div class="st">소형·중형견 <span class="di">— 이첨판(승모판) 폐쇄부전</span></div>
    <div class="chips">
      <span class="chip">치와와</span><span class="chip">요크셔테리어</span><span class="chip">말티즈</span>
      <span class="chip">미니어처푸들</span><span class="chip">파피용</span><span class="chip">닥스훈트</span><span class="chip">캐벌리어 킹찰스</span>
    </div>
  </div>

  <div class="warn">
    <span class="b">특히 주의</span>
    <div class="t"><b>캐벌리어 킹찰스 스패니얼</b>은 다른 견종보다 어린 나이에 발병하고 진행도 빨라요. 더 일찍부터 챙겨야 해요</div>
  </div>

  <div class="sec">
    <div class="st">대형견 <span class="di">— 확장성 심근증(DCM)</span></div>
    <div class="chips">
      <span class="chip">도베르만</span><span class="chip">복서</span><span class="chip">그레이트데인</span><span class="chip">울프하운드</span>
    </div>
  </div>
</div>
