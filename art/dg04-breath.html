<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #fdf5f2;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #4a2e2a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #a5807a; margin-bottom: 18px; font-weight: 600; }
  .row { display: flex; gap: 18px; align-items: center; }
  .scene { flex: none; width: 300px; background: #fff; border-radius: 16px; padding: 20px; text-align: center;
    box-shadow: 0 6px 16px rgba(180,100,90,.09); border: 1px solid #f2ddd6; }
  .cap { font-size: 12.5px; color: #a5807a; font-weight: 700; margin-top: 6px; }
  .right { flex: 1; }
  .m { background: #fff; border-radius: 12px; padding: 14px 18px; margin-bottom: 12px; font-size: 14px; color: #5a3a34;
    line-height: 1.5; border: 1px solid #f2ddd6; }
  .m b { color: #4a2e2a; }
  .std { background: #e07a7a; border-radius: 14px; padding: 18px 20px; color: #fff; text-align: center; }
  .std .n { font-size: 30px; font-weight: 800; }
  .std .n small { font-size: 15px; font-weight: 700; }
  .std .d { font-size: 13px; color: #fbe4e0; margin-top: 3px; font-weight: 600; }
</style>

<div id="art">
  <h1>집에서 체크 — 자는 동안 '호흡수'</h1>
  <p class="sub">돈 안 들고 폰만 있으면 돼요. 제일 쉽고 확실한 자가 체크예요</p>

  <div class="row">
    <div class="scene">
      <svg width="220" height="120" viewBox="0 0 220 120">
        <ellipse cx="110" cy="104" rx="86" ry="8" fill="#f0d9cf"/>
        <ellipse cx="110" cy="82" rx="72" ry="26" fill="#d59a6a"/>
        <circle cx="46" cy="74" r="22" fill="#d59a6a"/>
        <path d="M30,58 Q22,52 30,76 Z" fill="#c98d5a"/>
        <path d="M32,76 Q26,78 34,80" fill="none" stroke="#4a2e2a" stroke-width="2" stroke-linecap="round"/>
        <path d="M26,72 q-4,1 -7,0" stroke="#4a2e2a" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M110,60 C104,52 116,50 116,58 C116,50 128,52 122,60 C118,66 110,70 110,60 Z" fill="#e07a7a"/>
        <path d="M108,44 q4,-8 -2,-12 M118,42 q6,-7 1,-13" fill="none" stroke="#e8a0a0" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div class="cap">잠자거나 편히 쉴 때 재요</div>
    </div>

    <div class="right">
      <div class="m"><b>이렇게 세요</b><br />가슴(갈비뼈)이 오르락내리락하는 걸 1분간 세요. <b>들숨+날숨을 합쳐서 1회</b>예요</div>
      <div class="std">
        <div class="n">30회 <small>이하</small></div>
        <div class="d">1분에 이 정도면 정상 · 계속 넘으면 병원</div>
      </div>
    </div>
  </div>
</div>
