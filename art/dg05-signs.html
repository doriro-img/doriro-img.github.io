<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #fdf5f2;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #4a2e2a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #a5807a; margin-bottom: 18px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-bottom: 13px; }
  .it { background: #fff; border-radius: 13px; padding: 15px 16px; display: flex; align-items: center; gap: 13px;
    box-shadow: 0 5px 13px rgba(180,100,90,.07); border: 1px solid #f2ddd6; }
  .bx { flex: none; width: 30px; height: 30px; border-radius: 9px; background: #fbe8e2; color: #d9584a;
    display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; }
  .tx { font-size: 14px; line-height: 1.4; color: #5a3a34; } .tx b { color: #4a2e2a; }
  .note { background: #fff4ec; border: 1.5px solid #f2d4bf; border-radius: 12px; padding: 14px 18px; font-size: 13px;
    color: #8a5a3a; line-height: 1.6; }
  .note b { color: #b5622a; }
</style>

<div id="art">
  <h1>이런 신호면 병원 가세요</h1>
  <p class="sub">심장병은 초기엔 겉으로 멀쩡해서 놓치기 쉬워요</p>

  <div class="grid">
    <div class="it"><div class="bx">1</div><div class="tx"><b>마른기침</b>이 잦아졌어요<br>(특히 밤·새벽)</div></div>
    <div class="it"><div class="bx">2</div><div class="tx">산책·운동 후 <b>쉽게 지치고 헐떡</b>여요</div></div>
    <div class="it"><div class="bx">3</div><div class="tx">혀·잇몸이 <b>파랗게(청색) 변</b>해요</div></div>
    <div class="it"><div class="bx">4</div><div class="tx">자는 동안 <b>호흡수가 30회 초과</b>예요</div></div>
  </div>

  <div class="note"><b>조기발견이 관건이에요.</b> 집에서 하는 건 '관찰'까지고, 진단·치료·약은 꼭 수의사에게 맡기세요. 위 신호가 보이면 미루지 말고 병원부터 가는 게 좋아요</div>
</div>
