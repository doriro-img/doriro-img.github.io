<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art {
    width: 860px; padding: 34px 36px 30px; background: #fff;
    font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; color: #1b1b1b;
  }
  h1 { font-size: 20px; letter-spacing: -0.4px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6b6b6b; margin-bottom: 20px; }

  .line { position: relative; height: 128px; margin-bottom: 16px; }
  .zone { position: absolute; top: 30px; height: 56px; border-radius: 9px;
          display: flex; align-items: center; padding: 0 20px; }
  .zl { left: 0; width: 48%; background: linear-gradient(90deg,#dff2e8,#c3e9d5); border: 1px solid #a9dcc4; }
  .zr { right: 0; width: 48%; background: linear-gradient(90deg,#fbe0dc,#f6cec8); border: 1px solid #f0b8b1; }
  .zone .t { font-size: 15px; font-weight: 800; }
  .zl .t { color: #1d7050; } .zr .t { color: #b8463a; }
  .zone .n { font-size: 12.5px; margin-top: 2px; }
  .zl .n { color: #4d8e73; } .zr .n { color: #a8695f; }

  .pin { position: absolute; left: 50%; top: 10px; width: 3px; height: 96px;
         background: #1b1b1b; border-radius: 2px; transform: translateX(-50%); }
  .plab { position: absolute; left: 50%; top: -14px; transform: translateX(-50%);
          background: #1b1b1b; color: #fff; font-size: 13px; font-weight: 800;
          padding: 6px 14px; border-radius: 14px; white-space: nowrap; }
  .pn { position: absolute; left: 50%; top: 108px; transform: translateX(-50%);
        font-size: 12px; color: #7b848f; font-weight: 700; white-space: nowrap; }

  .after { display: flex; gap: 10px; margin-bottom: 15px; }
  .a { flex: 1; border: 1px solid #e2e6ea; border-radius: 10px; padding: 13px 16px; background: #fafbfc; }
  .a .k { font-size: 11.5px; color: #8a929c; font-weight: 700; margin-bottom: 4px; }
  .a .v { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
  .a .v small { font-size: 12px; font-weight: 700; color: #6b7480; }
  .a.hi { background: #eef9f3; border-color: #a9dcc4; } .a.hi .v { color: #1d7050; }

  .need { border: 1px solid #e6e9ed; border-radius: 10px; overflow: hidden; }
  .nh { background: #f2f5f7; padding: 10px 18px; font-size: 12.5px; font-weight: 800; color: #55606c; }
  .nb { display: flex; }
  .n1 { flex: 1; padding: 13px 18px; border-right: 1px solid #eef1f4; }
  .n1:last-child { border-right: none; }
  .n1 .k { font-size: 12px; color: #8a929c; font-weight: 700; margin-bottom: 3px; }
  .n1 .v { font-size: 17px; font-weight: 800; letter-spacing: -0.5px; color: #1f4a7a; }
</style>

<div id="art">
  <h1>세금이 갈리는 선은 연 2,000만원입니다</h1>
  <p class="sub">이 선을 넘는 순간 계산이 복잡해집니다</p>

  <div class="line">
    <div class="zone zl">
      <div>
        <div class="t">15.4%로 끝</div>
        <div class="n">떼고 나면 신경 쓸 게 없습니다</div>
      </div>
    </div>
    <div class="zone zr" style="justify-content:flex-end; text-align:right">
      <div>
        <div class="t">종합과세로 넘어감</div>
        <div class="n">근로소득 같은 다른 소득과 합쳐서 계산합니다</div>
      </div>
    </div>
    <div class="plab">연 2,000만원</div>
    <div class="pin"></div>
    <div class="pn">한 달로 치면 약 166만원</div>
  </div>

  <div class="after">
    <div class="a"><div class="k">세전 (연)</div><div class="v">2,000만<small>원</small></div></div>
    <div class="a"><div class="k">세금 15.4%</div><div class="v">308만<small>원</small></div></div>
    <div class="a hi"><div class="k">세후 (연)</div><div class="v">1,692만<small>원</small></div></div>
    <div class="a hi"><div class="k">세후 (월)</div><div class="v">141만<small>원</small></div></div>
  </div>

  <div class="need">
    <div class="nh">연 2,000만원을 받으려면 얼마가 있어야 하나</div>
    <div class="nb">
      <div class="n1"><div class="k">배당수익률 연 3.5%</div><div class="v">5억 7,000만원</div></div>
      <div class="n1"><div class="k">배당수익률 연 4%</div><div class="v">5억원</div></div>
      <div class="n1"><div class="k">배당수익률 연 5%</div><div class="v">4억원</div></div>
    </div>
  </div>
</div>
