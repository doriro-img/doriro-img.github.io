<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 34px 36px 30px; background: #fff;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1b1b1b; }
  h1 { font-size: 20px; letter-spacing: -0.4px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6b6b6b; margin-bottom: 20px; }
  .tbl { border: 1px solid #e6e9ed; border-radius: 11px; overflow: hidden; margin-bottom: 14px; }
  .th { display: flex; background: #f2f5f7; padding: 11px 18px; font-size: 12.5px; font-weight: 800; color: #55606c; }
  .td { display: flex; padding: 14px 18px; border-top: 1px solid #eef1f4; align-items: center; }
  .td:nth-child(even) { background: #fafbfc; }
  .c1 { flex: 1.3; font-size: 14.5px; font-weight: 700; }
  .c1 small { display: block; font-size: 12px; color: #8a929c; font-weight: 500; margin-top: 2px; }
  .c2 { flex: 1; text-align: right; font-size: 16px; font-weight: 800; color: #1f4a7a; }
  .c3 { flex: 1; text-align: right; font-size: 16px; font-weight: 800; color: #1d7050; }
  .asset { background: linear-gradient(160deg,#eff6fb,#d9e7f5); border: 1px solid #cfe0f0;
           border-radius: 11px; padding: 14px 20px; display: flex; align-items: center; gap: 18px; }
  .asset .n { font-size: 24px; font-weight: 800; color: #1f4a7a; letter-spacing: -0.9px; white-space: nowrap; }
  .asset p { font-size: 13px; line-height: 1.65; color: #4a5561; }
  .asset p b { color: #1b1b1b; }
</style>
<div id="art">
  <h1>가구 유형별 소득 기준과 받는 돈</h1>
  <p class="sub">지난해 부부합산 총소득으로 봅니다</p>
  <div class="tbl">
    <div class="th"><div class="c1">가구 유형</div><div class="c2">소득이 이것보다 적어야</div><div class="c3">최대로 받는 돈</div></div>
    <div class="td"><div class="c1">단독가구<small>배우자도 부양자녀도 없는 경우</small></div>
      <div class="c2">2,200만원</div><div class="c3">165만원</div></div>
    <div class="td"><div class="c1">홑벌이가구<small>배우자나 부양자녀가 있고 한 사람만 벌 때</small></div>
      <div class="c2">3,200만원</div><div class="c3">285만원</div></div>
    <div class="td"><div class="c1">맞벌이가구<small>부부 둘 다 소득이 있을 때</small></div>
      <div class="c2">4,400만원</div><div class="c3">330만원</div></div>
  </div>
  <div class="asset">
    <div class="n">재산 2.4억 미만</div>
    <p>소득만 맞으면 되는 게 아닙니다. <b>가구원 전체의 재산 합계</b>가 기준일 현재 2.4억원 미만이어야 해요.<br />
      집과 전세보증금, 자동차, 예금까지 다 더해서 봅니다</p>
  </div>
</div>
