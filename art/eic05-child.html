<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 34px 36px 30px; background: #fff;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1b1b1b; }
  h1 { font-size: 20px; letter-spacing: -0.4px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6b6b6b; margin-bottom: 20px; }
  .plus { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .b { flex: 1; border-radius: 12px; padding: 17px 20px; text-align: center; }
  .b .k { font-size: 12.5px; font-weight: 700; margin-bottom: 6px; }
  .b .v { font-size: 25px; font-weight: 800; letter-spacing: -1px; }
  .b .n { font-size: 12px; margin-top: 4px; }
  .b1 { background: linear-gradient(160deg,#eef9f3,#d3f0e1); border: 1px solid #a9dcc4; }
  .b1 .k { color: #3d9b74; } .b1 .v { color: #1d7050; } .b1 .n { color: #6aa78d; }
  .b2 { background: linear-gradient(160deg,#fdf1f4,#f8dae2); border: 1px solid #f0c4d0; }
  .b2 .k { color: #a8506a; } .b2 .v { color: #9a3b57; } .b2 .n { color: #b57e90; }
  .b3 { background: #1b1b1b; }
  .b3 .k { color: #9aa6b2; } .b3 .v { color: #ffd97a; } .b3 .n { color: #b8c2cc; }
  .op { font-size: 24px; font-weight: 800; color: #b8c2cc; flex-shrink: 0; }
  .note { background: #fafbfc; border: 1px solid #e6e9ed; border-radius: 10px;
          padding: 14px 20px; font-size: 13.5px; line-height: 1.75; color: #4a5561; }
  .note b { color: #1b1b1b; }
</style>
<div id="art">
  <h1>아이가 있으면 자녀장려금이 따로 붙습니다</h1>
  <p class="sub">근로장려금과 같이 신청하고 같이 받습니다</p>
  <div class="plus">
    <div class="b b1"><div class="k">근로장려금 (맞벌이 최대)</div><div class="v">330만원</div><div class="n">소득에 따라 달라집니다</div></div>
    <div class="op">+</div>
    <div class="b b2"><div class="k">자녀장려금 (자녀 1명당)</div><div class="v">50 ~ 100만원</div><div class="n">아이 수만큼 곱합니다</div></div>
    <div class="op">=</div>
    <div class="b b3"><div class="k">둘 다 받으면</div><div class="v">더 커집니다</div><div class="n">신청은 한 번에</div></div>
  </div>
  <p class="note">자녀장려금은 <b>18세 미만 부양자녀</b>가 있을 때 받습니다.
    근로장려금 신청서에서 <b>같이 신청</b>하는 거라 따로 접수할 필요가 없어요.<br />
    다만 자녀장려금은 <b>반기신청 대상이 아닙니다.</b> 자녀 몫은 내년 5월 정기신청 때 정산해서 받게 됩니다</p>
</div>
