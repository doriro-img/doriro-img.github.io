<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art {
    width: 860px; padding: 34px 36px 30px; background: #fff;
    font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; color: #1b1b1b;
  }
  h1 { font-size: 20px; letter-spacing: -0.4px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6b6b6b; margin-bottom: 18px; }

  .chart { background: #fafbfc; border: 1px solid #e6e9ed; border-radius: 10px; padding: 16px 18px 10px; }
  .leg { display: flex; gap: 20px; margin: 8px 0 0 62px; }
  .leg div { font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; color: #55606c; }
  .leg i { width: 22px; height: 4px; border-radius: 2px; }

  .out { margin-top: 15px; display: flex; gap: 10px; }
  .o { flex: 1; border-radius: 10px; padding: 13px 16px; }
  .o.a { background: #eef9f3; border: 1px solid #a9dcc4; }
  .o.b { background: #f5f7f8; border: 1px solid #dfe4e9; }
  .o .k { font-size: 12px; font-weight: 700; margin-bottom: 3px; }
  .o.a .k { color: #23805a; } .o.b .k { color: #6b7480; }
  .o .v { font-size: 22px; font-weight: 800; letter-spacing: -0.8px; }
  .o.a .v { color: #23805a; } .o.b .v { color: #55606c; }
  .o .n { font-size: 12px; color: #7b848f; margin-top: 2px; }

  .diff { margin-top: 12px; background: #1b1b1b; color: #fff; border-radius: 10px;
          padding: 13px 18px; font-size: 14px; line-height: 1.6; }
  .diff b { color: #7ee0b0; font-size: 17px; }
</style>

<div id="art">
  <h1>배당을 다시 넣느냐가 전부입니다</h1>
  <p class="sub">1억을 배당수익률 4%짜리에 넣고 30년을 두면</p>

  <div class="chart">
    <svg width="792" height="240" viewBox="0 0 700 240">
      <g stroke="#e6eaee" stroke-width="1">
        <line x1="60" y1="165.2" x2="640" y2="165.2"/><line x1="60" y1="130.4" x2="640" y2="130.4"/>
        <line x1="60" y1="95.7" x2="640" y2="95.7"/><line x1="60" y1="60.9" x2="640" y2="60.9"/>
      </g>
      <line x1="60" y1="200" x2="640" y2="200" stroke="#c8cfd6" stroke-width="1.5"/>
      <line x1="60" y1="30" x2="60" y2="200" stroke="#c8cfd6" stroke-width="1.5"/>

      <!-- 벌어지는 간격 -->
      <path d="M60,200 L156.7,184.9 L253.3,166.6 L350,144.3 L446.7,117.1 L543.3,84.1 L640,43.9
               L640,116.5 Z" fill="#2f9e6e" opacity=".12"/>

      <!-- 인출 (단리) -->
      <path d="M60,200 L640,116.5" fill="none" stroke="#9aa6b2" stroke-width="3" stroke-dasharray="7 5"/>

      <!-- 재투자 (복리) -->
      <path d="M60,200 Q108,193 156.7,184.9 T253.3,166.6 Q301,155 350,144.3 Q398,131 446.7,117.1
               Q495,101 543.3,84.1 Q592,64 640,43.9"
            fill="none" stroke="#2f9e6e" stroke-width="3.5" stroke-linecap="round"/>

      <circle cx="640" cy="43.9" r="6" fill="#fff" stroke="#2f9e6e" stroke-width="3"/>
      <circle cx="640" cy="116.5" r="5.5" fill="#fff" stroke="#9aa6b2" stroke-width="3"/>

      <g font-size="11.5" fill="#9098a2" font-family="Pretendard, Malgun Gothic, sans-serif">
        <text x="60" y="217" text-anchor="middle">지금</text>
        <text x="253" y="217" text-anchor="middle">10년</text>
        <text x="447" y="217" text-anchor="middle">20년</text>
        <text x="640" y="217" text-anchor="middle">30년</text>
        <text x="54" y="204" text-anchor="end">1억</text>
        <text x="54" y="134.4" text-anchor="end">2억</text>
        <text x="54" y="64.9" text-anchor="end">3억</text>
      </g>
    </svg>

    <div class="leg">
      <div><i style="background:#2f9e6e"></i>배당을 다시 넣었을 때</div>
      <div><i style="background:#9aa6b2"></i>배당을 그때그때 썼을 때</div>
    </div>
  </div>

  <div class="out">
    <div class="o a">
      <div class="k">배당 재투자</div>
      <div class="v">3억 2,434만원</div>
      <div class="n">배당이 또 배당을 낳습니다</div>
    </div>
    <div class="o b">
      <div class="k">배당을 써버림</div>
      <div class="v">2억 2,000만원</div>
      <div class="n">원금 1억 + 배당 400만원씩 30번</div>
    </div>
  </div>

  <div class="diff">같은 종목 같은 30년인데 <b>1억 434만원</b> 차이가 납니다. 이 간격이 복리입니다</div>
</div>
