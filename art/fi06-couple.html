<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art {
    width: 860px; padding: 34px 36px 30px; background: #fff;
    font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; color: #1b1b1b;
  }
  h1 { font-size: 20px; letter-spacing: -0.4px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6b6b6b; margin-bottom: 20px; }

  .split { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .p { flex: 1; border-radius: 11px; padding: 15px 18px; text-align: center; }
  .p .k { font-size: 12px; font-weight: 700; margin-bottom: 5px; }
  .p .v { font-size: 24px; font-weight: 800; letter-spacing: -0.9px; }
  .pa { background: linear-gradient(160deg,#eef4fb,#d9e7f5); border: 1px solid #cfe0f0; }
  .pa .k { color: #4f7ba8; } .pa .v { color: #1f4a7a; }
  .pb { background: linear-gradient(160deg,#fdf1ee,#f7ddd4); border: 1px solid #f0d5c8; }
  .pb .k { color: #a9705a; } .pb .v { color: #a0492f; }
  .plus { font-size: 24px; font-weight: 800; color: #b8c2cc; flex-shrink: 0; }
  .eq { font-size: 24px; font-weight: 800; color: #b8c2cc; flex-shrink: 0; }
  .pt { flex: 1.15; background: linear-gradient(160deg,#eef9f3,#d0eee0); border: 1px solid #a9dcc4;
        border-radius: 11px; padding: 15px 18px; text-align: center; }
  .pt .k { font-size: 12px; font-weight: 700; color: #3d9b74; margin-bottom: 5px; }
  .pt .v { font-size: 24px; font-weight: 800; color: #1d7050; letter-spacing: -0.9px; }
  .pt .n { font-size: 12.5px; color: #6aa78d; font-weight: 600; margin-top: 3px; }

  .tl { background: #fafbfc; border: 1px solid #e6e9ed; border-radius: 11px; padding: 20px 24px 16px; }
  .tlab { font-size: 13px; font-weight: 700; color: #55606c; margin-bottom: 14px; }
  .bar { position: relative; height: 74px; }
  .track { position: absolute; top: 20px; left: 0; right: 0; height: 16px; border-radius: 8px;
           background: linear-gradient(90deg,#a9dcc4,#2f9e6e); }
  .mk { position: absolute; top: 6px; width: 3px; height: 44px; background: #1b1b1b; border-radius: 2px; }
  .lb { position: absolute; top: -6px; font-size: 13px; font-weight: 800; white-space: nowrap; }
  .lb2 { position: absolute; top: 54px; font-size: 12px; color: #7b848f; font-weight: 600; white-space: nowrap; }

  .rows { display: flex; gap: 10px; margin-top: 14px; }
  .r { flex: 1; border: 1px solid #e2e6ea; border-radius: 9px; padding: 12px 14px; background: #fff; }
  .r .k { font-size: 11.5px; color: #8a929c; font-weight: 700; margin-bottom: 4px; }
  .r .v { font-size: 15.5px; font-weight: 800; letter-spacing: -0.4px; }
  .r.hi { background: #eef9f3; border-color: #a9dcc4; } .r.hi .v { color: #1d7050; }
</style>

<div id="art">
  <h1>둘이 나눠 넣으면 숫자가 달라집니다</h1>
  <p class="sub">혼자 월 300만원은 벅차도 각자 150만원이면 해볼 만합니다</p>

  <div class="split">
    <div class="p pa"><div class="k">한 사람</div><div class="v">월 150만원</div></div>
    <div class="plus">+</div>
    <div class="p pb"><div class="k">배우자</div><div class="v">월 150만원</div></div>
    <div class="eq">=</div>
    <div class="pt"><div class="k">합쳐서</div><div class="v">월 300만원</div><div class="n">15년 6개월이면 10억</div></div>
  </div>

  <div class="tl">
    <div class="tlab">서른에 시작했다면</div>
    <div class="bar">
      <div class="track"></div>
      <div class="mk" style="left:0"></div>
      <div class="mk" style="left:99.5%"></div>
      <div class="lb" style="left:0">30세 시작</div>
      <div class="lb2" style="left:0">첫 달 150만원</div>
      <div class="lb" style="right:0; text-align:right">45세 · 10억</div>
      <div class="lb2" style="right:0; text-align:right">15년 6개월 뒤</div>
    </div>

    <div class="rows">
      <div class="r"><div class="k">각자 월 100만원 (합 200만원)</div><div class="v">19년 7개월 · 49세</div></div>
      <div class="r hi"><div class="k">각자 월 150만원 (합 300만원)</div><div class="v">15년 6개월 · 45세</div></div>
      <div class="r"><div class="k">각자 월 200만원 (합 400만원)</div><div class="v">12년 11개월 · 43세</div></div>
    </div>
  </div>
</div>
