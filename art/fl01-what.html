<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f4f2f6;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2b2b3d; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6e6e80; margin-bottom: 18px; font-weight: 600; }
  .three { display: flex; gap: 12px; margin-bottom: 14px; }
  .c { flex: 1; background: #fff; border-radius: 14px; padding: 17px 15px; text-align: center;
    box-shadow: 0 5px 13px rgba(60,50,90,.07); border: 1px solid #e6e2ec; }
  .c .em { font-size: 26px; }
  .c .t { font-size: 14px; font-weight: 800; color: #d13f38; margin: 7px 0 4px; }
  .c .d { font-size: 12.5px; color: #5a5a6a; line-height: 1.45; font-weight: 600; }
  .note { background: #fff; border: 1.5px solid #e6e2ec; border-radius: 12px; padding: 14px 18px;
    box-shadow: 0 4px 11px rgba(60,50,90,.05); font-size: 13.8px; color: #44445a; line-height: 1.6; }
  .note b { color: #d13f38; }
</style>

<div id="art">
  <h1>페이스리스 콘텐츠가 뭔가요?</h1>
  <p class="sub">얼굴을 드러내지 않고 만드는 콘텐츠예요</p>

  <div class="three">
    <div class="c"><div class="em">🙈</div><div class="t">부담이 적어요</div><div class="d">얼굴·목소리 노출 없이<br/>프라이버시 지켜요</div></div>
    <div class="c"><div class="em">🤖</div><div class="t">AI로 쉬워졌어요</div><div class="d">글·이미지·음성을<br/>도구로 만들 수 있어요</div></div>
    <div class="c"><div class="em">📚</div><div class="t">정보성이 강해요</div><div class="d">얼굴보다 '내용'으로<br/>승부하는 콘텐츠</div></div>
  </div>

  <div class="note">정보 요약 영상, 자막 콘텐츠, 나레이션 다큐, 정보 블로그처럼 <b>'나' 대신 '콘텐츠'가 주인공</b>이에요. 사실 지금 보고 계신 이 블로그도 얼굴 없이 정보와 도식으로만 채운 페이스리스랍니다</div>
</div>
