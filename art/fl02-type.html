<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f4f2f6;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2b2b3d; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6e6e80; margin-bottom: 18px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  .c { background: #fff; border-radius: 13px; padding: 15px 18px; border: 1px solid #e6e2ec;
    box-shadow: 0 5px 13px rgba(60,50,90,.06); display: flex; gap: 14px; align-items: flex-start; }
  .em { flex: none; font-size: 26px; }
  .bd .t { font-size: 15px; font-weight: 800; color: #d13f38; }
  .bd .d { font-size: 12.8px; color: #5a5a6a; line-height: 1.45; margin-top: 3px; font-weight: 600; }
</style>

<div id="art">
  <h1>어떤 걸로 만드나요?</h1>
  <p class="sub">얼굴 없이도 종류가 다양해요</p>

  <div class="grid">
    <div class="c"><div class="em">🎬</div><div class="bd"><div class="t">정보·요약 영상</div><div class="d">자막과 이미지로 지식·꿀팁을 정리해주는 채널</div></div></div>
    <div class="c"><div class="em">🎙️</div><div class="bd"><div class="t">나레이션 콘텐츠</div><div class="d">목소리(또는 AI 음성) 해설로 스토리를 풀어가는 형태</div></div></div>
    <div class="c"><div class="em">📱</div><div class="bd"><div class="t">쇼츠·릴스</div><div class="d">짧게 꿀팁·정보를 던지는 숏폼. 진입이 제일 쉬워요</div></div></div>
    <div class="c"><div class="em">✍️</div><div class="bd"><div class="t">정보 블로그</div><div class="d">글과 도식으로 채우는 블로그. 이 블로그도 여기 해당</div></div></div>
  </div>
</div>
