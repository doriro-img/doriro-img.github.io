<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f4f2f6;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2b2b3d; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6e6e80; margin-bottom: 16px; font-weight: 600; }
  .three { display: flex; gap: 12px; margin-bottom: 13px; }
  .c { flex: 1; background: #fff; border-radius: 13px; padding: 15px 14px; text-align: center;
    box-shadow: 0 5px 13px rgba(60,50,90,.06); border: 1px solid #e6e2ec; }
  .c .em { font-size: 23px; }
  .c .t { font-size: 14px; font-weight: 800; color: #d13f38; margin: 6px 0 3px; }
  .c .d { font-size: 12.3px; color: #5a5a6a; line-height: 1.4; font-weight: 600; }
  .msg { background: #17a0a0; border-radius: 12px; padding: 13px 18px; color: #fff;
    font-size: 13.8px; line-height: 1.6; font-weight: 600; }
  .msg b { color: #d4f5f2; }
</style>

<div id="art">
  <h1>돈은 어떻게 벌어요?</h1>
  <p class="sub">플랫폼에 따라 수익 방식이 달라요</p>

  <div class="three">
    <div class="c"><div class="em">▶️</div><div class="t">유튜브 광고</div><div class="d">파트너 프로그램<br/>(구독자·시청시간 조건)</div></div>
    <div class="c"><div class="em">💰</div><div class="t">블로그 애드센스</div><div class="d">글에 광고 붙이기<br/>(승인 필요)</div></div>
    <div class="c"><div class="em">🔗</div><div class="t">제휴·쇼핑</div><div class="d">상품 링크·협찬<br/>으로 추가 수익</div></div>
  </div>

  <div class="msg"><b>단, 조회수만으론 부족해요.</b> 2026년 수익은 '얼마나 많이 봤나'가 아니라 '<b>얼마나 마음을 움직였나</b>'로 갈려요. 얕고 많은 것보다, 도움 되는 콘텐츠가 이겨요</div>
</div>
