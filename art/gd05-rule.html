<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art {
    width: 860px; padding: 34px 36px 30px; background: #fff;
    font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; color: #1b1b1b;
  }
  h1 { font-size: 20px; letter-spacing: -0.4px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6b6b6b; margin-bottom: 22px; }

  .cards { display: flex; gap: 12px; }
  .c { flex: 1; border: 1px solid #e2e6ea; border-radius: 12px; overflow: hidden; background: #fff; }
  .c .top { height: 108px; display: flex; align-items: center; justify-content: center; }
  .c1 .top { background: linear-gradient(160deg,#eef9f3,#d5f0e2); }
  .c2 .top { background: linear-gradient(160deg,#eff6fb,#d6e8f5); }
  .c3 .top { background: linear-gradient(160deg,#fdf6e9,#f8e7c5); }
  .c .body { padding: 15px 16px 17px; }
  .num { display: inline-block; width: 22px; height: 22px; border-radius: 50%; color: #fff;
         font-size: 12.5px; font-weight: 800; text-align: center; line-height: 22px; margin-bottom: 8px; }
  .c1 .num { background: #2f9e6e; } .c2 .num { background: #3f8fc4; } .c3 .num { background: #d4832f; }
  .c h2 { font-size: 15.5px; letter-spacing: -0.3px; margin-bottom: 6px; }
  .c p { font-size: 13px; line-height: 1.7; color: #4a5561; }
  .c p b { color: #1b1b1b; }
</style>

<div id="art">
  <h1>금액을 정할 때 기준 세 가지</h1>
  <p class="sub">남들 평균보다 이 세 가지가 먼저입니다</p>

  <div class="cards">

    <div class="c c1">
      <div class="top">
        <svg width="86" height="86" viewBox="0 0 86 86">
          <rect x="21" y="10" width="44" height="66" rx="7" fill="#fff" stroke="#2f9e6e" stroke-width="2.5"/>
          <rect x="28" y="18" width="30" height="14" rx="3" fill="#d5f0e2"/>
          <text x="43" y="29" text-anchor="middle" font-size="11" font-weight="800" fill="#23805a"
                font-family="Pretendard, Malgun Gothic, sans-serif">2~3%</text>
          <g fill="#a9dcc4">
            <rect x="28" y="38" width="10" height="9" rx="2"/><rect x="42" y="38" width="10" height="9" rx="2"/>
            <rect x="28" y="51" width="10" height="9" rx="2"/><rect x="42" y="51" width="10" height="9" rx="2"/>
            <rect x="28" y="64" width="24" height="9" rx="2"/>
          </g>
          <rect x="56" y="38" width="10" height="35" rx="2" fill="#2f9e6e"/>
        </svg>
      </div>
      <div class="body">
        <span class="num">1</span>
        <h2>내 소득에서 먼저 정합니다</h2>
        <p>명절 용돈 총액을 <b>가처분소득의 2~3%</b> 안에서 잡으라는 조언이 있습니다. 남들 평균에 맞추다 카드값이 밀리면 소용없어요</p>
      </div>
    </div>

    <div class="c c2">
      <div class="top">
        <svg width="86" height="86" viewBox="0 0 86 86">
          <rect x="14" y="20" width="58" height="48" rx="7" fill="#fff" stroke="#3f8fc4" stroke-width="2.5"/>
          <rect x="14" y="20" width="58" height="13" rx="7" fill="#3f8fc4"/>
          <rect x="14" y="26" width="58" height="7" fill="#3f8fc4"/>
          <g fill="#7fb4dd">
            <rect x="22" y="40" width="9" height="8" rx="2"/><rect x="36" y="40" width="9" height="8" rx="2"/>
            <rect x="50" y="40" width="9" height="8" rx="2"/>
            <rect x="22" y="53" width="9" height="8" rx="2"/><rect x="36" y="53" width="9" height="8" rx="2"/>
          </g>
          <circle cx="55" cy="57" r="9" fill="#2f6fb0"/>
          <path d="M51,57 l3,3 l6,-6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="body">
        <span class="num">2</span>
        <h2>내년에도 줄 수 있는 금액으로</h2>
        <p>한 번 올린 금액은 내리기가 어렵습니다. 올해 무리해서 <b>30만원</b>을 드리면 내년에도 그 밑으로는 못 내려가요</p>
      </div>
    </div>

    <div class="c c3">
      <div class="top">
        <svg width="86" height="86" viewBox="0 0 86 86">
          <rect x="8" y="28" width="40" height="30" rx="4" fill="#fff" stroke="#d4832f" stroke-width="2.5"/>
          <path d="M8,31 L28,46 L48,31" fill="none" stroke="#d4832f" stroke-width="2.5"/>
          <rect x="40" y="34" width="40" height="30" rx="4" fill="#fff" stroke="#d4832f" stroke-width="2.5"/>
          <path d="M40,37 L60,52 L80,37" fill="none" stroke="#d4832f" stroke-width="2.5"/>
          <circle cx="44" cy="22" r="10" fill="#f8e7c5"/>
          <path d="M40,22 h8 M44,18 v8" stroke="#d4832f" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="body">
        <span class="num">3</span>
        <h2>형제끼리 미리 맞춥니다</h2>
        <p>같은 조카한테 누구는 5만원 누구는 10만원이면 서로 불편해집니다. <b>단톡방에서 한마디</b>면 끝날 일이더라고요</p>
      </div>
    </div>

  </div>
</div>
