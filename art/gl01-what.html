<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #fdf1f5;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #3a2530; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #8a6a76; margin-bottom: 18px; font-weight: 600; }
  .three { display: flex; gap: 12px; margin-bottom: 14px; }
  .c { flex: 1; background: #fff; border-radius: 14px; padding: 17px 15px; text-align: center;
    box-shadow: 0 5px 13px rgba(180,80,120,.08); border: 1px solid #f3dde5; }
  .c .em { font-size: 26px; }
  .c .t { font-size: 14.5px; font-weight: 800; color: #c23d64; margin: 7px 0 4px; }
  .c .d { font-size: 12.5px; color: #6a5560; line-height: 1.45; font-weight: 600; }
  .note { background: #fff; border: 1.5px solid #f3dde5; border-radius: 12px; padding: 14px 18px;
    box-shadow: 0 4px 11px rgba(180,80,120,.05); font-size: 13.8px; color: #4a3540; line-height: 1.6; }
  .note b { color: #17a0a0; }
</style>

<div id="art">
  <h1>GLP-1이 뭐길래 난리인가요?</h1>
  <p class="sub">원래 당뇨약이었는데, 살이 빠져서 화제가 됐어요</p>

  <div class="three">
    <div class="c"><div class="em">🧠</div><div class="t">식욕 억제</div><div class="d">뇌에 작용해<br/>덜 먹고 싶게 만들어요</div></div>
    <div class="c"><div class="em">🍽️</div><div class="t">포만감 증진</div><div class="d">조금만 먹어도<br/>배부른 느낌이 들어요</div></div>
    <div class="c"><div class="em">⏳</div><div class="t">위 배출 지연</div><div class="d">소화가 천천히 돼서<br/>오래 든든해요</div></div>
  </div>

  <div class="note">한마디로 <b>'덜 먹게 만드는' 호르몬 작용을 흉내 낸 약</b>이에요. 자연스럽게 식사량이 줄어드니 체중이 빠지는 거죠. 원래는 제2형 당뇨 치료제로 쓰이다가 체중 감량 효과가 알려지며 비만치료제로 확대됐어요</div>
</div>
