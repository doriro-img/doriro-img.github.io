<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #fdf1f5;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #3a2530; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #8a6a76; margin-bottom: 16px; font-weight: 600; }
  .two { display: flex; gap: 13px; margin-bottom: 12px; }
  .c { flex: 1; background: #fff; border-radius: 15px; padding: 18px 20px; border: 1px solid #f3dde5;
    box-shadow: 0 5px 13px rgba(180,80,120,.07); }
  .c .nm { font-size: 18px; font-weight: 800; }
  .c .ing { font-size: 12px; color: #8a6a76; font-weight: 700; margin-top: 1px; }
  .wg .nm { color: #e0567f; } .mj .nm { color: #17a0a0; }
  .c .pct { font-size: 30px; font-weight: 800; margin: 10px 0 2px; }
  .wg .pct { color: #e0567f; } .mj .pct { color: #17a0a0; }
  .c .pl { font-size: 12.5px; color: #6a5560; font-weight: 700; }
  .c .tp { font-size: 12.5px; color: #55444c; margin-top: 8px; line-height: 1.45; font-weight: 600;
    border-top: 1px solid #f3e2e8; padding-top: 8px; }
  .etc { background: #fff; border: 1.5px solid #f3dde5; border-radius: 12px; padding: 12px 18px;
    font-size: 13px; color: #6a5560; line-height: 1.55; font-weight: 600; }
  .etc b { color: #3a2530; }
</style>

<div id="art">
  <h1>위고비? 마운자로? 뭐가 다른가요?</h1>
  <p class="sub">대표 두 가지예요 (성분과 효과가 달라요)</p>

  <div class="two">
    <div class="c wg">
      <div class="nm">위고비</div><div class="ing">성분: 세마글루타이드 · GLP-1 단일</div>
      <div class="pct">약 15%</div><div class="pl">평균 체중 감량</div>
      <div class="tp">심혈관 위험 감소 용도로도 국내 허가돼 있어요</div>
    </div>
    <div class="c mj">
      <div class="nm">마운자로</div><div class="ing">성분: 티르제파타이드 · GLP-1+GIP 이중</div>
      <div class="pct">약 22%</div><div class="pl">평균 체중 감량</div>
      <div class="tp">두 호르몬을 함께 자극해 감량 폭이 더 커요</div>
    </div>
  </div>

  <div class="etc"><b>그 외에</b> 삭센다, 오젬픽 등도 있어요. 성분·효과·투여 주기가 다르니, 어떤 게 맞는지는 <b>의사와 상담해서</b> 정해야 해요</div>
</div>
