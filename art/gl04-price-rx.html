<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #fdf1f5;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #3a2530; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #8a6a76; margin-bottom: 16px; font-weight: 600; }
  .two { display: flex; gap: 13px; margin-bottom: 12px; }
  .c { flex: 1; background: #fff; border-radius: 14px; padding: 16px 18px; border: 1px solid #f3dde5;
    box-shadow: 0 5px 13px rgba(180,80,120,.07); }
  .c .l { font-size: 12.5px; font-weight: 800; color: #c23d64; margin-bottom: 6px; }
  .c .v { font-size: 19px; font-weight: 800; color: #3a2530; line-height: 1.35; }
  .c .v small { font-size: 13px; color: #8a6a76; font-weight: 700; }
  .c .sub2 { font-size: 12.3px; color: #6a5560; margin-top: 6px; line-height: 1.45; font-weight: 600; }
  .ban { background: #e0567f; border-radius: 13px; padding: 14px 20px; color: #fff;
    display: flex; align-items: center; gap: 14px; }
  .ban .em { font-size: 26px; }
  .ban .t { font-size: 14px; line-height: 1.55; font-weight: 700; }
  .ban .t b { color: #ffe0ea; }
</style>

<div id="art">
  <h1>가격이랑 처방 조건은요?</h1>
  <p class="sub">아무나 미용으로 살 수 있는 게 아니에요</p>

  <div class="two">
    <div class="c">
      <div class="l">처방 기준 (BMI)</div>
      <div class="v">BMI 30 이상</div>
      <div class="sub2">또는 BMI 27 이상 + 고혈압·고지혈 등 동반질환이 있을 때</div>
    </div>
    <div class="c">
      <div class="l">비용 (비급여)</div>
      <div class="v">월 약 80만원<small> 안팎</small></div>
      <div class="sub2">보험 안 돼요. 약국·용량별 편차 큼 (수십만 원대)</div>
    </div>
  </div>

  <div class="ban">
    <div class="em">🏥</div>
    <div class="t"><b>비대면 처방은 금지예요 (2024년 12월부터).</b> 반드시 병원에 직접 방문해 대면 진료를 받아야 처방받을 수 있어요</div>
  </div>
</div>
