<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f2f6fc;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1c2c48; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6f7d95; margin-bottom: 20px; font-weight: 600; }
  .two { display: flex; gap: 16px; }
  .c { flex: 1; background: #fff; border-radius: 16px; padding: 22px; text-align: center;
    box-shadow: 0 6px 16px rgba(40,70,140,.08); border: 1px solid #e2e8f2; }
  .ic { height: 68px; display: flex; align-items: center; justify-content: center; }
  .t { font-size: 17px; font-weight: 800; margin-top: 8px; color: #d9584a; }
  .d { font-size: 13.5px; color: #45526c; line-height: 1.5; margin-top: 6px; }
  .d b { color: #1c2c48; }
</style>

<div id="art">
  <h1>정부 지원금, 신청 안 하면 못 받아요</h1>
  <p class="sub">자격이 돼도 '내가 직접 신청'해야만 나와요 — 이걸 '신청주의'라고 해요</p>

  <div class="two">
    <div class="c">
      <div class="ic"><svg width="66" height="60" viewBox="0 0 66 60"><rect x="16" y="8" width="34" height="44" rx="4" fill="#dfe6f2"/><line x1="23" y1="20" x2="43" y2="20" stroke="#aeb9cd" stroke-width="2.5" stroke-linecap="round"/><line x1="23" y1="28" x2="43" y2="28" stroke="#aeb9cd" stroke-width="2.5" stroke-linecap="round"/><circle cx="46" cy="44" r="15" fill="#fdeaea"/><path d="M40,38 l12,12 M52,38 l-12,12" stroke="#d9584a" stroke-width="3.5" stroke-linecap="round"/></svg></div>
      <div class="t">신청 안 하면 → 0원</div>
      <div class="d">자격이 있어도 <b>내가 신청하지 않으면</b><br />아무도 대신 챙겨주지 않아요</div>
    </div>
    <div class="c">
      <div class="ic"><svg width="66" height="60" viewBox="0 0 66 60"><circle cx="30" cy="30" r="20" fill="none" stroke="#aeb9cd" stroke-width="4"/><path d="M30,18 v12 l8,5" stroke="#aeb9cd" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M48,44 a13,13 0 1,0 4,-14" fill="none" stroke="#d9584a" stroke-width="3.5" stroke-linecap="round"/><path d="M50,26 l4,4 -6,3" fill="#d9584a"/></svg></div>
      <div class="t">대부분 소급 안 됨</div>
      <div class="d">뒤늦게 "나 자격 있었네" 해도<br /><b>지난 기간 건 못 받는</b> 경우가 많아요</div>
    </div>
  </div>
</div>
