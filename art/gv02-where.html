<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f2f6fc;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1c2c48; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6f7d95; margin-bottom: 20px; font-weight: 600; }
  .three { display: flex; gap: 13px; }
  .c { flex: 1; background: #fff; border-radius: 16px; padding: 20px 16px 18px; text-align: center;
    box-shadow: 0 6px 15px rgba(40,70,140,.08); border-top: 5px solid #ddd; }
  .c1 { border-top-color: #2563cc; } .c2 { border-top-color: #e0698a; } .c3 { border-top-color: #16a34a; }
  .ic { height: 60px; display: flex; align-items: center; justify-content: center; }
  .nm { font-size: 17px; font-weight: 800; margin-top: 6px; }
  .c1 .nm { color: #2563cc; } .c2 .nm { color: #d24d72; } .c3 .nm { color: #158a44; }
  .de { font-size: 13px; color: #5a6580; line-height: 1.5; margin-top: 6px; }
  .note { margin-top: 16px; background: #e7effb; border-radius: 12px; padding: 13px 18px; font-size: 13px;
    color: #40527a; line-height: 1.6; text-align: center; }
  .note b { color: #2563cc; }
</style>

<div id="art">
  <h1>어디서 조회하나요? 세 곳이에요</h1>
  <p class="sub">전부 무료로 '내게 맞는 지원금'을 찾아줘요</p>

  <div class="three">
    <div class="c c1">
      <div class="ic"><svg width="56" height="52" viewBox="0 0 56 52"><path d="M10,20 L28,8 L46,20 Z" fill="#2563cc"/><rect x="14" y="20" width="28" height="24" fill="#4a7ad6"/><rect x="8" y="44" width="40" height="5" rx="2" fill="#2563cc"/><rect x="19" y="26" width="5" height="18" fill="#dfe9fb"/><rect x="26" y="26" width="5" height="18" fill="#dfe9fb"/><rect x="33" y="26" width="5" height="18" fill="#dfe9fb"/></svg></div>
      <div class="nm">보조금24</div>
      <div class="de">정부24 안에 있어요<br />정부 지원금 <b>종합</b></div>
    </div>
    <div class="c c2">
      <div class="ic"><svg width="56" height="52" viewBox="0 0 56 52"><path d="M28,46 C10,32 6,20 15,14 C22,9 28,15 28,21 C28,15 34,9 41,14 C50,20 46,32 28,46 Z" fill="#e0698a"/></svg></div>
      <div class="nm">복지로</div>
      <div class="de">복지 급여·서비스<br />(양육·돌봄 등)</div>
    </div>
    <div class="c c3">
      <div class="ic"><svg width="56" height="52" viewBox="0 0 56 52"><rect x="10" y="20" width="36" height="24" rx="4" fill="#16a34a"/><path d="M22,20 V16 a4,4 0 0,1 4,-4 h4 a4,4 0 0,1 4,4 V20" fill="none" stroke="#16a34a" stroke-width="3"/><rect x="10" y="28" width="36" height="4" fill="#0f7a2e"/></svg></div>
      <div class="nm">고용24</div>
      <div class="de">고용·취업 지원<br />(실업급여·훈련 등)</div>
    </div>
  </div>

  <div class="note">세 곳 다 로그인하면 <b>내가 받을 수 있는 것</b>과 이미 받고 있는 걸 알려줘요. 하나만 보지 말고 셋 다 확인하세요</div>
</div>
