<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f2f6fc;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1c2c48; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6f7d95; margin-bottom: 22px; font-weight: 600; }
  .steps { display: flex; align-items: stretch; gap: 8px; }
  .step { flex: 1; background: #fff; border-radius: 16px; padding: 20px 16px 18px; text-align: center;
    box-shadow: 0 6px 16px rgba(40,70,140,.08); border: 1px solid #e2e8f2; }
  .n { width: 30px; height: 30px; border-radius: 50%; background: #2563cc; color: #fff; font-size: 15px;
    font-weight: 800; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
  .ic { height: 54px; display: flex; align-items: center; justify-content: center; }
  .t { font-size: 15px; font-weight: 800; margin-top: 8px; }
  .d { font-size: 12.5px; color: #5a6580; line-height: 1.5; margin-top: 5px; }
  .ar { flex: none; display: flex; align-items: center; color: #a9badd; font-size: 22px; font-weight: 800; }
</style>

<div id="art">
  <h1>보조금24 조회, 이렇게 해요</h1>
  <p class="sub">몇 분이면 내가 받을 수 있는 게 다 나와요</p>

  <div class="steps">
    <div class="step">
      <div class="n">1</div>
      <div class="ic"><svg width="50" height="50" viewBox="0 0 50 50"><rect x="16" y="6" width="20" height="38" rx="5" fill="#2563cc"/><rect x="20" y="11" width="12" height="24" rx="2" fill="#dfe9fb"/><circle cx="26" cy="39" r="2" fill="#dfe9fb"/><path d="M26,20 v-4 a3,3 0 0,1 6,0" fill="none" stroke="#2563cc" stroke-width="0"/></svg></div>
      <div class="t">정부24 로그인</div>
      <div class="d">간편인증<br />(카카오·네이버 등)</div>
    </div>
    <div class="ar">→</div>
    <div class="step">
      <div class="n">2</div>
      <div class="ic"><svg width="50" height="50" viewBox="0 0 50 50"><circle cx="22" cy="21" r="13" fill="none" stroke="#2563cc" stroke-width="4"/><line x1="32" y1="31" x2="42" y2="41" stroke="#2563cc" stroke-width="5" stroke-linecap="round"/><path d="M17,21 l4,4 8,-9" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="t">'보조금24' 맞춤안내</div>
      <div class="d">내 상황에 맞는<br />지원금 조회</div>
    </div>
    <div class="ar">→</div>
    <div class="step">
      <div class="n">3</div>
      <div class="ic"><svg width="50" height="50" viewBox="0 0 50 50"><circle cx="25" cy="25" r="19" fill="#e4f4ec"/><path d="M16,25 l6,7 12,-14" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="t">확인 후 신청</div>
      <div class="d">받을 수 있는 걸<br />바로 신청</div>
    </div>
  </div>
</div>
