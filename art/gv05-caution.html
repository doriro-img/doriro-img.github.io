<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 32px; background: #f2f6fc;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1c2c48; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6f7d95; margin-bottom: 20px; font-weight: 600; }
  .warn { background: #fef2f2; border: 1.5px solid #f3c4c4; border-radius: 16px; padding: 20px 24px;
    display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
  .warn .ic { flex: none; }
  .warn .t { font-size: 18px; font-weight: 800; color: #c0392b; }
  .warn .d { font-size: 14px; color: #8a4a45; line-height: 1.5; margin-top: 4px; }
  .warn .d b { color: #c0392b; }
  .tip { background: #fff; border: 1px solid #d6e2f5; border-left: 4px solid #2563cc; border-radius: 12px; padding: 16px 20px;
    display: flex; align-items: center; gap: 14px; }
  .tip .ic { flex: none; }
  .tip .tx { font-size: 14px; color: #35476a; line-height: 1.5; } .tip .tx b { color: #2563cc; }
</style>

<div id="art">
  <h1>이것만 조심하세요</h1>
  <p class="sub">무료 서비스라, 이걸 노리는 사기가 붙어요</p>

  <div class="warn">
    <div class="ic"><svg width="54" height="54" viewBox="0 0 54 54"><path d="M27,6 L50,46 H4 Z" fill="#fdeaea" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/><line x1="27" y1="21" x2="27" y2="33" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/><circle cx="27" cy="40" r="2.5" fill="#dc2626"/></svg></div>
    <div>
      <div class="t">조회·신청은 전부 '무료'예요</div>
      <div class="d">"지원금 대신 받아주겠다"며 <b>수수료·개인정보를 요구하면 사기</b>예요. 문자·전화 링크는 누르지 마세요</div>
    </div>
  </div>

  <div class="tip">
    <div class="ic"><svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#e7effb"/><path d="M20,11 a6,6 0 0,1 6,6 c0,3 -3,4 -3,7 h-6 c0,-3 -3,-4 -3,-7 a6,6 0 0,1 6,-6 Z" fill="#2563cc"/><rect x="17" y="26" width="6" height="3" rx="1.5" fill="#2563cc"/></svg></div>
    <div class="tx"><b>소급이 안 되니 지금 바로 조회하세요.</b> 그리고 보조금24에서 <b>맞춤 알림</b>을 켜두면, 새로 생기는 지원금을 놓치지 않고 안내받을 수 있어요</div>
  </div>
</div>
