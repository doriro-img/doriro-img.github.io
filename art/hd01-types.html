<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f3faf5;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #16351f; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #5e7a67; margin-bottom: 20px; font-weight: 600; }
  .sub b { color: #d4a017; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  .c { background: #fff; border-radius: 15px; padding: 18px 20px; display: flex; align-items: center; gap: 15px;
    box-shadow: 0 6px 15px rgba(30,90,50,.07); border: 1px solid #dcefe2; }
  .ic { flex: none; width: 50px; height: 50px; border-radius: 13px; background: #e7f5ec; display: flex; align-items: center; justify-content: center; }
  .tx .t { font-size: 16px; font-weight: 800; }
  .tx .s { font-size: 12.5px; color: #5e7a67; font-weight: 700; margin-top: 3px; }
  .tx .s b { color: #16a34a; }
</style>

<div id="art">
  <h1>안 찾아가면 사라지는 '내 돈' 4가지</h1>
  <p class="sub">안 찾아간 숨은 금융자산이 <b>18조가 넘어요.</b> 내 것도 있을 수 있어요</p>

  <div class="grid">
    <div class="c">
      <div class="ic"><svg width="28" height="28" viewBox="0 0 28 28"><path d="M14,3 L23,6 V13 C23,19 14,25 14,25 C14,25 5,19 5,13 V6 Z" fill="#16a34a"/><path d="M10,14 l3,3 5,-6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="tx"><div class="t">숨은 보험금</div><div class="s">→ <b>내보험찾아줌</b></div></div>
    </div>
    <div class="c">
      <div class="ic"><svg width="28" height="28" viewBox="0 0 28 28"><rect x="4" y="7" width="20" height="15" rx="2.5" fill="#16a34a"/><rect x="4" y="11" width="20" height="3" fill="#0f7a2e"/><rect x="7" y="17" width="8" height="2.5" rx="1.25" fill="#bfe8cd"/></svg></div>
      <div class="tx"><div class="t">휴면예금·계좌</div><div class="s">→ <b>어카운트인포</b></div></div>
    </div>
    <div class="c">
      <div class="ic"><svg width="28" height="28" viewBox="0 0 28 28"><path d="M7,3 h14 v20 l-3,-2 -2,2 -2,-2 -2,2 -2,-2 -3,2 Z" fill="#16a34a"/><line x1="11" y1="9" x2="17" y2="9" stroke="#fff" stroke-width="2" stroke-linecap="round"/><line x1="11" y1="14" x2="17" y2="14" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></div>
      <div class="tx"><div class="t">미환급금 (세금)</div><div class="s">→ <b>정부24 · 홈택스</b></div></div>
    </div>
    <div class="c">
      <div class="ic"><svg width="28" height="28" viewBox="0 0 28 28"><rect x="3" y="7" width="22" height="15" rx="2.5" fill="#16a34a"/><rect x="3" y="11" width="22" height="3" fill="#0f7a2e"/><circle cx="19" cy="18" r="3" fill="#d4a017"/><text x="19" y="20.5" text-anchor="middle" font-size="4.5" font-weight="800" fill="#fff">P</text></svg></div>
      <div class="tx"><div class="t">카드포인트</div><div class="s">→ <b>카드포인트 통합조회</b></div></div>
    </div>
  </div>
</div>
