<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f3faf5;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #16351f; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #5e7a67; margin-bottom: 18px; font-weight: 600; }
  .site { background: #16a34a; border-radius: 14px; padding: 16px 128px 16px 20px; margin-bottom: 16px; position: relative; }
  .site .n { display: inline; font-size: 17px; font-weight: 800; color: #fff; }
  .site .u { display: inline; font-size: 13px; color: #c9f0d5; font-weight: 700; margin-left: 8px; }
  .site .r { position: absolute; top: 50%; right: 20px; transform: translateY(-50%); font-size: 12.5px; font-weight: 800; color: #16a34a; background: #fff; padding: 6px 13px; border-radius: 14px; }
  .steps { display: flex; align-items: stretch; gap: 8px; }
  .step { flex: 1; background: #fff; border-radius: 14px; padding: 16px 14px; text-align: center;
    box-shadow: 0 5px 13px rgba(30,90,50,.06); border: 1px solid #dcefe2; }
  .n { width: 26px; height: 26px; border-radius: 50%; background: #16a34a; color: #fff; font-size: 14px;
    font-weight: 800; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; }
  .t { font-size: 14.5px; font-weight: 800; }
  .d { font-size: 12px; color: #5e7a67; line-height: 1.45; margin-top: 4px; }
  .ar { flex: none; display: flex; align-items: center; color: #a9d6b8; font-size: 20px; font-weight: 800; }
  .note { margin-top: 15px; background: #eaf6ee; border-radius: 12px; padding: 12px 18px; font-size: 12.5px;
    color: #3f6a4e; line-height: 1.6; text-align: center; }
  .note b { color: #d4a017; }
</style>

<div id="art">
  <h1>1. 숨은 보험금 — '내보험찾아줌'</h1>
  <p class="sub">안 찾아간 만기·중도·휴면 보험금과 배당금을 한 번에</p>

  <div class="site">
    <div class="n">내보험찾아줌</div>
    <div class="u">cont.insure.or.kr · 생명·손해보험협회</div>
    <div class="r">전액 무료</div>
  </div>

  <div class="steps">
    <div class="step"><div class="n">1</div><div class="t">사이트 접속</div><div class="d">24시간 언제든</div></div>
    <div class="ar">→</div>
    <div class="step"><div class="n">2</div><div class="t">간편인증</div><div class="d">카카오·네이버·PASS</div></div>
    <div class="ar">→</div>
    <div class="step"><div class="n">3</div><div class="t">조회·청구</div><div class="d">내 모든 보험 + 숨은 보험금</div></div>
  </div>

  <div class="note">찾지 않은 <b>이자까지 포함</b>돼서 나와요. 부모님 것도 본인 인증으로 확인하시면 좋아요</div>
</div>
