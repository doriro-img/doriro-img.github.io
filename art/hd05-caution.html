<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 32px; background: #f3faf5;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #16351f; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #5e7a67; margin-bottom: 20px; font-weight: 600; }
  .warn { background: #fef2f2; border: 1.5px solid #f3c4c4; border-radius: 16px; padding: 20px 24px;
    display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
  .warn .ic { flex: none; }
  .warn .tx .t { font-size: 18px; font-weight: 800; color: #c0392b; }
  .warn .tx .d { font-size: 14px; color: #8a4a45; line-height: 1.5; margin-top: 4px; }
  .warn .tx .d b { color: #c0392b; }
  .tip { background: #fff; border: 1px solid #dcefe2; border-radius: 14px; padding: 16px 20px; display: flex; align-items: center; gap: 14px; }
  .tip .ic { flex: none; }
  .tip .tx { font-size: 14px; color: #2f4a38; line-height: 1.5; } .tip .tx b { color: #16a34a; }
</style>

<div id="art">
  <h1>딱 하나, 이것만 조심하세요</h1>
  <p class="sub">편하게 찾을 수 있는 만큼, 사기도 붙어요</p>

  <div class="warn">
    <div class="ic"><svg width="56" height="56" viewBox="0 0 56 56"><path d="M28,6 L52,48 H4 Z" fill="#fdeaea" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/><line x1="28" y1="22" x2="28" y2="35" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/><circle cx="28" cy="42" r="2.6" fill="#dc2626"/></svg></div>
    <div class="tx">
      <div class="t">조회·청구는 전부 '무료'예요</div>
      <div class="d">"대신 찾아주겠다"며 <b>수수료를 요구하면 100% 사기</b>입니다. 문자·전화로 접근하는 곳은 거르세요</div>
    </div>
  </div>

  <div class="tip">
    <div class="ic"><svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#e7f5ec"/><path d="M13,20 l5,5 9,-11" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="tx"><b>공식 사이트만</b> 쓰세요 — 보험협회·정부24·금감원 '파인'. <b>어카운트인포·파인</b>에서 여러 개를 한 번에 조회하면 제일 편해요</div>
  </div>
</div>
