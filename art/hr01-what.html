<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #edf4f6;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #263640; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #5f7480; margin-bottom: 18px; font-weight: 600; }
  .steps { display: flex; flex-direction: column; gap: 10px; margin-bottom: 13px; }
  .st { background: #fff; border-radius: 13px; padding: 14px 18px; display: flex; align-items: center; gap: 15px;
    box-shadow: 0 5px 13px rgba(40,110,140,.07); border: 1px solid #d7e6ea; }
  .n { flex: none; width: 34px; height: 34px; border-radius: 50%; background: #2984a8; color: #fff;
    font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .bd .t { font-size: 15.5px; font-weight: 800; color: #1f6a88; }
  .bd .d { font-size: 13px; color: #55666e; line-height: 1.45; margin-top: 1px; font-weight: 600; }
  .bd .d b { color: #e0932e; }
  .note { background: #fff; border: 1.5px solid #d7e6ea; border-radius: 12px; padding: 13px 18px;
    box-shadow: 0 4px 11px rgba(40,110,140,.05); font-size: 13.8px; color: #37474f; line-height: 1.6; }
  .note b { color: #2984a8; }
</style>

<div id="art">
  <h1>희귀난치병 의료비, 혼자 감당 마세요</h1>
  <p class="sub">정부 지원이 크게 3단계로 있어요</p>

  <div class="steps">
    <div class="st"><div class="n">1</div><div class="bd"><div class="t">산정특례</div><div class="d">병원비 <b>본인부담을 10%</b>로 낮춰줘요 (기본)</div></div></div>
    <div class="st"><div class="n">2</div><div class="bd"><div class="t">희귀질환 의료비 지원사업</div><div class="d">소득 기준이 되면 <b>그 위에 더</b> 얹어줘요</div></div></div>
    <div class="st"><div class="n">3</div><div class="bd"><div class="t">재난적 의료비 지원</div><div class="d">감당 안 될 만큼 크면 <b>50~80%</b>까지 도와줘요</div></div></div>
  </div>

  <div class="note"><b>몰라서 못 받는 경우가 정말 많아요.</b> 이 세 가지는 겹쳐서 받을 수 있으니, 하나씩 차근차근 알아두면 큰 힘이 돼요</div>
</div>
