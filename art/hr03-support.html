<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #edf4f6;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #263640; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #5f7480; margin-bottom: 16px; font-weight: 600; }
  .pt { background: #fff; border-radius: 13px; padding: 14px 18px; margin-bottom: 12px; border: 1px solid #d7e6ea;
    box-shadow: 0 5px 13px rgba(40,110,140,.06); }
  .pt .h { font-size: 14.5px; font-weight: 800; color: #1f6a88; margin-bottom: 4px; }
  .pt .d { font-size: 13.5px; color: #45565e; line-height: 1.55; }
  .pt .d b { color: #e0932e; }
  .inc { background: #fff8ec; border: 1.5px solid #f0dcb0; border-radius: 12px; padding: 13px 18px; }
  .inc .h { font-size: 13px; font-weight: 800; color: #a5771e; margin-bottom: 8px; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: #fff; border: 1px solid #ecd9ac; border-radius: 8px; padding: 6px 11px; font-size: 12.5px; font-weight: 700; color: #6a5836; }
  .chip b { color: #2984a8; }
</style>

<div id="art">
  <h1>② 희귀질환 의료비 지원사업</h1>
  <p class="sub">산정특례 위에 '한 번 더' 얹어주는 지원이에요</p>

  <div class="pt">
    <div class="h">누가 받나요?</div>
    <div class="d"><b>산정특례에 먼저 등록</b>한 사람 중에서, 소득·재산 기준(기준 중위소득 140% 미만)을 충족하면 돼요. 신청은 <b>보건소</b>에서 해요</div>
  </div>

  <div class="inc">
    <div class="h">2026년 소득기준 (중위 140% 미만, 월)</div>
    <div class="grid">
      <div class="chip">1인 <b>약 335만</b></div>
      <div class="chip">2인 <b>약 551만</b></div>
      <div class="chip">3인 <b>약 704만</b></div>
      <div class="chip">4인 <b>약 854만</b></div>
      <div class="chip">5인 <b>약 995만</b></div>
    </div>
  </div>
</div>
