<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f3f1ec;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2a2a2a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; color: #2c3e50; }
  .sub { font-size: 13.5px; color: #6b6255; margin-bottom: 18px; font-weight: 600; }
  .tl { position: relative; padding-left: 22px; }
  .tl::before { content: ''; position: absolute; left: 6px; top: 8px; bottom: 10px; width: 3px; background: #d9cfbf; border-radius: 2px; }
  .row { position: relative; background: #fff; border-radius: 12px; padding: 13px 18px; margin-bottom: 10px;
    box-shadow: 0 5px 13px rgba(80,70,50,.06); border: 1px solid #e5ded2; }
  .row::before { content: ''; position: absolute; left: -19px; top: 18px; width: 12px; height: 12px; border-radius: 50%;
    background: #2c3e50; border: 3px solid #f3f1ec; }
  .st { font-size: 12.5px; font-weight: 800; color: #2c3e50; }
  .tx { font-size: 14px; color: #3a3a3a; line-height: 1.5; margin-top: 2px; }
  .tx b { color: #c0392b; }
</style>

<div id="art">
  <h1>하영 증조부 논란, 무슨 일이었나요?</h1>
  <p class="sub">특정인을 비난하려는 게 아니라, 확인된 사실만 짚어볼게요</p>

  <div class="tl">
    <div class="row"><div class="st">발단</div><div class="tx">배우 하영이 주연을 맡으며 증조부 이야기를 자랑스럽게 언급했어요</div></div>
    <div class="row"><div class="st">논란</div><div class="tx">증조부 <b>안상호</b>(일제강점기 의사로 활동)의 친일 행적 논란이 불거졌어요</div></div>
    <div class="row"><div class="st">확인</div><div class="tx">1916년 친일 단체 <b>'대정친목회' 평의원 명단</b>에 이름이 오른 게 확인됐고, 소속사도 이를 인정했어요</div></div>
    <div class="row"><div class="st">사과</div><div class="tx">하영은 자필로 "사실을 모르고 조상 이야기를 꺼냈다"며 사과했어요</div></div>
  </div>
</div>
