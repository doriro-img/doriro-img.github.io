<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f3f1ec;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2a2a2a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; color: #2c3e50; }
  .sub { font-size: 13.5px; color: #6b6255; margin-bottom: 18px; font-weight: 600; }
  .hero { background: #2c3e50; border-radius: 15px; padding: 17px 22px; color: #fff; margin-bottom: 13px;
    display: flex; align-items: center; gap: 18px; }
  .hero .d { font-size: 30px; font-weight: 800; color: #f0c14b; line-height: 1.05; }
  .hero .d small { display: block; font-size: 14px; color: #cdd6de; font-weight: 700; margin-top: 3px; }
  .hero .r { font-size: 14px; line-height: 1.55; font-weight: 600; }
  .key { background: #fff; border: 1.5px solid #e5ded2; border-radius: 13px; padding: 15px 20px;
    box-shadow: 0 5px 13px rgba(80,70,50,.05); }
  .key .h { font-size: 15px; font-weight: 800; color: #c0392b; margin-bottom: 5px; }
  .key .t { font-size: 13.8px; line-height: 1.65; color: #3a3a3a; }
  .key .t b { color: #2c3e50; }
</style>

<div id="art">
  <h1>친일재산환수, 12월에 다시 시작돼요</h1>
  <p class="sub">이 논란으로 관심이 커진 제도의 실체예요</p>

  <div class="hero">
    <div class="d">12/3<small>특별법 시행</small></div>
    <div class="r">'친일반민족행위자 재산의 국가귀속 특별법'이 시행되고, <b style="color:#f0c14b">친일재산조사위원회가 16년 만에 재출범</b>해요</div>
  </div>

  <div class="key">
    <div class="h">핵심은 이거예요 — "후손을 처벌하는 제도가 아니다"</div>
    <div class="t">조상이 <b>친일의 대가로 취득한 '특정 재산'</b>이 후손에게 상속됐거나 그 처분 대가가 이어졌을 때, 그 부분만 국가가 되찾는 거예요. 후손이라는 이유로 벌하는 게 아니에요</div>
  </div>
</div>
