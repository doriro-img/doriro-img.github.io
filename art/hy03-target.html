<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f3f1ec;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2a2a2a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; color: #2c3e50; }
  .sub { font-size: 13.5px; color: #6b6255; margin-bottom: 18px; font-weight: 600; }
  .two { display: flex; gap: 13px; margin-bottom: 13px; }
  .col { flex: 1; background: #fff; border-radius: 14px; padding: 16px 18px; border: 1px solid #e5ded2;
    box-shadow: 0 5px 13px rgba(80,70,50,.06); }
  .col .h { font-size: 15px; font-weight: 800; margin-bottom: 11px; display: flex; align-items: center; gap: 8px; }
  .yes .h { color: #c0392b; } .no .h { color: #2f7d5a; }
  .badge { width: 24px; height: 24px; border-radius: 7px; color: #fff; font-size: 14px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; }
  .yes .badge { background: #c0392b; } .no .badge { background: #2f9e6b; }
  .li { font-size: 13.3px; color: #3a3a3a; line-height: 1.45; padding: 6px 0; border-top: 1px solid #f0ebe1; }
  .li:first-of-type { border-top: none; }
  .foot { background: #eef2f6; border: 1.5px solid #cdd9e4; border-radius: 12px; padding: 12px 18px;
    font-size: 13px; color: #2c3e50; line-height: 1.6; font-weight: 600; text-align: center; }
  .foot b { color: #1f5fa8; }
</style>

<div id="art">
  <h1>뭐가 환수되고, 뭐가 안 되나요?</h1>
  <p class="sub">이 구분이 이 제도의 핵심이에요</p>

  <div class="two">
    <div class="col yes">
      <div class="h"><span class="badge">O</span>환수 대상</div>
      <div class="li">친일의 대가로 취득한 재산</div>
      <div class="li">그 재산을 물려받은 상속분</div>
      <div class="li">팔았다면 그 처분 대가(돈)까지</div>
    </div>
    <div class="col no">
      <div class="h"><span class="badge">X</span>환수 대상 아님</div>
      <div class="li">후손이 스스로 번 돈 (출연료·광고 등)</div>
      <div class="li">본인이 취득한 부동산·예금</div>
      <div class="li">친일과 무관한 일반 상속재산</div>
    </div>
  </div>

  <div class="foot"><b>그래서 연좌제(헌법 금지)에 어긋나지 않아요.</b> 후손 자신이 번 재산까지 뺏는 게 아니니까요</div>
</div>
