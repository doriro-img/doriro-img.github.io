<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f3f1ec;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2a2a2a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; color: #2c3e50; }
  .sub { font-size: 13.5px; color: #6b6255; margin-bottom: 18px; font-weight: 600; }
  .list { display: flex; flex-direction: column; gap: 11px; }
  .item { background: #fff; border-radius: 13px; padding: 14px 18px; display: flex; align-items: flex-start; gap: 14px;
    box-shadow: 0 5px 13px rgba(80,70,50,.06); border: 1px solid #e5ded2; }
  .ic { flex: none; width: 30px; height: 30px; border-radius: 8px; background: #2c3e50; color: #fff;
    font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .tt .t { font-size: 14.5px; font-weight: 800; color: #2c3e50; }
  .tt .d { font-size: 13px; color: #5a5245; line-height: 1.5; margin-top: 2px; }
  .tt .d b { color: #c0392b; }
</style>

<div id="art">
  <h1>이 논란이 남긴 것</h1>
  <p class="sub">비난보다 중요한 건 제도를 정확히 아는 거더라고요</p>

  <div class="list">
    <div class="item"><div class="ic">1</div><div class="tt"><div class="t">"팔았어도 환수"가 이 법의 특징</div><div class="d">친일재산을 이미 처분했더라도 <b>그 대가(돈)까지 추적</b>해 되찾을 수 있어요</div></div></div>
    <div class="item"><div class="ic">2</div><div class="tt"><div class="t">목적은 '처벌'이 아니라 '환원'</div><div class="d">부당하게 취득된 재산을 국가로 되돌리는 것이지, 후손을 벌하는 게 아니에요</div></div></div>
    <div class="item"><div class="ic">3</div><div class="tt"><div class="t">개인과 조상의 행위는 별개</div><div class="d">후손이 스스로 일군 삶과 재산까지 싸잡아 비난할 근거는 <b>법에도 없어요</b></div></div></div>
    <div class="item"><div class="ic">4</div><div class="tt"><div class="t">관심이 커진 것 자체가 의미</div><div class="d">잊혔던 친일재산 문제가 12월 조사위 재출범과 함께 다시 주목받게 됐어요</div></div></div>
  </div>
</div>
