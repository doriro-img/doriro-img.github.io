<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 34px 36px 30px; background: #fff;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1b1b1b; }
  h1 { font-size: 20px; letter-spacing: -0.4px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6b6b6b; margin-bottom: 20px; }
  .two { display: flex; gap: 14px; margin-bottom: 14px; }
  .p { flex: 1; border-radius: 12px; overflow: hidden; border: 1px solid; }
  .pa { border-color: #f0b8b1; } .pb { border-color: #a9dcc4; }
  .ph { padding: 12px 18px; font-size: 15px; font-weight: 800; color: #fff;
        display: flex; justify-content: space-between; align-items: center; }
  .pa .ph { background: #cf4f43; } .pb .ph { background: #2f9e6e; }
  .ph .e { font-size: 11.5px; font-weight: 700; opacity: .95; }
  .bd { padding: 15px 18px 17px; }
  .pa .bd { background: #fdf3f1; } .pb .bd { background: #f4fbf7; }
  .r { display: flex; justify-content: space-between; align-items: baseline;
       padding: 9px 0; border-bottom: 1px dashed #d9e0e6; }
  .r:last-child { border-bottom: none; }
  .r .k { font-size: 12.5px; color: #7b848f; font-weight: 700; }
  .r .v { font-size: 15px; font-weight: 800; }
  .pa .r .v { color: #b8463a; } .pb .r .v { color: #1d7050; }
  .gain { margin-top: 14px; background: #1b1b1b; color: #fff; border-radius: 11px;
          padding: 15px 20px; display: flex; align-items: center; gap: 20px; }
  .gain .big { font-size: 25px; font-weight: 800; color: #7ee0b0; letter-spacing: -1px; white-space: nowrap; }
  .gain p { font-size: 13.5px; line-height: 1.7; color: #d8dee4; }
  .gain p b { color: #ffd97a; }
</style>
<div id="art">
  <h1>한 번에 빼면 세금을 다 냅니다</h1>
  <p class="sub">같은 퇴직금인데 받는 방법에 따라 달라집니다</p>
  <div class="two">
    <div class="p pa">
      <div class="ph"><span>일시금으로 받기</span><span class="e">한 번에 인출</span></div>
      <div class="bd">
        <div class="r"><span class="k">퇴직소득세</span><span class="v">전액 부담</span></div>
        <div class="r"><span class="k">감면</span><span class="v">없음</span></div>
        <div class="r"><span class="k">운용해서 번 돈</span><span class="v">기타소득세 16.5%</span></div>
        <div class="r"><span class="k">받는 나이</span><span class="v">제한 없음</span></div>
      </div>
    </div>
    <div class="p pb">
      <div class="ph"><span>연금으로 나눠 받기</span><span class="e">만 55세 이후</span></div>
      <div class="bd">
        <div class="r"><span class="k">퇴직소득세</span><span class="v">30% 감면</span></div>
        <div class="r"><span class="k">10년 넘게 나눠 받으면</span><span class="v">40%까지 감면</span></div>
        <div class="r"><span class="k">운용해서 번 돈</span><span class="v">연금소득세 3.3~5.5%</span></div>
        <div class="r"><span class="k">받는 나이</span><span class="v">만 55세부터</span></div>
      </div>
    </div>
  </div>
  <div class="gain">
    <div class="big">30 ~ 40% 차이</div>
    <p>퇴직금을 IRP로 받았다면 <b>가입기간 조건 없이 만 55세부터</b> 연금으로 뺄 수 있습니다.<br />
      급하지 않다면 <b>10년 넘게 나눠 받는 쪽</b>이 세금을 가장 적게 냅니다</p>
  </div>
</div>
