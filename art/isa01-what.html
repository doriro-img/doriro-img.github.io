<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #eef1f8;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #26304a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6a7492; margin-bottom: 18px; font-weight: 600; }
  .box { background: #fff; border-radius: 14px; padding: 16px 20px; border: 1px solid #dde3f0;
    box-shadow: 0 5px 13px rgba(40,60,130,.06); margin-bottom: 13px; }
  .box .h { font-size: 14.5px; font-weight: 800; color: #2456a8; margin-bottom: 8px; }
  .chips { display: flex; gap: 8px; }
  .chip { flex: 1; text-align: center; background: #eef1f8; border-radius: 10px; padding: 12px 6px; font-size: 14px; font-weight: 800; color: #2456a8; }
  .tax { background: #fff; border: 1.5px solid #dde3f0; border-radius: 14px; padding: 15px 20px;
    box-shadow: 0 5px 13px rgba(40,60,130,.05); }
  .tax .h { font-size: 14px; font-weight: 800; color: #c2851a; margin-bottom: 8px; }
  .tax .row { display: flex; align-items: center; gap: 10px; font-size: 13.8px; color: #37425e; line-height: 1.5; padding: 4px 0; font-weight: 600; }
  .tax .row b { color: #26304a; }
  .dot { color: #e0a020; font-weight: 800; }
</style>

<div id="art">
  <h1>ISA가 뭔데 이렇게 시끄러워요?</h1>
  <p class="sub">예금·펀드·주식을 한 계좌에 담는 '절세 만능통장'이에요</p>

  <div class="box">
    <div class="h">하나의 계좌에 다 담아요</div>
    <div class="chips">
      <div class="chip">예금</div>
      <div class="chip">펀드</div>
      <div class="chip">주식</div>
    </div>
  </div>

  <div class="tax">
    <div class="h">핵심은 '세금 혜택'이에요</div>
    <div class="row"><span class="dot">●</span><b>수익 200만원까지 비과세</b> (서민형은 400만원)</div>
    <div class="row"><span class="dot">●</span>초과분도 <b>9.9%만</b> (일반 이자·배당세 15.4%보다 훨씬 낮아요)</div>
  </div>
</div>
