<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #eef1f8;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #26304a; }

  .two { display: flex; gap: 12px; margin-bottom: 13px; }

<div id="art">
  <h1>그런데 여기서 논란이 터졌어요</h1>
  <p class="sub">일반 ISA 혜택을 '축소'하려 했거든요</p>

  <div class="two">
    <div class="c"><div class="m">1</div><div class="bd"><div class="t">계약기간 5년 제한</div><div class="d">오래 굴리며 비과세 받던 걸 <b>최대 5년으로</b> 묶으려 했어요</div></div></div>
    <div class="c"><div class="m">2</div><div class="bd"><div class="t">한도 이월 폐지</div><div class="d">못 채운 납입한도를 다음 해로 <b>넘기지 못하게</b> 하려 했어요</div></div></div>
  </div>

  <div class="quote">비판의 핵심은 이거였어요. <b>"새로 만든 생산적금융 ISA로 갈아타게 하려고, 일반 ISA를 일부러 불리하게 만드는 것 아니냐"</b>는 거죠</div>
</div>
