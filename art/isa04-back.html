<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #eef1f8;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #26304a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6a7492; margin-bottom: 18px; font-weight: 600; }
  .flow { display: flex; align-items: stretch; gap: 10px; margin-bottom: 14px; }
  .st { flex: 1; background: #fff; border-radius: 13px; padding: 15px 14px; text-align: center; border: 1px solid #dde3f0;

  .res { background: #e8f0e5; border: 1.5px solid #c2d9b8; border-radius: 12px; padding: 13px 18px;
    font-size: 13.8px; color: #3a6b2e; line-height: 1.6; font-weight: 600; }
  .res b { color: #2a5720; }
</style>

<div id="art">
  <h1>개미 반발 → 정부 '하려다 멈춤'</h1>
  <p class="sub">역풍에 원래대로 되돌리는 방안을 검토 중이에요</p>

  <div class="flow">
    <div class="st"><div class="ic">📢</div><div class="t">개편안 발표</div><div class="d">일반 ISA<br/>5년·이월폐지</div></div>
    <div class="arr">→</div>
    <div class="st"><div class="ic">😤</div><div class="t">투자자 반발</div><div class="d">"혜택 축소"<br/>역풍·비판</div></div>
    <div class="arr">→</div>
    <div class="st"><div class="ic">↩️</div><div class="t">정부 재검토</div><div class="d">되돌리는<br/>방안 검토</div></div>
  </div>

  <div class="res"><b>지금은 5년 제한·이월 폐지를 원래 수준으로 되돌리는 쪽</b>으로 가닥이 잡히고 있어요. '절세 악용'되는 부분만 손질하는 방향으로요. 그야말로 '하려다 만' 모양새가 된 거죠</div>
</div>
