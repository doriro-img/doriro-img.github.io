<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #eef1f8;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #26304a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6a7492; margin-bottom: 16px; font-weight: 600; }
  .big { background: #d1483f; border-radius: 13px; padding: 14px 20px; color: #fff; margin-bottom: 13px;
    font-size: 15.5px; font-weight: 800; text-align: center; }
  .list { display: flex; flex-direction: column; gap: 9px; margin-bottom: 13px; }
  .item { background: #fff; border-radius: 12px; padding: 12px 17px; display: flex; align-items: center; gap: 13px;
    box-shadow: 0 4px 11px rgba(40,60,130,.06); border: 1px solid #dde3f0; }
  .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: #2456a8; }
  .tx { font-size: 13.8px; color: #45526e; line-height: 1.45; }
  .tx b { color: #26304a; }
  .warn { background: #fff7e6; border: 1.5px solid #f0dcae; border-radius: 12px; padding: 12px 18px;
    font-size: 12.8px; color: #8a6a2e; line-height: 1.6; font-weight: 600; }
  .warn b { color: #b5822a; }
</style>

<div id="art">
  <h1>그래서 지금 어떻게 되나요?</h1>
  <p class="sub">가장 중요한 건 이거예요</p>

  <div class="big">아직 '확정'된 게 아니에요</div>

  <div class="list">
    <div class="item"><div class="dot"></div><div class="tx">지금은 <b>정부안 단계</b>예요. 앞으로 국회 심의가 남아 있어요</div></div>
    <div class="item"><div class="dot"></div><div class="tx">국회를 거치며 <b>내용이 또 바뀔 수 있어요</b> (되돌려질 수도, 조정될 수도)</div></div>
    <div class="item"><div class="dot"></div><div class="tx">기존 가입자는 <b>성급하게 해지하지 말고</b> 확정 발표를 지켜보는 게 좋아요</div></div>
  </div>

  <div class="warn"><b>이 글은 투자 권유가 아니에요.</b> ISA 제도는 현재 논의·변동 중이라, 최종 확정 내용은 기획재정부·국세청 발표나 금융사 공지에서 꼭 확인하세요. 가입·해지는 본인 판단이에요</div>
</div>
