<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #eef2f8;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #26324a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6a7590; margin-bottom: 18px; font-weight: 600; }
  .list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 13px; }
  .item { background: #fff; border-radius: 13px; padding: 14px 18px; display: flex; align-items: flex-start; gap: 14px;
    box-shadow: 0 5px 13px rgba(40,70,140,.06); border: 1px solid #dde5f0; }
  .em { flex: none; font-size: 24px; }
  .bd .t { font-size: 15px; font-weight: 800; color: #d1483f; }
  .bd .d { font-size: 13px; color: #45526e; line-height: 1.5; margin-top: 2px; font-weight: 600; }
  .bd .d b { color: #26324a; }
  .note { background: #fff; border: 1.5px solid #dde5f0; border-radius: 12px; padding: 13px 18px;
    box-shadow: 0 4px 11px rgba(40,70,140,.05); font-size: 13.5px; color: #37456a; line-height: 1.6; }
  .note b { color: #2c6fb0; }
</style>

<div id="art">
  <h1>이런 전세사기, 조심하세요</h1>
  <p class="sub">요즘은 계약할 땐 멀쩡하다가 나중에 터져요</p>

  <div class="list">
    <div class="item"><div class="em">🏚️</div><div class="bd"><div class="t">깡통전세</div><div class="d">전세보증금이 <b>매매가와 비슷</b>한 집. 전세가율 80%를 넘으면 집값 떨어질 때 보증금 못 받을 위험이 커요</div></div></div>
    <div class="item"><div class="em">📉</div><div class="bd"><div class="t">계약 후 권리 변동</div><div class="d">계약 땐 깨끗했는데 <b>나중에 근저당·압류</b>가 잡히는 경우. 요즘 제일 많은 유형이에요</div></div></div>
  </div>

  <div class="note"><b>등기부등본은 '지금 이 순간'만 보여줘요.</b> 계약 이후에 집주인이 대출을 더 받거나 세금을 체납하면 내 보증금이 위험해질 수 있어요. 그래서 '계약 전'과 '계약 당일' 조치가 둘 다 중요해요</div>
</div>
