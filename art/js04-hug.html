<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #eef2f8;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #26324a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6a7590; margin-bottom: 16px; font-weight: 600; }
  .hero { background: #2c6fb0; border-radius: 15px; padding: 18px 22px; color: #fff; margin-bottom: 13px; }
  .hero .h { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
  .hero .t { font-size: 14px; line-height: 1.6; font-weight: 600; }
  .hero .t b { color: #ffe0a8; }
  .flow { display: flex; align-items: center; gap: 12px; }
  .box { flex: 1; background: #fff; border-radius: 12px; padding: 13px 16px; text-align: center; border: 1px solid #dde5f0;
    box-shadow: 0 4px 11px rgba(40,70,140,.05); }
  .box .l { font-size: 12.5px; color: #6a7590; font-weight: 700; }
  .box .v { font-size: 14px; font-weight: 800; color: #26324a; margin-top: 3px; line-height: 1.4; }
  .arr { font-size: 20px; color: #a8b6d0; font-weight: 800; }
</style>

<div id="art">
  <h1>전세보증보험, 꼭 챙기세요</h1>
  <p class="sub">최악의 상황을 막아주는 마지막 안전망이에요</p>

  <div class="hero">
    <div class="h">전세보증금 반환보증 (HUG 등)</div>
    <div class="t">집주인이 보증금을 안 돌려줘도, <b>보증기관이 대신 돌려줘요.</b> 전세사기·역전세로부터 내 보증금을 지키는 핵심 장치예요</div>
  </div>

  <div class="flow">
    <div class="box"><div class="l">집주인이</div><div class="v">보증금 반환<br/>거부·불능</div></div>
    <div class="arr">→</div>
    <div class="box"><div class="l">보증기관이</div><div class="v">임차인에게<br/>대신 지급</div></div>
    <div class="arr">→</div>
    <div class="box"><div class="l">이후 기관이</div><div class="v">집주인에게<br/>구상권 청구</div></div>
  </div>
</div>
