<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #eef2f8;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #26324a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6a7590; margin-bottom: 16px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-bottom: 13px; }
  .c { background: #fff; border-radius: 13px; padding: 14px 17px; border: 1px solid #dde5f0;
    box-shadow: 0 5px 13px rgba(40,70,140,.06); display: flex; gap: 13px; align-items: center; }
  .em { flex: none; font-size: 23px; }
  .bd .t { font-size: 14.5px; font-weight: 800; color: #2c6fb0; }
  .bd .d { font-size: 12.5px; color: #55617e; line-height: 1.4; margin-top: 2px; font-weight: 600; }
  .warn { background: #fff4e6; border: 1.5px solid #f0d3a0; border-radius: 12px; padding: 13px 18px;
    font-size: 13px; color: #8a5e1e; line-height: 1.6; font-weight: 600; }
  .warn b { color: #b5822a; }
</style>

<div id="art">
  <h1>'안심전세앱' 하나면 편해요</h1>
  <p class="sub">복잡한 확인을 앱 하나로 (HUG 안심전세)</p>

  <div class="grid">
    <div class="c"><div class="em">📊</div><div class="bd"><div class="t">시세 조회</div><div class="d">이 집 전세가가 적정한지 확인</div></div></div>
    <div class="c"><div class="em">⚖️</div><div class="bd"><div class="t">권리 분석</div><div class="d">등기·근저당 등 임차인 권리 체크</div></div></div>
    <div class="c"><div class="em">🔍</div><div class="bd"><div class="t">전세사기 자가진단</div><div class="d">내 계약이 위험한지 스스로 진단</div></div></div>
    <div class="c"><div class="em">🛡️</div><div class="bd"><div class="t">보증 가입</div><div class="d">전세보증보험 신청까지 한 번에</div></div></div>
  </div>

  <div class="warn"><b>이 글은 일반적인 예방 정보예요.</b> 집마다 상황이 달라서, 실제 계약 전엔 등기부·시세·보증 가능 여부를 꼭 확인하고 필요하면 공인중개사·전문가나 HUG(안심전세)에 상담하세요</div>
</div>
