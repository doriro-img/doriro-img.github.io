<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f4f7fb;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #22314f; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #7c869a; margin-bottom: 20px; font-weight: 600; }
  .two { display: flex; gap: 16px; }
  .card { flex: 1; background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 6px 16px rgba(60,90,140,.08); border: 1px solid #e6ecf4; }
  .ct { font-size: 17px; font-weight: 800; margin-bottom: 14px; text-align: center; }
  .card.ktx .ct { color: #0a4da2; } .card.srt .ct { color: #7b3f98; }
  .ch { display: flex; gap: 12px; }
  .chn { flex: 1; background: #f6f8fc; border-radius: 12px; padding: 14px 10px; text-align: center; }
  .chn .ic { height: 44px; display: flex; align-items: center; justify-content: center; }
  .chn .t { font-size: 13px; font-weight: 700; color: #3a4763; margin-top: 6px; }
  .note { margin-top: 16px; background: #fff4e5; border-radius: 12px; padding: 13px 18px; font-size: 13px;
    color: #8a6a2e; line-height: 1.6; text-align: center; border: 1px solid #f3e2c4; }
  .note b { color: #b5822a; }
</style>

<div id="art">
  <h1>어디서, 어떻게 예매하나요?</h1>
  <p class="sub">PC와 모바일 앱 어디서든 할 수 있어요</p>

  <div class="two">
    <div class="card ktx">
      <div class="ct">KTX · 코레일</div>
      <div class="ch">
        <div class="chn"><div class="ic"><svg width="46" height="40" viewBox="0 0 46 40"><rect x="4" y="4" width="38" height="26" rx="3" fill="#0a4da2"/><rect x="8" y="8" width="30" height="18" rx="1.5" fill="#cfe0f5"/><rect x="17" y="32" width="12" height="4" rx="2" fill="#0a4da2"/></svg></div><div class="t">홈페이지</div></div>
        <div class="chn"><div class="ic"><svg width="46" height="40" viewBox="0 0 46 40"><rect x="13" y="3" width="20" height="34" rx="4" fill="#0a4da2"/><rect x="16" y="8" width="14" height="22" rx="1" fill="#cfe0f5"/><circle cx="23" cy="33" r="2" fill="#cfe0f5"/></svg></div><div class="t">코레일톡 앱</div></div>
      </div>
    </div>

    <div class="card srt">
      <div class="ct">SRT · 에스알</div>
      <div class="ch">
        <div class="chn"><div class="ic"><svg width="46" height="40" viewBox="0 0 46 40"><rect x="4" y="4" width="38" height="26" rx="3" fill="#7b3f98"/><rect x="8" y="8" width="30" height="18" rx="1.5" fill="#e4d3ef"/><rect x="17" y="32" width="12" height="4" rx="2" fill="#7b3f98"/></svg></div><div class="t">홈페이지</div></div>
        <div class="chn"><div class="ic"><svg width="46" height="40" viewBox="0 0 46 40"><rect x="13" y="3" width="20" height="34" rx="4" fill="#7b3f98"/><rect x="16" y="8" width="14" height="22" rx="1" fill="#e4d3ef"/><circle cx="23" cy="33" r="2" fill="#e4d3ef"/></svg></div><div class="t">SRT 앱</div></div>
      </div>
    </div>
  </div>

  <div class="note"><b>우선예매도 있어요.</b> 만 65세 이상 어르신·장애인 고객은 일반예매 전에 전화(1800-0242 등)·전용 웹으로 먼저 예매할 수 있어요</div>
</div>
