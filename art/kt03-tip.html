<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f4f7fb;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #22314f; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #7c869a; margin-bottom: 20px; font-weight: 600; }
  .grid { display: flex; gap: 13px; }
  .c { flex: 1; background: #fff; border-radius: 14px; padding: 18px 12px 16px; text-align: center;
    box-shadow: 0 6px 15px rgba(60,90,140,.07); border: 1px solid #e6ecf4; }
  .num { width: 24px; height: 24px; border-radius: 50%; background: #0a4da2; color: #fff; font-size: 13px;
    font-weight: 800; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; }
  .ic { height: 52px; display: flex; align-items: center; justify-content: center; }
  .t { font-size: 14px; font-weight: 800; margin-top: 6px; }
  .d { font-size: 12px; color: #6a7488; line-height: 1.45; margin-top: 4px; }
</style>

<div id="art">
  <h1>예매 성공률 높이는 4가지</h1>
  <p class="sub">순식간에 매진돼요. 오픈 전에 이것만은 챙기세요</p>

  <div class="grid">
    <div class="c">
      <div class="num">1</div>
      <div class="ic"><svg width="50" height="50" viewBox="0 0 50 50"><circle cx="25" cy="26" r="18" fill="#e7eefb" stroke="#0a4da2" stroke-width="3"/><line x1="25" y1="26" x2="25" y2="15" stroke="#0a4da2" stroke-width="3" stroke-linecap="round"/><line x1="25" y1="26" x2="33" y2="30" stroke="#e05a4a" stroke-width="3" stroke-linecap="round"/></svg></div>
      <div class="t">서버시계</div>
      <div class="d">네이비즘 등으로<br />정시에 딱 접속</div>
    </div>
    <div class="c">
      <div class="num">2</div>
      <div class="ic"><svg width="50" height="50" viewBox="0 0 50 50"><g fill="#0a4da2"><rect x="10" y="30" width="7" height="12" rx="2"/><rect x="21" y="24" width="7" height="18" rx="2"/><rect x="32" y="16" width="7" height="26" rx="2"/></g></svg></div>
      <div class="t">5G · 유선랜</div>
      <div class="d">와이파이보다<br />반응이 빨라요</div>
    </div>
    <div class="c">
      <div class="num">3</div>
      <div class="ic"><svg width="50" height="50" viewBox="0 0 50 50"><rect x="7" y="15" width="36" height="22" rx="3" fill="#0a4da2"/><rect x="7" y="21" width="36" height="5" fill="#22314f"/><rect x="12" y="30" width="12" height="3" rx="1.5" fill="#cfe0f5"/></svg></div>
      <div class="t">결제수단 등록</div>
      <div class="d">카드·간편결제<br />미리 넣어두기</div>
    </div>
    <div class="c">
      <div class="num">4</div>
      <div class="ic"><svg width="50" height="50" viewBox="0 0 50 50"><rect x="6" y="12" width="26" height="19" rx="2" fill="#0a4da2"/><rect x="9" y="15" width="20" height="13" rx="1" fill="#cfe0f5"/><rect x="33" y="18" width="12" height="20" rx="3" fill="#7b3f98"/><rect x="35" y="21" width="8" height="12" rx="1" fill="#e4d3ef"/></svg></div>
      <div class="t">기기 미리 결정</div>
      <div class="d">PC로 할지<br />폰으로 할지</div>
    </div>
  </div>
</div>
