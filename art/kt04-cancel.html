<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f4f7fb;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #22314f; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #7c869a; margin-bottom: 18px; font-weight: 600; }
  .hero { background: linear-gradient(135deg,#0a4da2,#1666c8); border-radius: 16px; padding: 20px 24px;
    display: flex; align-items: center; gap: 20px; color: #fff; box-shadow: 0 8px 20px rgba(10,77,162,.22); }
  .hero .ic { flex: none; }
  .hero .htx .ht { font-size: 18px; font-weight: 800; }
  .hero .htx .hd { font-size: 13.5px; color: #d5e3f7; line-height: 1.55; margin-top: 5px; }
  .hero .htx .hd b { color: #fff; }
  .times { margin-top: 16px; background: #fff; border-radius: 14px; padding: 16px 20px; border: 1px solid #e6ecf4; }
  .times .tt { font-size: 14px; font-weight: 800; margin-bottom: 12px; }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 18px; background: #eef3fb; color: #2a4b7c; }
  .chip b { color: #e05a4a; }
  .note { margin-top: 14px; font-size: 12.5px; color: #8a93a6; line-height: 1.6; text-align: center; }
</style>

<div id="art">
  <h1>매진돼도 포기 마세요 — 취소표 공략</h1>
  <p class="sub">'예약대기'를 걸어두는 게 가장 확실한 방법이에요</p>

  <div class="hero">
    <div class="ic"><svg width="60" height="60" viewBox="0 0 60 60">
      <path d="M30,10 a13,13 0 0,1 13,13 v8 l5,8 h-36 l5,-8 v-8 a13,13 0 0,1 13,-13 z" fill="#ffd54a"/>
      <path d="M24,48 a6,6 0 0,0 12,0" fill="#ffd54a"/>
      <circle cx="44" cy="16" r="10" fill="#4ad07a"/><path d="M39,16 l3.5,3.5 6,-7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="htx">
      <div class="ht">코레일톡 '예약대기'를 신청하세요</div>
      <div class="hd">취소표가 나오면 <b>자동으로 좌석이 배정</b>돼요. 직접 새로고침하는 것보다 편하고, 결제수단을 미리 등록해두면 놓칠 일이 줄어요</div>
    </div>
  </div>

  <div class="times">
    <div class="tt">취소표가 잘 나오는 때</div>
    <div class="chips">
      <span class="chip">명절 <b>이틀 전·하루 전·당일</b></span>
      <span class="chip">새벽 <b>3~5시</b></span>
      <span class="chip">출발 <b>3시간 전 · 1시간 전</b></span>
      <span class="chip">결제 마감 직후</span>
    </div>
  </div>

  <p class="note">※ 취소표가 풀리는 시간대는 매년 명절 운영·결제 마감 방식에 따라 달라져요. 규칙처럼 믿지 말고 참고만 하세요</p>
</div>
