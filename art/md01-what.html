<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f2f7f4;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #24352c; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6a8578; margin-bottom: 20px; font-weight: 600; }
  .flow { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px; }
  .box { background: #fff; border-radius: 16px; padding: 20px 16px; text-align: center; box-shadow: 0 6px 15px rgba(40,100,70,.08);
    border: 1px solid #dbe9e1; width: 218px; }
  .box .ic { height: 62px; display: flex; align-items: center; justify-content: center; }
  .box .t { font-size: 15px; font-weight: 800; margin-top: 6px; }
  .box .s { font-size: 12px; color: #6a8578; margin-top: 3px; line-height: 1.4; }
  .a { color: #2e9e6b; font-size: 26px; font-weight: 800; }
  .note { background: #e4efe8; border-radius: 12px; padding: 13px 18px; font-size: 13.5px; color: #35604c;
    line-height: 1.6; text-align: center; }
  .note b { color: #24352c; }
</style>

<div id="art">
  <h1>모듈러 주택이 뭔가요?</h1>
  <p class="sub">공장에서 미리 만들어서 현장에서 조립하는 집이에요</p>

  <div class="flow">
    <div class="box">
      <div class="ic"><svg width="64" height="56" viewBox="0 0 64 56"><rect x="8" y="26" width="48" height="24" fill="#8a99a5"/><path d="M8,26 l12,-8 0,8 12,-8 0,8 12,-8 0,8" fill="#a7b4bd"/><rect x="46" y="12" width="6" height="16" fill="#8a99a5"/><path d="M46,12 q0,-6 6,-6 q6,0 6,6" fill="none" stroke="#8a99a5" stroke-width="0"/><rect x="14" y="34" width="8" height="8" fill="#dfe6ea"/><rect x="28" y="34" width="8" height="8" fill="#dfe6ea"/><rect x="42" y="34" width="8" height="8" fill="#dfe6ea"/></svg></div>
      <div class="t">① 공장에서 제작</div>
      <div class="s">주택의 <b>80% 이상</b>을<br />모듈로 미리 완성</div>
    </div>
    <div class="a">→</div>
    <div class="box">
      <div class="ic"><svg width="70" height="56" viewBox="0 0 70 56"><rect x="4" y="22" width="34" height="20" rx="2" fill="#bd8a52"/><rect x="38" y="28" width="16" height="14" rx="2" fill="#a9743f"/><rect x="8" y="16" width="26" height="8" fill="#d0a875"/><circle cx="16" cy="46" r="6" fill="#3a3a3a"/><circle cx="46" cy="46" r="6" fill="#3a3a3a"/><circle cx="16" cy="46" r="2.5" fill="#8a8a8a"/><circle cx="46" cy="46" r="2.5" fill="#8a8a8a"/></svg></div>
      <div class="t">② 현장으로 운반</div>
      <div class="s">완성된 모듈을<br />트럭으로 이동</div>
    </div>
    <div class="a">→</div>
    <div class="box">
      <div class="ic"><svg width="64" height="56" viewBox="0 0 64 56"><path d="M12,26 L32,10 L52,26 Z" fill="#2e9e6b"/><rect x="16" y="26" width="32" height="24" fill="#42b07d"/><rect x="20" y="30" width="9" height="9" fill="#e4efe8"/><rect x="35" y="30" width="9" height="9" fill="#e4efe8"/><rect x="27" y="42" width="10" height="8" fill="#1f7a50"/></svg></div>
      <div class="t">③ 현장에서 조립</div>
      <div class="s">레고처럼 쌓아서<br /><b>1~2개월 내 완공</b></div>
    </div>
  </div>

  <div class="note">한마디로 <b>'짓는 집'에서 '제조하는 집'</b>으로 바뀐 거예요. 그래서 '집 짓는 가전 시대'라는 말도 나와요</div>
</div>
