<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f2f7f4;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #24352c; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6a8578; margin-bottom: 18px; font-weight: 600; }
  .pp { background: #2c3e50; border-radius: 14px; padding: 16px 22px; text-align: center; margin-bottom: 13px; }
  .pp .l { font-size: 13px; color: #aebccb; font-weight: 700; }
  .pp .v { font-size: 26px; font-weight: 800; color: #fff; margin-top: 2px; }
  .pp .v small { font-size: 15px; font-weight: 700; color: #d6e0ea; }
  .two { display: flex; gap: 13px; margin-bottom: 14px; }
  .c { flex: 1; background: #fff; border-radius: 14px; padding: 16px 18px; text-align: center;
    box-shadow: 0 5px 14px rgba(40,100,70,.07); border: 1px solid #dbe9e1; }
  .c .sz { font-size: 14px; font-weight: 800; color: #6a8578; }
  .c .pr { font-size: 22px; font-weight: 800; color: #2e9e6b; margin-top: 3px; }
  .note { background: #fff4e5; border: 1.5px solid #f0d9b0; border-radius: 12px; padding: 14px 18px; font-size: 13px;
    color: #8a6a2e; line-height: 1.6; }
  .note b { color: #b5822a; }
</style>

<div id="art">
  <h1>가격은 얼마쯤 하나요?</h1>
  <p class="sub">건물 기준 대략이에요. 정확한 건 업체 견적으로 확인하세요</p>

  <div class="pp">
    <div class="l">평당 공사비 (건물)</div>
    <div class="v">약 450 ~ 800<small> 만원</small></div>
  </div>

  <div class="two">
    <div class="c"><div class="sz">20평형</div><div class="pr">약 1억원 전후</div></div>
    <div class="c"><div class="sz">30평형</div><div class="pr">약 1억 5천 내외</div></div>
  </div>

  <div class="note"><b>이건 '건물값'만이에요.</b> 여기에 토지 매입, 기초공사·정화조·전기·수도 연결, 인테리어는 별도예요. 부대비용을 빼먹으면 예산이 훌쩍 넘어가니 꼭 같이 계산하세요</div>
</div>
