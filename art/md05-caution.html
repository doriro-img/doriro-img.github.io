<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f2f7f4;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #24352c; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6a8578; margin-bottom: 20px; font-weight: 600; }
  .list { display: flex; flex-direction: column; gap: 11px; }
  .item { background: #fff; border-radius: 13px; padding: 15px 18px; display: flex; align-items: flex-start; gap: 14px;
    box-shadow: 0 5px 13px rgba(40,100,70,.06); border: 1px solid #dbe9e1; }
  .bx { flex: none; width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; color: #fff; }
  .warn { background: #e0932e; } .ok { background: #2e9e6b; }
  .tx { font-size: 14.5px; line-height: 1.5; color: #375144; padding-top: 1px; }
  .tx b { color: #24352c; }
</style>

<div id="art">
  <h1>사기 전, 이건 알아두세요</h1>
  <p class="sub">장점만 보고 결정하면 안 돼요. 아직 한계도 있어요</p>

  <div class="list">
    <div class="item"><div class="bx warn">!</div><div class="tx">국내에선 아직 <b>인식이 낮아서</b>, 나중에 매매하거나 담보 잡을 때 불리할 수 있어요</div></div>
    <div class="item"><div class="bx warn">!</div><div class="tx">구조 특성상 나중에 <b>확장·변경이 쉽지 않아요.</b> 처음 설계를 잘 잡아야 해요</div></div>
    <div class="item"><div class="bx ok">✓</div><div class="tx"><b>기초공사·인허가는 일반 주택과 똑같아요.</b> '모듈'만 빠른 거지 절차가 사라지는 건 아니에요</div></div>
    <div class="item"><div class="bx warn">!</div><div class="tx"><b>부대비용을 과소평가하면 예산이 초과</b>돼요. 건물값 외에 토지·기초·연결·인테리어를 꼭 같이 잡으세요</div></div>
  </div>
</div>
