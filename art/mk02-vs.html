<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 30px 40px 28px; background: #eef4fb;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #23303f; }
  h1 { font-size: 23px; letter-spacing: -0.6px; }
  .sub { font-size: 13.5px; color: #6b7f95; margin: 4px 0 15px; font-weight: 600; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff;
    border-radius: 14px; overflow: hidden; box-shadow: 0 6px 16px rgba(40,90,150,.08); }
  th { font-size: 14.5px; font-weight: 800; padding: 13px 16px; color: #fff; text-align: left; }
  th.a { background: #7f93a8; } th.b { background: #2f6fb5; }
  th.h { background: #55697e; width: 150px; }
  td { font-size: 13.8px; font-weight: 700; padding: 13px 16px; border-top: 1px solid #e8eef6; color: #3c4d61; line-height: 1.45; }
  td.h { background: #f4f8fc; color: #55697e; font-weight: 800; }
  td.b { background: #f2f8fc; color: #1f5a96; }
  td b { color: #1d7a54; }
  .icons { display: flex; gap: 9px; margin-bottom: 14px; }
  .ic { flex: 1; background: #fff; border-radius: 12px; border: 1px solid #dde7f2; padding: 10px 12px;
    display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 800; color: #55697e; }
  .ic svg { flex: none; }
</style>
<div id="art">

  <div class="icons">
    <div class="ic">
      <svg width="30" height="30" viewBox="0 0 30 30"><rect x="4" y="7" width="22" height="16" rx="3" fill="#9fb9d4"/><rect x="4" y="11" width="22" height="4" fill="#7f93a8"/><rect x="7" y="18" width="8" height="3" rx="1.5" fill="#fff"/></svg>
      기존 K-패스 · 비율 환급
    </div>
    <div class="ic" style="border-color:#bcd6ef; color:#1f5a96;">
      <svg width="30" height="30" viewBox="0 0 30 30"><rect x="4" y="7" width="22" height="16" rx="3" fill="#4a86c4"/><rect x="4" y="11" width="22" height="4" fill="#2f6fb5"/><circle cx="22" cy="19" r="4" fill="#2e9e6b"/><path d="M20.2,19 L21.6,20.4 L24,17.8" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      모두의카드 · 초과분 100%

  </div>
  <table>
    <tr><th class="h">비교 항목</th><th class="a">기존 K-패스</th><th class="b">모두의카드 (2026)</th></tr>
    <tr><td class="h">환급 방식</td><td>쓴 금액의 <b>일정 비율</b> 환급</td><td class="b">기준금액 <b>초과분 100%</b> 환급</td></tr>
    <tr><td class="h">환급 한도</td><td>비율·한도 있음</td><td class="b">초과분은 <b>한도 없이</b> 전액</td></tr>
    <tr><td class="h">이용 조건</td><td>월 15회 이상</td><td class="b">월 15회 이상 (동일)</td></tr>
    <tr><td class="h">누가 유리한가</td><td>교통비를 적게 쓰는 달</td><td class="b">교통비를 <b>많이 쓰는 달</b></td></tr>
    <tr><td class="h">적용 방법</td><td>기존 이용자 그대로</td><td class="b">둘 중 <b>유리한 쪽 자동 적용</b></td></tr>
  </table>
</div>
