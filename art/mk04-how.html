<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 30px 40px 28px; background: #eef4fb;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #23303f; }
  h1 { font-size: 23px; letter-spacing: -0.6px; }
  .sub { font-size: 13.5px; color: #6b7f95; margin: 4px 0 16px; font-weight: 600; }
  .flow { display: flex; align-items: stretch; gap: 8px; }
  .s { flex: 1; background: #fff; border-radius: 15px; border: 1px solid #dde7f2; padding: 16px 15px 15px;
    box-shadow: 0 6px 15px rgba(40,90,150,.07); text-align: center; }
  .s .n { font-size: 11.5px; font-weight: 800; color: #fff; background: #2f6fb5; border-radius: 10px;
    padding: 3px 11px; display: inline-block; }
  .s .ill { height: 76px; display: flex; align-items: center; justify-content: center; margin: 9px 0 6px; }
  .s .t { font-size: 15px; font-weight: 800; color: #23303f; }
  .s .d { font-size: 12.6px; font-weight: 700; color: #7b8ea3; margin-top: 5px; line-height: 1.45; }
  .ar { flex: none; align-self: center; color: #a8bed6; font-size: 22px; font-weight: 800; }
  .warn { margin-top: 14px; background: #fdecea; border: 1px solid #f4c8c2; border-radius: 13px;
    padding: 13px 17px; font-size: 14px; font-weight: 800; color: #c0392b; display: flex; align-items: center; gap: 11px; }
  .warn span { font-weight: 700; color: #8c4b45; font-size: 13.2px; }
</style>
<div id="art">
  <h1>모두의카드 신청, 3단계면 끝나요</h1>
  <p class="sub">새 제도지만 새 카드가 따로 있는 건 아니에요</p>
  <div class="flow">
    <div class="s">
      <div class="n">STEP 1</div>
      <div class="ill">
        <svg width="94" height="66" viewBox="0 0 94 66">
          <rect x="6" y="10" width="70" height="45" rx="7" fill="#4a86c4"/>
          <rect x="6" y="21" width="70" height="9" fill="#2f6fb5"/>
          <rect x="14" y="39" width="24" height="7" rx="3.5" fill="#cfe1f2"/>
          <circle cx="66" cy="44" r="8" fill="#f0c14b"/>
          <rect x="60" y="14" width="14" height="10" rx="2" fill="#f7d98a"/>
        </svg>
      </div>
      <div class="t">전용 카드 발급</div>
      <div class="d">신한·삼성·KB국민·우리·<br />하나·농협 등 제휴 카드사</div>
    </div>
    <div class="ar">›</div>
    <div class="s">
      <div class="n">STEP 2</div>
      <div class="ill">
        <svg width="94" height="66" viewBox="0 0 94 66">
          <rect x="28" y="4" width="40" height="58" rx="7" fill="#33455a"/>
          <rect x="32" y="10" width="32" height="44" rx="3" fill="#eaf2fa"/>
          <circle cx="48" cy="26" r="8" fill="#4a86c4"/>
          <path d="M40,44 a8,8 0 0 1 16,0 Z" fill="#4a86c4"/>
          <rect x="43" y="57" width="10" height="2.6" rx="1.3" fill="#7b8ea3"/>
        </svg>
      </div>
      <div class="t">K-패스 가입</div>
      <div class="d">앱 또는 누리집에서<br />회원가입 · 본인인증</div>
    </div>
    <div class="ar">›</div>
    <div class="s">
      <div class="n">STEP 3</div>
      <div class="ill">
        <svg width="94" height="66" viewBox="0 0 94 66">
          <rect x="10" y="14" width="56" height="38" rx="6" fill="#cfe1f2"/>
          <rect x="10" y="14" width="56" height="10" rx="6" fill="#9fb9d4"/>
          <rect x="18" y="32" width="30" height="6" rx="3" fill="#fff"/>
          <circle cx="70" cy="44" r="17" fill="#2e9e6b"/>
          <path d="M62,44 L68,50 L79,38" stroke="#fff" stroke-width="4.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="t">카드 등록</div>
      <div class="d">발급받은 카드를<br />K-패스에 등록 · 동의</div>
    </div>
  </div>
  <div class="warn">카드 등록을 안 하면 환급 대상에서 빠집니다<span>· 카드만 만들고 등록을 잊는 경우가 제일 많아요</span></div>
</div>
