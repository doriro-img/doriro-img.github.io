<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 30px 40px 26px; background: #edf4f9;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1e3346; }
  h1 { font-size: 23px; letter-spacing: -0.6px; }
  .sub { font-size: 13.5px; color: #6b8497; margin: 4px 0 15px; font-weight: 600; }
  .g { display: flex; gap: 11px; }
  .c { flex: 1; background: #fff; border-radius: 15px; border: 1px solid #d8e6ef; padding: 16px 16px 18px;
    box-shadow: 0 6px 15px rgba(30,80,120,.07); text-align: center; }
  .c .ill { height: 92px; display: flex; align-items: center; justify-content: center; }
  .c .t { font-size: 16px; font-weight: 800; color: #1f6f9c; margin-top: 4px; }
  .c .d { font-size: 12.8px; font-weight: 700; color: #6b8497; margin-top: 5px; line-height: 1.45; }
  .c.red .t { color: #c0392b; }
  .when { margin-top: 13px; background: #1f6f9c; border-radius: 13px; padding: 12px 18px; color: #fff;
    font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 12px; }
  .when span { font-weight: 700; font-size: 13px; color: #cfe4f1; }
</style>
<div id="art">
  <h1>2026년 4월 20일부터 이렇게 바뀌었어요</h1>
  <p class="sub">국제 기준이라 국내선·국제선, 어느 항공사든 똑같이 적용돼요</p>
  <div class="g">
    <div class="c">
      <div class="ill">
        <svg width="118" height="74" viewBox="0 0 118 74">
          <rect x="10" y="18" width="42" height="40" rx="6" fill="#4a9bc9"/>
          <rect x="16" y="26" width="30" height="10" rx="3" fill="#fff" opacity=".85"/>
          <rect x="16" y="42" width="18" height="7" rx="3" fill="#fff" opacity=".55"/>
          <rect x="62" y="18" width="42" height="40" rx="6" fill="#4a9bc9"/>
          <rect x="68" y="26" width="30" height="10" rx="3" fill="#fff" opacity=".85"/>
          <rect x="68" y="42" width="18" height="7" rx="3" fill="#fff" opacity=".55"/>
          <text x="59" y="14" text-anchor="middle" font-size="13" font-weight="800" fill="#1f6f9c">2</text>
        </svg>
      </div>
      <div class="t">1인당 2개까지</div>
      <div class="d">예전엔 작은 용량은 개수 제한이<br />거의 없었는데 이제 <b>2개</b>예요</div>
    </div>
    <div class="c">
      <div class="ill">
        <svg width="118" height="82" viewBox="0 0 118 82">
          <rect x="18" y="20" width="66" height="44" rx="7" fill="#e3eef6" stroke="#4a9bc9" stroke-width="3"/>
          <rect x="84" y="34" width="9" height="16" rx="3" fill="#4a9bc9"/>
          <rect x="25" y="27" width="16" height="30" rx="3" fill="#2e9e6b"/>
          <rect x="44" y="27" width="16" height="30" rx="3" fill="#2e9e6b"/>
          <rect x="63" y="27" width="14" height="30" rx="3" fill="#e0a92f"/>
          <text x="51" y="78" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1f6f9c">160Wh</text>
        </svg>
      </div>
      <div class="t">160Wh 이하만</div>
      <div class="d">약 43,000mAh 이하예요.<br />넘으면 아예 못 들고 타요</div>
    </div>
    <div class="c red">
      <div class="ill">
        <svg width="118" height="82" viewBox="0 0 118 82">
          <rect x="14" y="26" width="44" height="30" rx="6" fill="#c9d9e4"/>
          <rect x="58" y="36" width="7" height="10" rx="3" fill="#c9d9e4"/>
          <rect x="72" y="20" width="30" height="46" rx="5" fill="#8fa9bd"/>
          <rect x="76" y="26" width="22" height="32" rx="2" fill="#e3eef6"/>
          <path d="M60,41 h14" stroke="#8fa9bd" stroke-width="3"/>
          <circle cx="58" cy="41" r="26" fill="none" stroke="#e05c50" stroke-width="6"/>
          <path d="M40,23 L76,59" stroke="#e05c50" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="t">기내 사용·충전 금지</div>
      <div class="d">보조배터리 충전도, 그걸로<br />폰 충전하는 것도 <b>전부 금지</b></div>
    </div>
  </div>
  <div class="when">비행기 안에서는 그냥 '가지고만' 있어야 합니다<span>· 충전이 필요하면 좌석 USB나 콘센트를 쓰세요</span></div>
</div>
