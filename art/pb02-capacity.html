<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 30px 40px 28px; background: #edf4f9;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1e3346; }
  h1 { font-size: 23px; letter-spacing: -0.6px; }
  .sub { font-size: 13.5px; color: #6b8497; margin: 4px 0 16px; font-weight: 600; }
  .bar { display: flex; height: 46px; border-radius: 12px; overflow: hidden; margin-bottom: 13px;
    box-shadow: 0 5px 13px rgba(30,80,120,.09); }
  .bar div { display: flex; align-items: center; justify-content: center; color: #fff;
    font-size: 14px; font-weight: 800; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff;
    border-radius: 14px; overflow: hidden; box-shadow: 0 6px 16px rgba(30,80,120,.08); }
  th { font-size: 13.6px; font-weight: 800; padding: 12px 16px; color: #fff; background: #4a6b83; text-align: left; }
  td { font-size: 13.8px; font-weight: 700; padding: 13px 16px; border-top: 1px solid #e7eff5; color: #3c5568; }
  td.c1 { font-weight: 800; color: #1e3346; width: 210px; }
  td.ok { color: #1d7a54; font-weight: 800; }
  td.mid { color: #b5701a; font-weight: 800; }
  td.no { color: #c0392b; font-weight: 800; }
  tr.g td { background: #f3faf6; } tr.y td { background: #fdf7ec; } tr.r td { background: #fdf0ee; }
</style>
<div id="art">
  <h1>내 보조배터리는 되나요? 용량으로 갈려요</h1>
  <p class="sub">Wh(와트시) 기준이에요. 제품 뒷면이나 밑면에 적혀 있어요</p>
  <div class="bar">
    <div style="flex:100; background:#2e9e6b;">100Wh 이하 · 약 27,000mAh</div>
    <div style="flex:60; background:#e0a92f;">100 ~ 160Wh</div>
    <div style="flex:52; background:#c0392b;">160Wh 초과</div>
  </div>
  <table>
    <tr><th>용량</th><th>기내 반입</th><th>알아둘 것</th></tr>
    <tr class="g"><td class="c1">100Wh 이하<br /><span style="font-weight:700;color:#7b95a8;font-size:12.4px">대부분의 시중 제품</span></td><td class="ok">가능 (최대 2개)</td><td>10,000 · 20,000mAh 제품은 여기 들어가요</td></tr>
    <tr class="y"><td class="c1">100Wh 초과 ~ 160Wh 이하</td><td class="mid">항공사 승인 후 2개</td><td>노트북용 대용량. 미리 항공사에 확인해야 해요</td></tr>
    <tr class="r"><td class="c1">160Wh 초과<br /><span style="font-weight:700;color:#7b95a8;font-size:12.4px">캠핑용 파워뱅크 등</span></td><td class="no">반입 불가</td><td>기내도 위탁수하물도 안 됩니다</td></tr>
  </table>
</div>
