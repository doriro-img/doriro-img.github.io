<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #fdf5ee;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #3a2d26; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #8a7566; margin-bottom: 18px; font-weight: 600; }
  .two { display: flex; gap: 13px; margin-bottom: 14px; }
  .c { flex: 1; background: #fff; border-radius: 15px; padding: 18px 20px; text-align: center;
    box-shadow: 0 6px 15px rgba(150,90,50,.08); border: 1px solid #f0e2d5; }
  .c .l { font-size: 13px; font-weight: 800; color: #8a7566; margin-bottom: 6px; }
  .c .big { font-size: 40px; font-weight: 800; line-height: 1; }
  .kr .big { color: #ee7a55; } .ov .big { color: #2fa39a; }
  .c .cap { font-size: 12.5px; color: #8a7566; margin-top: 7px; font-weight: 600; }
  .box { background: #fff; border: 1.5px solid #f0e2d5; border-radius: 14px; padding: 15px 20px;
    box-shadow: 0 5px 13px rgba(150,90,50,.05); }
  .box .h { font-size: 14.5px; font-weight: 800; color: #d85f3c; margin-bottom: 5px; }
  .box .t { font-size: 13.5px; line-height: 1.6; color: #5a4a40; }
  .box .t b { color: #3a2d26; }
</style>

<div id="art">
  <h1>펫보험, 왜 다들 고민할까요?</h1>
  <p class="sub">병원비는 비싼데 아직 든 사람은 적어요</p>

  <div class="two">
    <div class="c kr">
      <div class="l">한국 반려견 보험 가입률</div>
      <div class="big">1.4<span style="font-size:22px">%</span></div>
      <div class="cap">아직 100마리 중 1~2마리뿐</div>
    </div>
    <div class="c ov">
      <div class="l">미국 · 영국</div>
      <div class="big">25<span style="font-size:22px">%</span></div>
      <div class="cap">4마리 중 1마리꼴</div>
    </div>
  </div>

  <div class="box">
    <div class="h">2026년, 병원비가 투명해지고 있어요</div>
    <div class="t">올해부터 <b>모든 동물병원이 진찰료·검사비 같은 주요 진료비를 의무 공개</b>해요. 병원마다 값을 비교할 수 있게 됐고, 진료비가 표준화될수록 보험료도 안정될 거란 전망이에요</div>
  </div>
</div>
