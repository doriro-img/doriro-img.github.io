<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #fdf5ee;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #3a2d26; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #8a7566; margin-bottom: 16px; font-weight: 600; }
  .hero { background: #ee7a55; border-radius: 15px; padding: 16px 22px; color: #fff; text-align: center; margin-bottom: 14px; }
  .hero .l { font-size: 13px; font-weight: 700; opacity: .92; }
  .hero .v { font-size: 30px; font-weight: 800; margin-top: 2px; }
  .hero .v small { font-size: 16px; font-weight: 700; }
  .rows { display: flex; flex-direction: column; gap: 9px; margin-bottom: 13px; }
  .r { background: #fff; border-radius: 11px; padding: 11px 16px; display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 4px 11px rgba(150,90,50,.06); border: 1px solid #f0e2d5; }
  .r .nm { font-size: 14px; font-weight: 700; color: #4a3a30; }
  .r .pr { font-size: 15px; font-weight: 800; color: #d85f3c; }
  .note { background: #fbeee0; border: 1.5px solid #f0d3a8; border-radius: 12px; padding: 12px 18px;
    font-size: 12.8px; color: #9a5a1e; line-height: 1.6; }
  .note b { color: #b5822a; }
</style>

<div id="art">
  <h1>한 달에 얼마나 드나요?</h1>
  <p class="sub">말티즈 1살·70% 보장 기준 예시예요 (2026년 중순)</p>

  <div class="hero">
    <div class="l">대략 월</div>
    <div class="v">3만 ~ 4만원<small> 대</small></div>
  </div>

  <div class="rows">
    <div class="r"><div class="nm">A사 예시</div><div class="pr">약 33,500원</div></div>
    <div class="r"><div class="nm">B사 예시</div><div class="pr">약 39,700원</div></div>
    <div class="r"><div class="nm">C사 예시</div><div class="pr">약 40,000원</div></div>
  </div>

  <div class="note"><b>순위나 추천이 아니라 '감 잡는 예시'예요.</b> 견종·나이·성별·보장비율에 따라 크게 달라지고, 나이 많거나 유전병 잦은 견종은 더 비싸거나 가입이 안 될 수도 있어요. 실제 금액은 꼭 개별 견적으로 확인하세요</div>
</div>
