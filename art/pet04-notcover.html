<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #fdf5ee;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #3a2d26; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #8a7566; margin-bottom: 18px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-bottom: 14px; }
  .x { background: #fff; border-radius: 12px; padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px;
    box-shadow: 0 5px 13px rgba(150,90,50,.06); border: 1px solid #f0e2d5; }
  .xm { flex: none; width: 25px; height: 25px; border-radius: 7px; background: #e05a4a; color: #fff;
    font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .xt { font-size: 13.5px; line-height: 1.45; color: #4a3a30; padding-top: 2px; }
  .xt b { color: #3a2d26; }
  .flag { background: #fff3ec; border: 1.5px solid #f3c3ac; border-radius: 13px; padding: 15px 20px;
    display: flex; align-items: center; gap: 14px; }
  .flag .em { flex: none; font-size: 30px; }
  .flag .ft { font-size: 13.8px; line-height: 1.6; color: #b04a2e; font-weight: 600; }
  .flag .ft b { color: #8a2f1a; }
</style>

<div id="art">
  <h1>이건 보장 안 돼요 (제일 중요)</h1>
  <p class="sub">여기서 대부분 실망해요. 가입 전에 꼭 확인</p>

  <div class="grid">
    <div class="x"><div class="xm">✕</div><div class="xt"><b>가입 전 이미 아픈 병</b><br/>(기왕증은 보장 제외)</div></div>
    <div class="x"><div class="xm">✕</div><div class="xt"><b>유전·선천 질환</b><br/>(품종 특유의 병 주의)</div></div>
    <div class="x"><div class="xm">✕</div><div class="xt"><b>예방접종·중성화·미용</b><br/>(건강할 때 하는 것)</div></div>
    <div class="x"><div class="xm">✕</div><div class="xt"><b>임신·출산 관련</b><br/>비급여 항목 등</div></div>
  </div>

  <div class="flag">
    <div class="em">🐶</div>
    <div class="ft"><b>심장병·슬개골처럼 잘 걸리는 견종이라면 더 꼼꼼히!</b> 유전질환은 아예 빠지거나 특약이 따로예요. 우리 애 약점이 보장되는지 약관에서 꼭 확인하세요</div>
  </div>
</div>
