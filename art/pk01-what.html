<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #edf7f1;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #22332c; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6a8073; margin-bottom: 18px; font-weight: 600; }
  .three { display: flex; gap: 12px; margin-bottom: 14px; }
  .c { flex: 1; background: #fff; border-radius: 14px; padding: 17px 15px; text-align: center;
    box-shadow: 0 5px 13px rgba(30,140,90,.08); border: 1px solid #d9ece2; }
  .c .em { font-size: 26px; }
  .c .t { font-size: 14px; font-weight: 800; color: #178a60; margin: 7px 0 4px; }
  .c .d { font-size: 12.5px; color: #5a6d62; line-height: 1.45; font-weight: 600; }
  .note { background: #fff; border: 1.5px solid #d9ece2; border-radius: 12px; padding: 14px 18px;
    box-shadow: 0 4px 11px rgba(30,140,90,.05); font-size: 13.8px; color: #37473f; line-height: 1.6; }
  .note b { color: #d69410; }
</style>

<div id="art">
  <h1>파킹통장이 뭔가요?</h1>
  <p class="sub">돈을 잠깐 '주차(parking)'해두는 통장이에요</p>

  <div class="three">
    <div class="c"><div class="em">🅿️</div><div class="t">하루만 넣어도 이자</div><div class="d">예적금처럼 안 묶이고<br/>맡긴 만큼 이자가 붙어요</div></div>
    <div class="c"><div class="em">🔄</div><div class="t">입출금 자유</div><div class="d">언제든 넣고 뺄 수 있어<br/>급할 때도 문제없어요</div></div>
    <div class="c"><div class="em">💵</div><div class="t">비상금에 딱</div><div class="d">그냥 통장에 두긴 아까운<br/>목돈을 잠깐 보관</div></div>
  </div>

  <div class="note">일반 입출금통장은 이자가 거의 없잖아요(0.1% 수준). 파킹통장은 <b>자유롭게 쓰면서도 연 3% 안팎의 이자</b>를 주는 게 핵심이에요. 잠자는 돈을 깨우는 거죠</div>
</div>
