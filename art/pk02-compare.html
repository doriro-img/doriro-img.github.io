<div id="art">
  <h1>일반통장 vs 파킹통장 vs 예적금</h1>
  <p class="sub">'묶이는 정도'와 '이자'가 달라요</p>

  <table>
    <tr><th>구분</th><th>일반 통장</th><th>파킹통장</th><th>예·적금</th></tr>
    <tr><td>입출금</td><td><b>자유</b></td><td><b>자유</b></td><td class="muted">묶임 (만기)</td></tr>
    <tr class="hl"><td>이자(대략)</td><td class="muted">거의 0%</td><td class="gold">연 3% 안팎</td><td><b>더 높음</b></td></tr>
    <tr><td>어울리는 돈</td><td class="muted">생활비</td><td>비상금·대기자금</td><td>안 쓸 목돈</td></tr>
  </table>

  <p style="margin-top:13px;font-size:13px;color:#6a8073;font-weight:600;line-height:1.6;">→ 파킹통장은 <b style="color:#178a60;">'자유로움'은 통장, '이자'는 예금에 가까운</b> 중간 지점이에요. 당장 쓸 건 아닌데 묶어두긴 애매한 돈에 딱이에요</p>
