<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 30px 40px 26px; background: #f2f2fb;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2a2a44; }
  h1 { font-size: 23px; letter-spacing: -0.6px; }
  .sub { font-size: 13.5px; color: #7a79a0; margin: 4px 0 15px; font-weight: 600; }
  .row { display: flex; gap: 13px; }
  .c { background: #fff; border-radius: 15px; border: 1px solid #e2e1f3; padding: 15px 17px 16px;
    box-shadow: 0 6px 15px rgba(70,70,150,.07); }
  .c .t { font-size: 14.5px; font-weight: 800; color: #4b52a8; margin-bottom: 9px; }
  .d { font-size: 13px; font-weight: 700; color: #6f6e93; line-height: 1.5; margin-top: 9px; }
  .d b { color: #2a2a44; }
</style>
<div id="art">
  <h1>스테이블코인이 뭔데요?</h1>
  <p class="sub">값이 출렁이지 않게 '1코인 = 1,000원'으로 묶어둔 코인이에요</p>
  <div class="row">
    <div class="c" style="flex:1.15">
      <div class="t">가격이 안 흔들려요</div>
      <svg width="360" height="140" viewBox="0 0 360 140">
        <line x1="10" y1="118" x2="350" y2="118" stroke="#e2e1f3" stroke-width="2"/>
        <path d="M14,96 C50,30 70,110 100,52 C130,8 160,104 190,44 C220,96 250,20 280,74 C310,100 330,48 348,66"
              fill="none" stroke="#d99a2b" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M14,86 L348,86" stroke="#4b52a8" stroke-width="4.2" stroke-linecap="round"/>
        <circle cx="348" cy="86" r="6" fill="#4b52a8"/>
        <text x="16" y="24" font-size="12.6" font-weight="800" fill="#c9761d">일반 코인 (등락 큼)</text>
        <text x="16" y="132" font-size="12.6" font-weight="800" fill="#4b52a8">스테이블코인 (1,000원 고정)</text>
      </svg>
    </div>
    <div class="c" style="flex:1">
      <div class="t">뒤에 '진짜 돈'을 쌓아둬요</div>
      <div style="display:flex; align-items:center; gap:14px; margin-top:4px;">
        <svg width="92" height="92" viewBox="0 0 92 92">
          <circle cx="46" cy="46" r="34" fill="#f0c14b"/>
          <circle cx="46" cy="46" r="26" fill="#e0a92f"/>
          <text x="46" y="60" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">₩</text>
        </svg>
        <div style="font-size:26px; color:#a9a8c8; font-weight:800;">=</div>
        <svg width="104" height="92" viewBox="0 0 104 92">
          <rect x="8" y="16" width="88" height="62" rx="8" fill="#4b52a8"/>
          <rect x="16" y="24" width="72" height="46" rx="5" fill="#e9e9f7"/>
          <circle cx="52" cy="47" r="13" fill="#9b9ad2"/>
          <circle cx="52" cy="47" r="5" fill="#fff"/>
          <rect x="70" y="43" width="12" height="8" rx="2" fill="#c3c2e6"/>
        </svg>
      </div>
      <div class="d">발행한 만큼 <b>현금성 자산 100% 이상</b>을 따로 보관하게 하는 게 법안의 뼈대예요</div>
    </div>
  </div>
</div>
