<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 30px 40px 30px; background: #f2f2fb;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2a2a44; }
  h1 { font-size: 23px; letter-spacing: -0.6px; }
  .sub { font-size: 13.5px; color: #7a79a0; margin: 4px 0 22px; font-weight: 600; }
  .line { position: relative; height: 168px; }
  .rail { position: absolute; left: 20px; right: 20px; top: 40px; height: 8px; border-radius: 4px;
    background: linear-gradient(90deg,#4b52a8 0%,#7b7fd0 55%,#d8d7ee 100%); }
  .n { position: absolute; top: 26px; width: 36px; height: 36px; border-radius: 50%; background: #fff;
    border: 5px solid #4b52a8; }
  .n.q { border-color: #b9b8e0; border-style: dashed; }
  .b { position: absolute; top: 84px; width: 210px; background: #fff; border-radius: 13px;
    border: 1px solid #e2e1f3; padding: 12px 14px; box-shadow: 0 5px 13px rgba(70,70,150,.07); }
  .b .k { font-size: 12.4px; font-weight: 800; color: #8b8ac0; }
  .b .t { font-size: 14.6px; font-weight: 800; color: #2a2a44; margin-top: 3px; }
  .b .x { font-size: 12.6px; font-weight: 700; color: #7a79a0; margin-top: 5px; line-height: 1.45; }
  .b.now { border-color: #4b52a8; background: #eeeefb; }
  .b.now .t { color: #4b52a8; }
</style>
<div id="art">
  <h1>지금 어디까지 온 건가요?</h1>
  <p class="sub">1단계는 이미 시행 중이고, 스테이블코인은 2단계에 담겨요</p>
  <div class="line">
    <div class="rail"></div>
    <div class="n" style="left:24px"></div>
    <div class="n" style="left:300px"></div>
    <div class="n q" style="left:576px"></div>
    <div class="b" style="left:10px">
      <div class="k">1단계 · 시행 완료</div>
      <div class="t">이용자 보호법</div>
      <div class="x">거래소 이용자 자산 보호, 불공정거래 처벌부터 먼저 시작했어요</div>
    </div>
    <div class="b now" style="left:286px">
      <div class="k">2단계 · 2026년 하반기</div>
      <div class="t">디지털자산기본법</div>
      <div class="x">원화 스테이블코인을 제도권으로. 정부안 국회 제출을 추진 중이에요</div>
    </div>
    <div class="b" style="left:562px">
      <div class="k">그다음 · 시점 미정</div>
      <div class="t">실제 발행·유통</div>
      <div class="x">법이 통과돼도 인가와 시행령이 남아서 바로 쓰이진 않아요</div>
    </div>
  </div>
</div>
