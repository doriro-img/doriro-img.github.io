<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 30px 40px 28px; background: #f2f2fb;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2a2a44; }
  h1 { font-size: 23px; letter-spacing: -0.6px; }
  .sub { font-size: 13.5px; color: #7a79a0; margin: 4px 0 15px; font-weight: 600; }
  .g { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  .c { background: #fff; border-radius: 14px; border: 1px solid #e2e1f3; padding: 15px 17px;
    box-shadow: 0 5px 14px rgba(70,70,150,.07); display: flex; gap: 14px; align-items: center; }
  .c svg { flex: none; }
  .t { font-size: 15px; font-weight: 800; color: #4b52a8; }
  .d { font-size: 12.9px; font-weight: 700; color: #6f6e93; margin-top: 4px; line-height: 1.45; }
  .d b { color: #2a2a44; }
  .foot { margin-top: 13px; background: #eeeefb; border-radius: 12px; padding: 12px 16px;
    font-size: 13.3px; font-weight: 700; color: #4b52a8; }
</style>
<div id="art">
  <h1>법안에 담길 핵심 4가지</h1>
  <p class="sub">아무나 찍어내지 못하게 하고, 언제든 원화로 바꿔주게 하는 게 골자예요</p>
  <div class="g">
    <div class="c">
      <svg width="56" height="56" viewBox="0 0 56 56">
        <rect x="8" y="14" width="40" height="32" rx="5" fill="#e0dffa"/>
        <path d="M14,14 L14,10 A14,14 0 0 1 42,10 L42,14" fill="none" stroke="#4b52a8" stroke-width="5"/>
        <circle cx="28" cy="30" r="6" fill="#4b52a8"/>
      </svg>
      <div><div class="t">발행 인가제</div><div class="d">금융당국 <b>인가받은 곳만</b> 발행. 해외에서 찍은 원화 코인도 대상</div></div>
    </div>
    <div class="c">
      <svg width="56" height="56" viewBox="0 0 56 56">
        <rect x="6" y="30" width="12" height="18" rx="2" fill="#c3c2e6"/>
        <rect x="22" y="20" width="12" height="28" rx="2" fill="#8b8ad4"/>
        <rect x="38" y="8" width="12" height="40" rx="2" fill="#4b52a8"/>
        <text x="44" y="6" text-anchor="middle" font-size="11" font-weight="800" fill="#4b52a8">100%</text>
      </svg>
      <div><div class="t">준비자산 100% 이상</div><div class="d">발행액만큼 <b>현금성 자산</b>을 쌓아두게 해요</div></div>
    </div>
    <div class="c">
      <svg width="56" height="56" viewBox="0 0 56 56">
        <circle cx="28" cy="28" r="21" fill="#e0dffa"/>
        <path d="M38,20 a14,14 0 1 0 3,12" fill="none" stroke="#4b52a8" stroke-width="4.6" stroke-linecap="round"/>
        <path d="M30,14 L40,20 L30,26 Z" fill="#4b52a8"/>
        <text x="28" y="34" text-anchor="middle" font-size="15" font-weight="800" fill="#4b52a8">₩</text>
      </svg>
      <div><div class="t">상환청구권</div><div class="d">들고 있는 코인을 <b>원화로 되돌려 달라</b>고 요구할 권리</div></div>
    </div>
    <div class="c">
      <svg width="56" height="56" viewBox="0 0 56 56">
        <rect x="10" y="8" width="36" height="42" rx="5" fill="#fff" stroke="#4b52a8" stroke-width="3"/>
        <rect x="17" y="17" width="22" height="4" rx="2" fill="#8b8ad4"/>
        <rect x="17" y="26" width="22" height="4" rx="2" fill="#c3c2e6"/>
        <rect x="17" y="35" width="14" height="4" rx="2" fill="#c3c2e6"/>
        <circle cx="42" cy="42" r="11" fill="#2e9e6b"/>
        <path d="M37,42 L41,46 L48,38" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div><div class="t">공시 의무</div><div class="d">준비자산을 <b>어디에 얼마나</b> 두고 있는지 공개</div></div>
    </div>
  </div>
  <div class="foot">전부 '논의 중인 정부안·발의안' 내용이에요. 국회를 거치면서 바뀔 수 있습니다</div>
</div>
