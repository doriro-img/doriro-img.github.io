<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 30px 40px 28px; background: #f2f2fb;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2a2a44; }
  h1 { font-size: 23px; letter-spacing: -0.6px; }
  .sub { font-size: 13.5px; color: #7a79a0; margin: 4px 0 16px; font-weight: 600; }
  .tug { display: flex; align-items: center; gap: 0; }
  .side { flex: 1; background: #fff; border-radius: 15px; border: 1px solid #e2e1f3; padding: 16px 18px;
    box-shadow: 0 6px 15px rgba(70,70,150,.07); }
  .side .k { font-size: 12.6px; font-weight: 800; color: #fff; border-radius: 9px; padding: 3px 11px; display: inline-block; }
  .side .t { font-size: 16px; font-weight: 800; margin-top: 9px; }
  .side .d { font-size: 13px; font-weight: 700; color: #6f6e93; margin-top: 6px; line-height: 1.5; }
  .mid { flex: none; width: 118px; text-align: center; }
  .a .k { background: #4b52a8; } .a .t { color: #4b52a8; }
  .b .k { background: #d99a2b; } .b .t { color: #c9761d; }
  .note { margin-top: 14px; background: #fdecea; border: 1px solid #f4c8c2; border-radius: 13px;
    padding: 13px 17px; font-size: 13.6px; font-weight: 800; color: #c0392b; }
</style>
<div id="art">
  <h1>아직 안 정해진 것 — 누가 발행하나</h1>
  <p class="sub">이 줄다리기 때문에 법안이 상반기에 한 번 멈췄어요</p>
  <div class="tug">
    <div class="side a">
      <div class="k">한국은행 쪽</div>
      <div class="t">은행 중심 컨소시엄</div>
      <div class="d">은행이 지분 50%+1주를 갖는 구조로 가자는 안이에요. 통화·결제 안정성이 이유예요</div>
    </div>
    <div class="mid">
      <svg width="110" height="86" viewBox="0 0 110 86">
        <line x1="8" y1="43" x2="102" y2="43" stroke="#c3c2e6" stroke-width="6" stroke-linecap="round"/>
        <circle cx="55" cy="43" r="15" fill="#fff" stroke="#a9a8c8" stroke-width="3"/>
        <text x="55" y="49" text-anchor="middle" font-size="16" font-weight="800" fill="#7a79a0">?</text>
        <path d="M30,20 L14,43 L30,66" fill="none" stroke="#4b52a8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M80,20 L96,43 L80,66" fill="none" stroke="#d99a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="side b">
      <div class="k">업계 · 여당 일부</div>
      <div class="t">비은행도 참여</div>
      <div class="d">핀테크·플랫폼도 발행에 참여해야 경쟁이 생긴다는 반대 의견이에요</div>
    </div>
  </div>
  <div class="note">발행 주체·지분 구조는 2026년 8월 현재도 확정 전입니다. 뉴스에 나오는 '곧 나온다'는 계획이지 결정이 아니에요</div>
</div>
