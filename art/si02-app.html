<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f2f7f7;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1f3a3a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6e8585; margin-bottom: 22px; font-weight: 600; }
  .steps { display: flex; align-items: stretch; gap: 8px; }
  .step { flex: 1; background: #fff; border-radius: 16px; padding: 20px 16px 18px; text-align: center;
    box-shadow: 0 6px 16px rgba(40,90,90,.08); border: 1px solid #dcece9; }
  .n { width: 30px; height: 30px; border-radius: 50%; background: #0d9488; color: #fff; font-size: 15px;
    font-weight: 800; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
  .ic { height: 62px; display: flex; align-items: center; justify-content: center; }
  .t { font-size: 15.5px; font-weight: 800; margin-top: 8px; }
  .d { font-size: 12.5px; color: #5f7d7b; line-height: 1.5; margin-top: 5px; }
  .ar { flex: none; display: flex; align-items: center; color: #9bc9c3; font-size: 22px; font-weight: 800; }
  .note { margin-top: 16px; background: #e3f0ef; border-radius: 12px; padding: 13px 18px; font-size: 13px;
    color: #3f5f5d; line-height: 1.6; text-align: center; }
  .note b { color: #0d8074; }
</style>

<div id="art">
  <h1>실손24 앱, 3단계면 끝나요</h1>
  <p class="sub">챙길 서류 하나도 없어요. 앱 안에서 다 돼요</p>

  <div class="steps">
    <div class="step">
      <div class="n">1</div>
      <div class="ic"><svg width="54" height="56" viewBox="0 0 54 56"><rect x="15" y="4" width="24" height="42" rx="5" fill="#0d9488"/><rect x="19" y="9" width="16" height="28" rx="2" fill="#e6f6f3"/><path d="M27,16 v11 M23,23 l4,4 4,-4" stroke="#0d9488" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="27" cy="41" r="2" fill="#e6f6f3"/></svg></div>
      <div class="t">앱 설치</div>
      <div class="d">'실손24' 검색<br />(보험개발원 공식)</div>
    </div>
    <div class="ar">→</div>
    <div class="step">
      <div class="n">2</div>
      <div class="ic"><svg width="54" height="56" viewBox="0 0 54 56"><rect x="8" y="8" width="38" height="40" rx="4" fill="#fff" stroke="#0d9488" stroke-width="2"/><g><rect x="14" y="16" width="7" height="7" rx="1.5" fill="#0d9488"/><path d="M15.5,19.5 l1.5,1.5 2.5,-3" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="25" y1="19" x2="40" y2="19" stroke="#b7d8d3" stroke-width="3" stroke-linecap="round"/></g><g><rect x="14" y="27" width="7" height="7" rx="1.5" fill="#0d9488"/><path d="M15.5,30.5 l1.5,1.5 2.5,-3" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="25" y1="30" x2="40" y2="30" stroke="#b7d8d3" stroke-width="3" stroke-linecap="round"/></g><g><rect x="14" y="38" width="7" height="7" rx="1.5" fill="#cfe6e2"/><line x1="25" y1="41" x2="36" y2="41" stroke="#dcece9" stroke-width="3" stroke-linecap="round"/></g></svg></div>
      <div class="t">진료내역 선택</div>
      <div class="d">병원·약국 방문<br />기록에서 고르기</div>
    </div>
    <div class="ar">→</div>
    <div class="step">
      <div class="n">3</div>
      <div class="ic"><svg width="54" height="56" viewBox="0 0 54 56"><path d="M8,26 L46,10 L38,48 L26,36 Z" fill="#0d9488"/><path d="M46,10 L26,36 L26,46 L33,38" fill="#0b7a6f"/><circle cx="40" cy="42" r="12" fill="#3fb98a"/><path d="M35,42 l3.5,3.5 6,-7" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="t">자동 전송</div>
      <div class="d">보험사로 바로 전송<br />10분이면 청구 완료</div>
    </div>
  </div>

  <div class="note">본인 것뿐 아니라 <b>자녀가 부모님 것</b>을, 배우자·위임 대리인이 대신 청구하는 것도 돼요</div>
</div>
