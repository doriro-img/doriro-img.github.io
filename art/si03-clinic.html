<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f2f7f7;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1f3a3a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6e8585; margin-bottom: 22px; font-weight: 600; }
  .tl { display: flex; align-items: stretch; gap: 0; margin-bottom: 16px; }
  .stage { flex: 1; background: #fff; border-radius: 16px; padding: 18px 20px; box-shadow: 0 6px 16px rgba(40,90,90,.08); border: 1px solid #dcece9; }
  .stage .dt { font-size: 13px; font-weight: 800; color: #0d9488; }
  .stage .wh { font-size: 16.5px; font-weight: 800; margin-top: 4px; }
  .stage .cnt { font-size: 13px; color: #5f7d7b; margin-top: 4px; }
  .stage.a2 { border-color: #9bd8cf; background: #f0faf8; }
  .arr { flex: none; display: flex; align-items: center; padding: 0 12px; color: #0d9488; font-size: 24px; font-weight: 800; }
  .find { background: #fff; border: 1.5px solid #cfe6e2; border-radius: 14px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; }
  .find .ic { flex: none; }
  .find .tx { font-size: 14px; color: #3f5f5d; line-height: 1.5; }
  .find .tx b { color: #0d8074; }
</style>

<div id="art">
  <h1>단, '참여 기관'에서만 돼요</h1>
  <p class="sub">2025년부터 의원·약국까지 확 늘어서, 이제 웬만한 곳은 다 돼요</p>

  <div class="tl">
    <div class="stage">
      <div class="dt">2024. 10. 25</div>
      <div class="wh">병원급 시작</div>
      <div class="cnt">종합병원·상급병원 등</div>
    </div>
    <div class="arr">→</div>
    <div class="stage a2">
      <div class="dt">2025. 10. 25</div>
      <div class="wh">의원·약국 확대</div>
      <div class="cnt">약 <b style="color:#0d8074;">9만 6천 개</b> 기관 추가</div>
    </div>
  </div>

  <div class="find">
    <div class="ic"><svg width="52" height="52" viewBox="0 0 52 52">
      <path d="M26,6 C16,6 9,13 9,23 C9,34 26,46 26,46 C26,46 43,34 43,23 C43,13 36,6 26,6 Z" fill="#0d9488"/>
      <circle cx="26" cy="22" r="8" fill="#fff"/>
      <path d="M22,22 h8 M26,18 v8" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/></svg></div>
    <div class="tx"><b>내 주변 참여 기관 찾기</b> — 실손24 앱이나 지도 앱에서 '실손보험 청구 간소화 서비스'를 검색하면 위치 기준으로 참여 병원·약국이 나와요</div>
  </div>
</div>
