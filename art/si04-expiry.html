<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 32px; background: #f2f7f7;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1f3a3a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6e8585; margin-bottom: 26px; font-weight: 600; }
  .bar { display: flex; height: 54px; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 15px rgba(40,90,90,.08); }
  .gone { flex: 0.8; background: #d3dbda; display: flex; align-items: center; justify-content: center; color: #7a8a89; font-size: 14px; font-weight: 800; }
  .ok { flex: 2.2; background: linear-gradient(90deg,#3fb98a,#0d9488); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; font-weight: 800; }
  .scale { display: flex; margin-top: 9px; font-size: 12.5px; font-weight: 700; color: #5f7d7b; }
  .scale .a { flex: 0.8; text-align: left; } .scale .b { flex: 2.2; text-align: right; }
  .hook { margin-top: 22px; background: #fff; border: 1.5px solid #9bd8cf; border-radius: 14px; padding: 16px 20px;
    font-size: 14.5px; color: #26463f; line-height: 1.6; }
  .hook b { color: #0d8074; }
  .note { margin-top: 12px; font-size: 12.5px; color: #8a9c9a; line-height: 1.6; text-align: center; }
</style>

<div id="art">
  <h1>3년 안에 낸 병원비, 아직 청구할 수 있어요</h1>
  <p class="sub">실손 청구권 소멸시효는 '3년' — 놓친 병원비가 곧 숨은 돈이에요</p>

  <div class="bar">
    <div class="gone">3년 지남 · 소멸</div>
    <div class="ok">최근 3년 · 지금도 청구 가능 →</div>
  </div>
  <div class="scale">
    <span class="a">← 청구 못 함</span>
    <span class="b">오늘</span>
  </div>

  <div class="hook">💡 감기 진료, 물리치료, 약값처럼 <b>소액이라 깜빡하고 안 낸 병원비</b> 있으시죠? 최근 3년 안에 낸 거라면 실손24로 <b>지금 한 번에 몰아서 청구</b>할 수 있어요</div>

  <p class="note">※ 소멸시효는 치료 완료일(또는 진료비 납부일)을 기준으로 3년이에요. 정확한 기산일·보장 여부는 가입한 보험사에 확인하세요</p>
</div>
