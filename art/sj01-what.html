<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #fff5ec;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #33291f; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #8a7360; margin-bottom: 20px; font-weight: 600; }
  .spec { display: flex; align-items: stretch; gap: 0; margin-bottom: 16px; border-radius: 13px; overflow: hidden;
    box-shadow: 0 5px 14px rgba(180,110,50,.08); }
  .seg { flex: 1; padding: 15px 10px; text-align: center; }
  .s1 { background: #fff; } .s2 { background: #f4813a; } .s3 { background: #fff; }
  .seg .t { font-size: 15px; font-weight: 800; }
  .s1 .t, .s3 .t { color: #a89482; }
  .s2 .t { color: #fff; }
  .seg .v { font-size: 12px; font-weight: 700; margin-top: 2px; }
  .s1 .v, .s3 .v { color: #b5a290; } .s2 .v { color: #ffe6d3; }
  .box { background: #fff; border: 1.5px solid #f2e4d5; border-radius: 13px; padding: 16px 20px;
    box-shadow: 0 5px 13px rgba(180,110,50,.05); }
  .box .h { font-size: 15px; font-weight: 800; color: #dd6520; margin-bottom: 6px; }
  .box .t { font-size: 14px; line-height: 1.65; color: #4a3c30; }
  .box .t b { color: #17a4a0; }
</style>

<div id="art">
  <h1>슬로우조깅, 그게 뭔가요?</h1>
  <p class="sub">걷기랑 달리기, 딱 그 중간이에요</p>

  <div class="spec">
    <div class="seg s1"><div class="t">걷기</div><div class="v">~4km/h</div></div>
    <div class="seg s2"><div class="t">슬로우조깅</div><div class="v">4~6km/h</div></div>
    <div class="seg s3"><div class="t">달리기</div><div class="v">8km/h~</div></div>
  </div>

  <div class="box">
    <div class="h">핵심은 '속도'가 아니라 '숨'이에요</div>
    <div class="t"><b>옆 사람과 대화하거나 노래를 흥얼거릴 수 있는 속도</b>가 딱 맞아요. 숨이 차면 너무 빠른 거예요. 웃으면서 뛸 수 있을 만큼만, 그게 슬로우조깅이더라고요</div>
  </div>
</div>
