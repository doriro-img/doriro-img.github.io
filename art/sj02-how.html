<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #fff5ec;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #33291f; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #8a7360; margin-bottom: 18px; font-weight: 600; }
  .three { display: flex; gap: 13px; }
  .c { flex: 1; background: #fff; border-radius: 15px; padding: 18px 16px; text-align: center;
    box-shadow: 0 6px 15px rgba(180,110,50,.08); border: 1px solid #f2e4d5; }
  .ic { width: 56px; height: 56px; border-radius: 50%; background: #fff0e3; margin: 0 auto 11px;
    display: flex; align-items: center; justify-content: center; }
  .c .t { font-size: 15px; font-weight: 800; color: #dd6520; margin-bottom: 5px; }
  .c .d { font-size: 12.8px; color: #6a5647; line-height: 1.5; font-weight: 600; }
  .c .d b { color: #17a4a0; }
</style>

<div id="art">
  <h1>제대로 하는 법 (자세가 핵심)</h1>
  <p class="sub">이 세 가지만 지키면 돼요</p>

  <div class="three">
    <div class="c">
      <div class="ic"><svg width="30" height="30" viewBox="0 0 30 30"><path d="M6,20 q4,-10 14,-11 l4,0 q-2,6 -8,8 q-5,2 -10,3 Z" fill="#f4813a"/><circle cx="9" cy="21" r="2.5" fill="#dd6520"/></svg></div>
      <div class="t">앞꿈치 착지</div>
      <div class="d">뒤꿈치로 '쿵' 말고<br/>발 앞·중간으로 사뿐히<br/><b>관절 충격이 1/3로</b></div>
    </div>
    <div class="c">
      <div class="ic"><svg width="30" height="30" viewBox="0 0 30 30"><rect x="5" y="13" width="5" height="4" rx="2" fill="#f4813a"/><rect x="12.5" y="13" width="5" height="4" rx="2" fill="#f4813a"/><rect x="20" y="13" width="5" height="4" rx="2" fill="#f4813a"/></svg></div>
      <div class="t">좁은 보폭, 총총</div>
      <div class="d">보폭은 짧게 경쾌하게<br/><b>1분에 170~180보</b><br/>1초에 세 걸음 느낌</div>
    </div>
    <div class="c">
      <div class="ic"><svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="none" stroke="#f4813a" stroke-width="2.4"/><circle cx="11" cy="12" r="1.6" fill="#f4813a"/><circle cx="19" cy="12" r="1.6" fill="#f4813a"/><path d="M9,18 q6,5 12,0" fill="none" stroke="#f4813a" stroke-width="2.2" stroke-linecap="round"/></svg></div>
      <div class="t">웃는 페이스</div>
      <div class="d">대화·노래가 되면 적정<br/><b>숨이 차면 너무 빠른 것</b><br/>웃으며 뛸 만큼만</div>
    </div>
  </div>
</div>
