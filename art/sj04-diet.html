<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #fff5ec;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #33291f; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #8a7360; margin-bottom: 16px; font-weight: 600; }
  .cmp { display: flex; align-items: center; gap: 13px; margin-bottom: 13px; }
  .cc { flex: 1; background: #fff; border-radius: 13px; padding: 15px 18px; text-align: center;
    box-shadow: 0 5px 13px rgba(180,110,50,.06); border: 1px solid #f2e4d5; }
  .cc .l { font-size: 13px; font-weight: 800; color: #8a7360; }
  .cc .v { font-size: 22px; font-weight: 800; margin-top: 4px; }
  .walk .v { color: #a89482; } .jog .v { color: #f4813a; }
  .x { font-size: 15px; font-weight: 800; color: #b5a290; }
  .why { background: #fff; border: 1.5px solid #f2e4d5; border-radius: 13px; padding: 15px 20px; margin-bottom: 12px;
    box-shadow: 0 5px 13px rgba(180,110,50,.05); }
  .why .h { font-size: 14.5px; font-weight: 800; color: #17a4a0; margin-bottom: 5px; }
  .why .t { font-size: 13.8px; line-height: 1.65; color: #4a3c30; }
  .why .t b { color: #dd6520; }
  .tip { background: #e9f7f6; border: 1.5px solid #bce5e2; border-radius: 12px; padding: 12px 18px;
    font-size: 13px; color: #147067; line-height: 1.6; font-weight: 600; }
  .tip b { color: #0f5851; }
</style>

<div id="art">
  <h1>천천히 뛰어도 살이 빠진다고요?</h1>
  <p class="sub">오히려 '지방'은 더 잘 태워요</p>

  <div class="cmp">
    <div class="cc walk"><div class="l">같은 시간 걷기</div><div class="v">기준 1배</div></div>
    <div class="x">VS</div>
    <div class="cc jog"><div class="l">슬로우조깅</div><div class="v">약 1.5배 소모</div></div>
  </div>

  <div class="why">
    <div class="h">비결은 '지방 연소'예요</div>
    <div class="t">숨이 차지 않는 저강도라서 <b>몸이 지방을 주 에너지로 쓰는 비율이 높아요.</b> 격하게 뛰면 당을 태우지만, 천천히 뛰면 지방을 태우는 거죠</div>
  </div>

  <div class="tip"><b>단, 천천히라 1회 소모량 자체는 크지 않아요.</b> 그래서 시간과 빈도가 관건이에요. 하루 30분 이상, 주 2회 이상 꾸준히 해야 효과가 쌓여요</div>
</div>
