<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 34px 36px 30px; background: #fff;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1b1b1b; }
  h1 { font-size: 20px; letter-spacing: -0.4px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6b6b6b; margin-bottom: 20px; }
  .flow { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
  .b { flex: 1; border-radius: 11px; padding: 15px 16px; text-align: center; }
  .b .k { font-size: 12px; font-weight: 700; margin-bottom: 5px; }
  .b .v { font-size: 22px; font-weight: 800; letter-spacing: -0.8px; }
  .b1 { background: #eff6fb; border: 1px solid #cfe0f0; }
  .b1 .k { color: #4f7ba8; } .b1 .v { color: #1f4a7a; }
  .b2 { background: #f5f7f8; border: 1px solid #e2e6ea; }
  .b2 .k { color: #8a929c; } .b2 .v { color: #45505c; }
  .b3 { background: linear-gradient(160deg,#eef9f3,#d3f0e1); border: 1px solid #a9dcc4; }
  .b3 .k { color: #3d9b74; } .b3 .v { color: #1d7050; }
  .op { font-size: 20px; font-weight: 800; color: #b8c2cc; flex-shrink: 0; }
  .cond { border: 1px solid #e6e9ed; border-radius: 10px; overflow: hidden; }
  .ch { background: #f2f5f7; padding: 10px 18px; font-size: 12.5px; font-weight: 800; color: #55606c; }
  .cb { display: flex; }
  .c1 { flex: 1; padding: 13px 18px; border-right: 1px solid #eef1f4; }
  .c1:last-child { border-right: none; }
  .c1 .k { font-size: 11.5px; color: #8a929c; font-weight: 700; margin-bottom: 3px; }
  .c1 .v { font-size: 14.5px; font-weight: 800; color: #1b1b1b; }
</style>
<div id="art">
  <h1>연말정산 소득공제도 됩니다</h1>
  <p class="sub">한도가 240만원에서 300만원으로 늘었습니다</p>
  <div class="flow">
    <div class="b b1"><div class="k">공제 대상 납입액 한도</div><div class="v">연 300만원</div></div>
    <div class="op">×</div>
    <div class="b b2"><div class="k">공제율</div><div class="v">40%</div></div>
    <div class="op">=</div>
    <div class="b b3"><div class="k">소득에서 빼주는 금액</div><div class="v">연 120만원</div></div>
  </div>
  <div class="cond">
    <div class="ch">이 조건을 지켜야 공제를 받습니다</div>
    <div class="cb">
      <div class="c1"><div class="k">연봉</div><div class="v">7,000만원 이하</div></div>
      <div class="c1"><div class="k">주택 보유</div><div class="v">무주택</div></div>
      <div class="c1"><div class="k">대상</div><div class="v">세대주와 배우자</div></div>
      <div class="c1"><div class="k">월 300만원 채우려면</div><div class="v">월 25만원씩</div></div>
    </div>
  </div>
</div>
