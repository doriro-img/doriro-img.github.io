<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#faf5eb,#e7d8bd);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #4a3616;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #7a5c2e; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #7a5c2e; }
  .sub { margin-top: 28px; font-size: 25px; color: #8a7250; font-weight: 600; }
  .sub b { color: #6b4f22; }
  .badge { position: absolute; top: 118px; right: 64px; background: #c0554a; color: #fff;
    border-radius: 26px; padding: 20px 30px; font-size: 42px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .bars { position: absolute; bottom: 108px; left: 64px; display: flex; align-items: flex-end; gap: 18px; height: 118px; }
  .bars div { text-align: center; }
  .bars i { width: 62px; border-radius: 10px 10px 0 0; display: block; }
  .bars b { display: block; font-size: 21px; font-weight: 800; color: #5c4520; margin-bottom: 7px; }
  .bars span { display: block; font-size: 15px; font-weight: 700; color: #8a7a5e; margin-top: 8px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b09a72; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>신고 기한</small>60일</div>
  <div class="tag">주택 취득세</div>
  <h1>세율 계산과<br /><span class="hl">생애최초 감면</span></h1>
  <p class="sub">집값 말고 <b>따로 준비</b>해야 할 돈</p>
  <div class="bars">
    <div><b>1%</b><i style="height:40px;background:#dcc9a3;"></i><span>6억 이하</span></div>
    <div><b>1~3%</b><i style="height:74px;background:#c9ae82;"></i><span>6~9억</span></div>
    <div><b>3%</b><i style="height:112px;background:#7a5c2e;"></i><span>9억 초과</span></div>
  </div>
  <div class="foot">heelovee.tistory.com</div>
</div>
