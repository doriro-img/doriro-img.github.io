<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#fdf2f5,#eecfd8);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #5c2634;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #a8546b; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #a8546b; }
  .sub { margin-top: 28px; font-size: 25px; color: #8a5f6b; font-weight: 600; }
  .sub b { color: #96455c; }
  .badge { position: absolute; top: 116px; right: 64px; background: #a8546b; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 30px; font-weight: 800; text-align: center; line-height: 1.3; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 5px; }
  .chips { position: absolute; bottom: 110px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 500px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #7d3a4c; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #bb8f9c; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>구분 기준</small>학교 안<br />vs 학교 밖</div>
  <div class="tag">초등 방과후</div>
  <h1>돌봄 종류<br /><span class="hl">한눈에 비교</span></h1>
  <p class="sub">신청처가 <b>각각 다릅니다</b></p>
  <div class="chips"><div>늘봄학교</div><div>다함께돌봄센터</div><div>지역아동센터</div><div>아이돌봄서비스</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
