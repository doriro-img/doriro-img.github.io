<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef6fb,#c6dfef);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #16324e;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #2f6b8a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 58px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #2f6b8a; }
  .sub { margin-top: 28px; font-size: 25px; color: #52748a; font-weight: 600; }
  .sub b { color: #2f6b8a; }
  .badge { position: absolute; top: 118px; right: 64px; background: #1d7050; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 32px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #2f6b8a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8fabc0; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>하루</small>3회 10분</div>
  <div class="tag">겨울 실내 환기</div>
  <h1>공기청정기로는<br /><span class="hl">대체가 안 됩니다</span></h1>
  <p class="sub">이산화탄소는 <b>창을 열어야</b> 빠져요</p>
  <div class="chips"><div>맞통풍</div><div>조리 후 필수</div><div>난방 유지</div><div>전열교환</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
