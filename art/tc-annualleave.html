<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef4fa,#c7dbee);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #14304f;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1f4a7a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1f4a7a; }
  .sub { margin-top: 28px; font-size: 25px; color: #4d6b8a; font-weight: 600; }
  .sub b { color: #1f4a7a; }
  .badge { position: absolute; top: 112px; right: 64px; background: #c0554a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 36px; font-weight: 800; text-align: center; line-height: 1.2; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 5px; }
  .chips { position: absolute; bottom: 110px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #1f4a7a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8ba4bd; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>통보</small>2단계</div>
  <div class="tag">연차수당</div>
  <h1>남은 연차<br /><span class="hl">돈으로 받나?</span></h1>
  <p class="sub">회사가 <b>절차를 밟았는지</b>로 갈립니다</p>
  <div class="chips"><div>사용촉진</div><div>통상임금</div><div>회계연도 기준</div><div>퇴사 정산</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
