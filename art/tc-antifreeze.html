<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eaf7f7,#c2e0e0);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1c3a3a;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #2f5f6b; color: #fff;

  h1 { font-size: 58px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #b8443a; }
  .sub { margin-top: 28px; font-size: 25px; color: #547070; font-weight: 600; }
  .sub b { color: #2f5f6b; }
  .badge { position: absolute; top: 118px; right: 64px; background: #2f5f6b; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 32px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #2f5f6b; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #86a5a5; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>점검</small>식은 뒤에</div>
  <div class="tag">겨울 차량 점검</div>
  <h1>색이 다르면<br /><span class="hl">섞지 마세요</span></h1>
  <p class="sub">부동액은 <b>양보다 농도</b>입니다</p>
  <div class="chips"><div>어는점 측정</div><div>겨울용 워셔액</div><div>누수 확인</div><div>와이퍼 교체</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
