<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#f5f1f8,#ded2e8);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #3d2a4a;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #6b4a7a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #6b4a7a; }
  .sub { margin-top: 28px; font-size: 25px; color: #7a6588; font-weight: 600; }
  .sub b { color: #5a3a6b; }
  .badge { position: absolute; top: 118px; right: 64px; background: #6b4a7a; color: #fff;
    border-radius: 26px; padding: 20px 32px; font-size: 44px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .bars { position: absolute; bottom: 106px; left: 64px; display: flex; align-items: flex-end; gap: 15px; height: 116px; }
  .bars div { text-align: center; }
  .bars i { width: 56px; border-radius: 10px 10px 0 0; display: block; }
  .bars b { display: block; font-size: 20px; font-weight: 800; color: #4a3355; margin-bottom: 7px; }
  .bars span { display: block; font-size: 14px; font-weight: 700; color: #7a6588; margin-top: 8px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #a893b5; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>생계급여 기준</small>32%</div>
  <div class="tag">기초생활보장</div>
  <h1>생계급여와<br /><span class="hl">부양의무자 기준</span></h1>
  <p class="sub">자녀 소득 기준은 <b>대부분 폐지</b>됐습니다</p>
  <div class="bars">
    <div><b>32%</b><i style="height:44px;background:#6b4a7a;"></i><span>생계</span></div>
    <div><b>40%</b><i style="height:62px;background:#8a6b99;"></i><span>의료</span></div>
    <div><b>48%</b><i style="height:82px;background:#a98cb8;"></i><span>주거</span></div>
    <div><b>50%</b><i style="height:92px;background:#c5adcf;"></i><span>교육</span></div>
  </div>
  <div class="foot">heelovee.tistory.com</div>
</div>
