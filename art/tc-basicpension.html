<!doctype html>
<meta charset="utf-8" />
<style>

    display: flex; flex-direction: column; justify-content: center; position: relative; }

  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .scene { position: absolute; bottom: 106px; left: 64px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b09a72; font-weight: 700; }
</style>

    <rect x="146" y="26" width="100" height="58" rx="10" fill="#7a5c2e"/>
    <text x="196" y="64" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">×4%</text>
