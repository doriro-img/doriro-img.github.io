<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#fdf2f5,#eecfd8);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #5c2634;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #a8546b; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #a8546b; }
  .sub { margin-top: 28px; font-size: 25px; color: #8a5f6b; font-weight: 600; }
  .sub b { color: #96455c; }
  .badge { position: absolute; top: 118px; right: 64px; background: #c0554a; color: #fff;
    border-radius: 26px; padding: 20px 30px; font-size: 40px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 110px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 490px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #7d3a4c; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #bb8f9c; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>신청 기한</small>1년</div>
  <div class="tag">고용보험 미적용자</div>
  <h1>출산급여<br /><span class="hl">신청 조건</span></h1>
  <p class="sub">회사에 안 다녀도 <b>받습니다</b></p>
  <div class="chips"><div>프리랜서</div><div>자영업자</div><div>특수형태근로</div><div>단기 근로자</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
