<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#f3f3f6,#d2d2da);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2b2b31;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #3f3f4a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 57px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #b8443a; }
  .sub { margin-top: 28px; font-size: 25px; color: #63636e; font-weight: 600; }
  .sub b { color: #3f3f4a; }
  .badge { position: absolute; top: 118px; right: 64px; background: #b8443a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 32px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #3f3f4a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #9595a0; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>요금</small>부피 무게</div>
  <div class="tag">해외직구 배송대행</div>
  <h1>싸게 사고<br /><span class="hl">배송비로 날려요</span></h1>
  <p class="sub">물건값에 <b>배송비와 세금</b>을 더하세요</p>
  <div class="chips"><div>배대지</div><div>합산과세</div><div>반품비</div><div>가짜 쇼핑몰</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
