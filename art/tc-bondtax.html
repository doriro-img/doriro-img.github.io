<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef4fa,#c9dcee);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #14304f;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1f4a7a; color: #fff;

  .duo { position: absolute; top: 108px; right: 60px; display: flex; gap: 14px; }
  .duo div { width: 150px; border-radius: 22px; padding: 20px 10px; text-align: center; background: #fff; }
  .duo .n { font-size: 40px; font-weight: 800; letter-spacing: -2px; }
  .duo .l { font-size: 16px; font-weight: 700; color: #6b7885; margin-top: 4px; }
  .bars { position: absolute; bottom: 106px; left: 64px; display: flex; align-items: flex-end; gap: 13px; height: 108px; }
  .bars i { width: 46px; border-radius: 9px 9px 0 0; display: block; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8ba4bd; font-weight: 700; }
</style>
<div id="art">
  <div class="duo">
    <div><div class="n" style="color:#b8443a;">15.4%</div><div class="l">이자수익</div></div>
    <div><div class="n" style="color:#1d7050;">0%</div><div class="l">매매차익</div></div>
  </div>

  <h1>채권 세금과<br /><span class="hl">저쿠폰 절세</span></h1>
  <p class="sub">차익은 <b>세금이 없습니다</b></p>
  <div class="bars">
    <i style="height:88px;background:#c0554a;"></i>
    <i style="height:24px;background:#a9cbe0;"></i>
    <i style="height:26px;background:#c0554a;"></i>
    <i style="height:96px;background:#1d7050;"></i>
  </div>
  <div class="foot">heelovee.tistory.com</div>
