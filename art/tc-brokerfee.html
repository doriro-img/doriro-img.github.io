<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#faf5eb,#e7d8bd);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #4a3616;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #7a5c2e; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #7a5c2e; }
  .sub { margin-top: 28px; font-size: 25px; color: #8a7250; font-weight: 600; }
  .sub b { color: #6b4f22; }
  .badge { position: absolute; top: 114px; right: 64px; background: #c0554a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 30px; font-weight: 800; text-align: center; line-height: 1.3; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 5px; }
  .calc { position: absolute; bottom: 108px; left: 64px; background: #7a5c2e; color: #fff;
    border-radius: 18px; padding: 20px 26px; font-size: 23px; font-weight: 800; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b09a72; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>고시 요율은</small>정찰가 아닌<br />상한선</div>
  <div class="tag">부동산 중개보수</div>
  <h1>계산법과<br /><span class="hl">협의 여지</span></h1>
  <p class="sub">협의는 <b>계약 전</b>에 해야 합니다</p>
  <div class="calc">보증금 + (월차임 × 100)</div>
  <div class="foot">heelovee.tistory.com</div>
</div>
