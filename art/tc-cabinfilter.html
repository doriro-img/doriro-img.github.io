<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#f0f3f8,#ccd6e3);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #26313f;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #4a5f7a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 58px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #4a5f7a; }
  .sub { margin-top: 28px; font-size: 25px; color: #62717f; font-weight: 600; }
  .sub b { color: #4a5f7a; }
  .badge { position: absolute; top: 118px; right: 64px; background: #1d7050; color: #fff;
    border-radius: 26px; padding: 20px 30px; font-size: 40px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #4a5f7a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #96a3b3; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>소요</small>10분</div>
  <div class="tag">차량 실내 필터</div>
  <h1>공구 없이<br /><span class="hl">직접 바꿉니다</span></h1>
  <p class="sub">겨울 <b>김서림</b>도 여기서 옵니다</p>
  <div class="chips"><div>글로브박스</div><div>화살표 방향</div><div>활성탄형</div><div>증발기 세척</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
