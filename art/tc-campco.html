<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#fdf2ed,#eed3c6);

    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #7a3f2f; color: #fff;

  .badge { position: absolute; top: 118px; right: 64px; background: #b8443a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 32px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #7a3f2f; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b09088; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>필수</small>CO 경보기</div>
  <div class="tag">겨울 캠핑 안전</div>
  <h1>색도 냄새도<br /><span class="hl">없습니다</span></h1>
  <p class="sub">잘 때는 <b>난로를 끄세요</b></p>
  <div class="chips"><div>상단 환기구</div><div>숯불 반입 금지</div><div>차박 배기</div><div>119 신고</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
