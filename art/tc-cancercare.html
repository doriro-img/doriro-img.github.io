<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;

    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #7a2f4a; color: #fff;

  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #7a2f4a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b995a0; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>확진 후</small>산정특례</div>
  <div class="tag">국가암검진</div>

  <p class="sub">간암·폐암은 <b>고위험군</b>만 대상</p>
  <div class="chips"><div>공단 안내문</div><div>확진 검사</div><div>의료비 지원</div><div>보건소 신청</div></div>
  <div class="foot">heelovee.tistory.com</div>
