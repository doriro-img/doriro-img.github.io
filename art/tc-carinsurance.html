<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef2f7,#c8d5e4);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1a3350;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #334f6d; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #334f6d; }
  .sub { margin-top: 28px; font-size: 25px; color: #56718d; font-weight: 600; }
  .sub b { color: #334f6d; }
  .opts { position: absolute; top: 112px; right: 60px; display: grid;
    grid-template-columns: repeat(2, 104px); gap: 11px; }
  .opts div { height: 62px; border-radius: 16px; background: #fff; display: flex;
    align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #334f6d; }
  .opts .on { background: #334f6d; color: #fff; }
  .scene { position: absolute; bottom: 100px; left: 64px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #93a6ba; font-weight: 700; }
</style>
<div id="art">
  <div class="opts">
    <div>50만</div><div>100만</div><div class="on">150만</div><div>200만</div>
  </div>
  <div class="tag">자동차보험</div>
  <h1>물적사고<br /><span class="hl">할증기준금액</span></h1>
  <p class="sub">소액 사고는 <b>자비가 쌉니다</b></p>
  <svg class="scene" width="264" height="116" viewBox="0 0 264 116">

    <path d="M24 50l14-22h54l16 22" fill="#c8d5e4" stroke="#334f6d" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="38" cy="86" r="12" fill="#334f6d"/><circle cx="98" cy="86" r="12" fill="#334f6d"/>
    <path d="M112 42l14-14M120 50l16-6" stroke="#c0554a" stroke-width="5" stroke-linecap="round"/>
    <path d="M150 62h26M170 52l12 10-12 10" stroke="#334f6d" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M196 92V70M218 92V50M240 92V26" stroke="#c0554a" stroke-width="14" stroke-linecap="round"/>
    <path d="M188 100h60" stroke="#93a6ba" stroke-width="5" stroke-linecap="round"/>
  </svg>
  <div class="foot">heelovee.tistory.com</div>
</div>
