<!doctype html>
<meta charset="utf-8" />
<style>

  .ill { position: absolute; top: 82px; right: 44px;
    filter: drop-shadow(0 14px 26px rgba(120,30,50,.2)); }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b98a97; font-weight: 700; }
</style>
