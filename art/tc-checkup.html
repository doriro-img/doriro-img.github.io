<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eaf3f0,#c9e0da);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #143c34;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1d6b5c; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1d6b5c; }
  .sub { margin-top: 28px; font-size: 25px; color: #4d7d72; font-weight: 600; }
  .sub b { color: #1d7050; }
  .badge { position: absolute; top: 130px; right: 64px; background: #1d6b5c; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 34px; font-weight: 800; letter-spacing: -1px; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #86a89f; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>검진 마감</small>12/31</div>
  <div class="tag">국가건강검진</div>
  <h1>2026 건강검진<br /><span class="hl">짝수년생 대상</span></h1>
  <p class="sub">12월엔 예약 자리가 없습니다</p>
  <div class="foot">heelovee.tistory.com</div>
</div>
