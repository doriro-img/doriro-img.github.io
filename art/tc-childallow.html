<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eefaf4,#c7e7d7);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1f3c2f;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1f6b4a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 58px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1f6b4a; }
  .sub { margin-top: 28px; font-size: 25px; color: #567064; font-weight: 600; }
  .sub b { color: #1f6b4a; }
  .badge { position: absolute; top: 118px; right: 64px; background: #c0554a; color: #fff;
    border-radius: 26px; padding: 20px 30px; font-size: 42px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #1f6b4a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #88a898; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>소급</small>60일</div>
  <div class="tag">아동수당</div>
  <h1>소득 안 봅니다<br /><span class="hl">신청만 하면 돼요</span></h1>
  <p class="sub">만 8세 생일 <b>전달</b>까지 나옵니다</p>
  <div class="chips"><div>행복출산 원스톱</div><div>복지로</div><div>중복 수령</div><div>국외 90일</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
