<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef4fa,#c9dcee);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #14304f;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1f4a7a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1f4a7a; }
  .sub { margin-top: 28px; font-size: 25px; color: #4d6b8a; font-weight: 600; }
  .sub b { color: #1f4a7a; }
  .badge { position: absolute; top: 118px; right: 64px; background: #c0554a; color: #fff;
    border-radius: 26px; padding: 20px 32px; font-size: 44px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 110px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 480px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #1f4a7a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8ba4bd; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>부가세 신고</small>25일</div>
  <div class="tag">개인사업자</div>
  <h1>폐업신고<br /><span class="hl">절차와 기한</span></h1>
  <p class="sub">문 닫는다고 <b>끝이 아닙니다</b></p>
  <div class="chips"><div>폐업신고</div><div>부가세 확정</div><div>4대보험</div><div>인허가</div><div>단말기 해지</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
