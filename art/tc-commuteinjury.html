<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #eaf3f0, #c9e0da);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #143c34;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1d6b5c; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1d6b5c; }
  .sub { margin-top: 26px; font-size: 25px; color: #4d7d72; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #1d6b5c; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 30px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(29,107,92,.12); color: #1d6b5c; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #86a89f; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>사업주 동의</small>불필요</div>
  <div class="tag">산재보험</div>
  <h1>출퇴근재해도<br /><span class="hl">산재입니다</span></h1>
  <p class="sub">도보도 자전거도 인정됩니다</p>
  <div class="chips"><div>통상 경로</div><div>휴업급여</div><div>과실 무관</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
