<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #f6f1ea, #e6d8c4);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #46341c;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #8a6420; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #8a6420; }
  .sub { margin-top: 26px; font-size: 25px; color: #7d6540; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #8a6420; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 34px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(138,100,32,.14); color: #8a6420; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #ab977a; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>1주택 공제</small>12억</div>
  <div class="tag">보유세</div>
  <h1>종부세<br /><span class="hl">1주택 12억</span></h1>
  <p class="sub">시세가 아니라 공시가격입니다</p>
  <div class="chips"><div>고령자공제</div><div>장기보유</div><div>공동명의</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
