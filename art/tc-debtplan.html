<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef2f7,#c8d5e4);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1a3350;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #334f6d; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #334f6d; }
  .sub { margin-top: 28px; font-size: 25px; color: #56718d; font-weight: 600; }
  .sub b { color: #334f6d; }
  .badge { position: absolute; top: 118px; right: 64px; background: #1d7050; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 32px; font-weight: 800; text-align: center; line-height: 1.3; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 5px; }
  .steps { position: absolute; bottom: 106px; left: 64px; display: flex; align-items: flex-end; gap: 14px; height: 118px; }
  .steps div { text-align: center; }
  .steps i { width: 58px; border-radius: 10px 10px 0 0; display: block; }
  .steps span { display: block; font-size: 14px; font-weight: 800; color: #56718d; margin-top: 8px; line-height: 1.35; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #93a6ba; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>연체 전에도</small>신청<br />가능</div>
  <div class="tag">신용회복위원회</div>
  <h1>채무조정<br /><span class="hl">세 가지 종류</span></h1>
  <p class="sub">빨리 움직일수록 <b>조건이 좋습니다</b></p>
  <div class="steps">
    <div><i style="height:46px;background:#1d7050;"></i><span>신속<br />30일 이하</span></div>
    <div><i style="height:76px;background:#e8b34a;"></i><span>프리<br />31~89일</span></div>
    <div><i style="height:112px;background:#c0554a;"></i><span>개인<br />90일 이상</span></div>
  </div>
  <div class="foot">heelovee.tistory.com</div>
</div>
