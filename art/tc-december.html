<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eff1fb,#c9d0ee);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #242c47;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #3f4a7a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 58px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #b8443a; }
  .sub { margin-top: 28px; font-size: 25px; color: #5d648a; font-weight: 600; }
  .sub b { color: #3f4a7a; }
  .badge { position: absolute; top: 118px; right: 64px; background: #b8443a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 34px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #3f4a7a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #949bc0; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>기준일</small>12/31</div>
  <div class="tag">12월 마감 목록</div>
  <h1>날짜 지나면<br /><span class="hl">못 하는 일들</span></h1>
  <p class="sub">1월에는 <b>바꿀 수 없습니다</b></p>
  <div class="chips"><div>연금계좌 납입</div><div>종부세 납부</div><div>바우처 잔액</div><div>자동차세 연납</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
