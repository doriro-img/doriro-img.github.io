<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eff4f7,#c6d6df);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #223541;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #3d5566; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 58px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #2f6fb0; }
  .sub { margin-top: 28px; font-size: 25px; color: #5b7383; font-weight: 600; }
  .sub b { color: #2b4453; }
  .badge { position: absolute; top: 112px; right: 64px; background: #2f6fb0; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 34px; font-weight: 800; text-align: center; line-height: 1.25; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 5px; }
  .chips { position: absolute; bottom: 110px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #2b4453; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8ea6b5; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>핵심</small>에어컨<br />켜기</div>
  <div class="tag">겨울 차량 관리</div>
  <h1>앞유리 김서림<br /><span class="hl">몇 초 만에</span></h1>
  <p class="sub">히터만 트니까 <b>안 없어지죠</b></p>
  <div class="chips"><div>디포그</div><div>에어컨 제습</div><div>외기 순환</div><div>유막 제거</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
