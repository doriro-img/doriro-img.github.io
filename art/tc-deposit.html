<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef4fa,#cbdcee);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #17325a;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #23508c; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #23508c; }
  .sub { margin-top: 28px; font-size: 25px; color: #536d95; font-weight: 600; }
  .sub b { color: #1d7050; }
  .badge { position: absolute; top: 130px; right: 64px; background: #23508c; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 34px; font-weight: 800; letter-spacing: -1px; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8fa4c0; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>1인 1금융사</small>1억</div>
  <div class="tag">예금자보호</div>
  <h1>예금보호 1억원<br /><span class="hl">은행별로 각각</span></h1>
  <p class="sub">보호 안 되는 상품 정리</p>
  <div class="foot">heelovee.tistory.com</div>
</div>
