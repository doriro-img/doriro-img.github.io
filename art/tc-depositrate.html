<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef7f3,#c9e4d9);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #123b32;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1d6b5c; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 58px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1d6b5c; }
  .sub { margin-top: 28px; font-size: 25px; color: #4d7d72; font-weight: 600; }
  .sub b { color: #16604f; }
  .badge { position: absolute; top: 118px; right: 64px; background: #c0554a; color: #fff;
    border-radius: 26px; padding: 20px 30px; font-size: 40px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .bars { position: absolute; bottom: 104px; left: 64px; display: flex; align-items: flex-end; gap: 11px; height: 118px; }
  .bars i { width: 40px; border-radius: 9px 9px 0 0; display: block; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #86a89f; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>이자에서 빠지는</small>15.4%</div>
  <div class="tag">예금 고르기</div>
  <h1>예금금리<br /><span class="hl">비교하는 법</span></h1>
  <p class="sub">광고 숫자는 <b>최고금리</b>입니다</p>
  <div class="bars">
    <i style="height:118px;background:#1d6b5c;"></i>
    <i style="height:100px;background:#2f8570;"></i>
    <i style="height:84px;background:#419a83;"></i>
    <i style="height:64px;background:#6bb8a5;"></i>
    <i style="height:44px;background:#9dd3c5;"></i>
    <i style="height:24px;background:#c6e3da;"></i>
  </div>
  <div class="foot">heelovee.tistory.com</div>
</div>
