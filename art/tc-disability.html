<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #eef2f9, #ccd8ea);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #1a2c47;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #2b4f80; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #2b4f80; }
  .sub { margin-top: 26px; font-size: 25px; color: #58718f; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #2b4f80; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 32px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(43,79,128,.13); color: #2b4f80; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8ba0b9; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>중복 수급</small>불가</div>
  <div class="tag">장애인 복지</div>
  <h1>장애인연금과<br /><span class="hl">장애수당</span></h1>
  <p class="sub">중증인지 경증인지에서 갈립니다</p>
  <div class="chips"><div>소득인정액</div><div>기초·부가급여</div><div>기초연금 전환</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
