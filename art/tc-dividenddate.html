<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef4fa,#c9dcee);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #14304f;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1f4a7a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 58px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1f4a7a; }
  .sub { margin-top: 28px; font-size: 25px; color: #4d6b8a; font-weight: 600; }
  .sub b { color: #1f4a7a; }
  .badge { position: absolute; top: 118px; right: 64px; background: #1d7050; color: #fff;
    border-radius: 26px; padding: 20px 32px; font-size: 44px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .days { position: absolute; bottom: 104px; left: 64px; display: flex; gap: 12px; }
  .days div { width: 132px; border-radius: 18px; padding: 16px 8px; text-align: center; color: #fff; }
  .days .k { font-size: 15px; font-weight: 700; opacity: .9; }
  .days .v { font-size: 21px; font-weight: 800; margin-top: 5px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8ba4bd; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>여기까지 매수</small>D-2</div>
  <div class="tag">배당 받는 법</div>
  <h1>배당기준일과<br /><span class="hl">배당락일</span></h1>
  <p class="sub">기준일 당일에 사면 <b>이미 늦습니다</b></p>
  <div class="days">
    <div style="background:#1d7050;"><div class="k">D-2</div><div class="v">매수 마감</div></div>
    <div style="background:#c0554a;"><div class="k">D-1</div><div class="v">배당락일</div></div>
    <div style="background:#1f4a7a;"><div class="k">D</div><div class="v">기준일</div></div>
  </div>
  <div class="foot">heelovee.tistory.com</div>
</div>
