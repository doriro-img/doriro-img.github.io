<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #fdf0f4, #eecdd9);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #4a2030;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #9c3558; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #9c3558; }
  .sub { margin-top: 26px; font-size: 25px; color: #855066; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #9c3558; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 32px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(156,53,88,.12); color: #9c3558; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b3899a; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>한도 넘으면</small>이월</div>
  <div class="tag">기부금 공제</div>
  <h1>기부처마다<br /><span class="hl">한도가 다릅니다</span></h1>
  <p class="sub">영수증은 버리지 마세요</p>
  <div class="chips"><div>법정·지정</div><div>종교단체</div><div>고향사랑</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
