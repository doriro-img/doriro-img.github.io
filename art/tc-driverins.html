<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #f2f0f7, #d5cfe6);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #2e2350;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #543f96; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #543f96; }
  .sub { margin-top: 26px; font-size: 25px; color: #6f6394; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #543f96; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 30px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(84,63,150,.12); color: #543f96; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #9a90b7; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>민사 대 형사</small>둘 다</div>
  <div class="tag">운전자보험</div>
  <h1>자동차보험과<br /><span class="hl">뭐가 다를까</span></h1>
  <p class="sub">겹치지 않아서 대체가 안 됩니다</p>
  <div class="chips"><div>형사합의금</div><div>변호사비</div><div>음주 면책</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
