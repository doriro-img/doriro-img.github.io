<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eaf9f5,#c4e6dd);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1c3a35;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1f6b5f; color: #fff;

  .sub b { color: #1f6b5f; }
  .badge { position: absolute; top: 118px; right: 64px; background: #c0554a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 34px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #1f6b5f; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #85a89f; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>월령</small>18개월</div>
  <div class="tag">부모 육아휴직 특례</div>
  <h1>둘 다 쓰면<br /><span class="hl">급여가 오릅니다</span></h1>
  <p class="sub">순서대로 써도 <b>적용됩니다</b></p>
  <div class="chips"><div>동시·순차</div><div>두 번째가 기준</div><div>고용24</div><div>다른 회사 OK</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
