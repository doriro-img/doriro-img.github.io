<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef4f8,#cdddea);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #16344a;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #2f5d7c; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 58px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #2f5d7c; }
  .sub { margin-top: 28px; font-size: 25px; color: #547b95; font-weight: 600; }
  .sub b { color: #2f5d7c; }
  .duo { position: absolute; top: 108px; right: 60px; display: flex; gap: 14px; }
  .duo div { width: 148px; border-radius: 22px; padding: 20px 10px; text-align: center; background: #fff; }
  .duo .n { font-size: 40px; font-weight: 800; letter-spacing: -2px; }
  .duo .l { font-size: 16px; font-weight: 700; color: #6b7885; margin-top: 4px; }
  .down .n { color: #b8443a; }
  .up .n { color: #1d7050; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8fabbe; font-weight: 700; }
  .bars { position: absolute; bottom: 108px; left: 64px; display: flex; align-items: flex-end; gap: 10px; height: 96px; }
  .bars i { width: 34px; border-radius: 8px 8px 0 0; display: block; }
</style>
<div id="art">
  <div class="duo">
    <div class="down"><div class="n">−30%</div><div class="l">5년 당기면</div></div>
    <div class="up"><div class="n">+36%</div><div class="l">5년 미루면</div></div>
  </div>
  <div class="tag">국민연금</div>
  <h1>조기수령 vs<br /><span class="hl">연기연금</span></h1>
  <p class="sub">손익분기는 <b>70대 후반</b>에서 갈립니다</p>
  <div class="bars">
    <i style="height:44px;background:#b8443a;"></i>
    <i style="height:56px;background:#c78a80;"></i>
    <i style="height:68px;background:#7fb0cd;"></i>
    <i style="height:82px;background:#4d97ad;"></i>
    <i style="height:96px;background:#1d7050;"></i>
  </div>
  <div class="foot">heelovee.tistory.com</div>
</div>
