<!doctype html>
<meta charset="utf-8" />
<style>

  .kwh .v { font-size: 27px; font-weight: 800; color: #2f4d2f; margin-top: 5px; }

<div id="art">

  <div class="kwh"><div class="k">진짜 비교 기준</div><div class="v">월간 소비전력량 kWh</div></div>
