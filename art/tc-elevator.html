<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef5fa,#c8dcea);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #22333f;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #3f5f7a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 57px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #b8443a; }
  .sub { margin-top: 28px; font-size: 25px; color: #5c7280; font-weight: 600; }
  .sub b { color: #3f5f7a; }
  .badge { position: absolute; top: 118px; right: 64px; background: #3f5f7a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 32px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #3f5f7a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8ba5b3; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>먼저</small>비상벨</div>
  <div class="tag">승강기 갇힘</div>
  <h1>문을 열려고<br /><span class="hl">하지 마세요</span></h1>
  <p class="sub">가만히 기다리는 게 <b>가장 안전</b>합니다</p>
  <div class="chips"><div>호기 번호</div><div>119 신고</div><div>자동구출운전</div><div>화재 시 계단</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
