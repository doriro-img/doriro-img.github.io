<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #fdeeec, #f0c9c3);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #4d211b;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #a83228; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #a83228; }
  .sub { margin-top: 26px; font-size: 25px; color: #8a5148; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #a83228; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 30px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(168,50,40,.12); color: #a83228; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b78d86; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>비응급이면</small>전액</div>
  <div class="tag">응급실 비용</div>
  <h1>경증으로 가면<br /><span class="hl">더 냅니다</span></h1>
  <p class="sub">중증 의심이면 망설이지 마세요</p>
  <div class="chips"><div>중증도 분류</div><div>관리료</div><div>기관 종별</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
