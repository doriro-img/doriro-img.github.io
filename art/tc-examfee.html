<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eefaf4,#c7e7d9);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1c3a30;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #2f5f4a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 57px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #2f5f4a; }
  .sub { margin-top: 28px; font-size: 25px; color: #547066; font-weight: 600; }
  .sub b { color: #2f5f4a; }
  .badge { position: absolute; top: 118px; right: 64px; background: #b8443a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 30px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #2f5f4a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #86a89b; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>선택</small>접수 화면</div>
  <div class="tag">자격증 응시료 지원</div>
  <h1>접수할 때<br /><span class="hl">골라야 됩니다</span></h1>
  <p class="sub">나중에 말하면 <b>소급이 안 돼요</b></p>
  <div class="chips"><div>큐넷</div><div>감면 대상</div><div>청년 환급</div><div>계좌 등록</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
