<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#ecf7fb,#c5e0ea);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1a3540;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1f5f7a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 57px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1f5f7a; }
  .sub { margin-top: 28px; font-size: 25px; color: #54737e; font-weight: 600; }
  .sub b { color: #1f5f7a; }
  .badge { position: absolute; top: 118px; right: 64px; background: #b8443a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 30px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #1f5f7a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8aa8b3; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>결제는</small>현지 통화</div>
  <div class="tag">환전 우대율</div>
  <h1>환율을 깎는 게<br /><span class="hl">아닙니다</span></h1>
  <p class="sub">우대는 <b>수수료</b>에 붙는 비율이에요</p>
  <div class="chips"><div>매매기준율</div><div>현찰 vs 송금</div><div>앱 사전 신청</div><div>원화결제 차단</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
