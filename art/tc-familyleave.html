<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef9f2,#c9e7d5);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1f3c2f;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #2f6b4a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 57px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #2f6b4a; }
  .sub { margin-top: 28px; font-size: 25px; color: #567064; font-weight: 600; }
  .sub b { color: #2f6b4a; }
  .badge { position: absolute; top: 118px; right: 64px; background: #b8443a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 36px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #2f6b4a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #88a898; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>급여</small>무급</div>
  <div class="tag">가족돌봄휴가</div>
  <h1>연차 말고<br /><span class="hl">따로 있습니다</span></h1>
  <p class="sub">하루 단위로 <b>나눠 쓸 수</b> 있어요</p>
  <div class="chips"><div>배우자의 부모</div><div>서면 신청</div><div>거부 불가</div><div>근속 포함</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
