<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#f6f1fd,#dbcdf0);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #332845;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #6b4a8a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 57px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #6b4a8a; }
  .sub { margin-top: 28px; font-size: 25px; color: #6e6380; font-weight: 600; }
  .sub b { color: #6b4a8a; }
  .badge { position: absolute; top: 118px; right: 64px; background: #c0554a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 34px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #6b4a8a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #9d92b5; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>순서</small>진단→신청</div>
  <div class="tag">난임 시술비 지원</div>
  <h1>통지서 먼저<br /><span class="hl">받고 시술입니다</span></h1>
  <p class="sub">거꾸로 하면 <b>지원을 못 받아요</b></p>
  <div class="chips"><div>난임 진단서</div><div>보건소 신청</div><div>유효기간</div><div>지정 의료기관</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
