<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#e9f5ef,#c9e6d8);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #16412f;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1d7050; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 58px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1d7050; }
  .sub { margin-top: 28px; font-size: 25px; color: #4d7a66; font-weight: 600; }
  .sub b { color: #b06a1e; }
  .snow { position: absolute; top: 84px; right: 40px;
    filter: drop-shadow(0 14px 26px rgba(20,80,55,.22)); }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #85a897; font-weight: 700; }
</style>

<div id="art">
  <div class="snow">
    <svg width="330" height="250" viewBox="0 0 330 250">
      <!-- 비탈 -->
      <path d="M6,232 Q120,214 200,150 Q262,100 324,44 L324,244 L6,244 Z" fill="#a9d8c1" opacity=".55"/>
      <path d="M6,232 Q120,214 200,150 Q262,100 324,44" stroke="#7cc3a3" stroke-width="5"
            fill="none" stroke-linecap="round"/>

      <!-- 굴러온 자국 (작은 눈덩이들) -->
      <circle cx="292" cy="66" r="13" fill="#fff" opacity=".85"/>
      <circle cx="243" cy="106" r="20" fill="#fff" opacity=".9"/>
      <circle cx="184" cy="156" r="29" fill="#fff" opacity=".95"/>

      <!-- 큰 눈덩이 -->
      <circle cx="86" cy="182" r="52" fill="#fff"/>
      <circle cx="86" cy="182" r="52" fill="none" stroke="#8fcdb0" stroke-width="3"/>
      <!-- 동전 -->
      <g>
        <ellipse cx="72" cy="170" rx="17" ry="17" fill="#f5c95a"/>
        <ellipse cx="72" cy="170" rx="11" ry="11" fill="#e0ad33"/>
        <text x="72" y="176" text-anchor="middle" font-size="15" font-weight="800" fill="#fff"
              font-family="Pretendard, Malgun Gothic, sans-serif">₩</text>
      </g>
      <g>
        <ellipse cx="100" cy="199" rx="14" ry="14" fill="#f5c95a"/>
        <ellipse cx="100" cy="199" rx="9" ry="9" fill="#e0ad33"/>
      </g>
      <!-- 상승 화살표 -->
      <path d="M118,140 L150,108" stroke="#1d7050" stroke-width="6" stroke-linecap="round"/>
      <path d="M136,106 h16 v16" stroke="#1d7050" stroke-width="6" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="tag">복리 · 파이어</div>
  <h1>주식이 왜<br /><span class="hl">복리일까?</span></h1>
  <p class="sub">직장인 <b>10억 파이어</b>까지 몇 년인지</p>
  <div class="foot">heelovee.tistory.com</div>
</div>
