<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art {
    width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #dbeafe, #1e3a8a);
    font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
    display: flex; flex-direction: column; justify-content: center; position: relative;
  }
  .badge {
    position: absolute; top: 62px; right: 64px;
    background: rgba(255,255,255,.92); border-radius: 20px;
    padding: 16px 24px; text-align: center; color: #1e3a8a;
    font-size: 34px; font-weight: 800; line-height: 1.1;
  }
  .badge small { display: block; font-size: 15px; font-weight: 700; letter-spacing: .06em; opacity: .7; }
  .tag {
    display: inline-block; align-self: flex-start;
    background: rgba(255,255,255,.85); color: #1e3a8a;
    font-size: 20px; font-weight: 800; letter-spacing: .02em;
    padding: 10px 20px; border-radius: 999px; margin-bottom: 26px;
  }
  h1 { font-size: 72px; font-weight: 900; line-height: 1.22; color: #111827; letter-spacing: -.03em; }
  h1 .hl { color: #fff; }
  .sub { margin-top: 24px; font-size: 27px; font-weight: 600; color: #1f2937; line-height: 1.5; }
  .ico { position: absolute; right: 58px; bottom: 52px; opacity: .42; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 38px; }
  .chips div {
    background: rgba(17,24,39,.35); color: #fff;
    font-size: 21px; font-weight: 700; padding: 11px 20px; border-radius: 10px;
  }
  .foot {
    position: absolute; left: 64px; bottom: 54px;
    font-size: 20px; font-weight: 700; color: rgba(255,255,255,.85); letter-spacing: .04em;
  }
</style>
<div id="art">
  <div class="badge"><small>현금 아님</small>포인트</div>
  <div class="tag">정부 정책 · 지원금</div>
  <h1>첫만남이용권<br /><span class="hl">기한이 두 개다</span></h1>
  <p class="sub">신청 기한과 사용 기한이 따로입니다.<br />미루면 잔액이 환수됩니다</p>
  <div class="chips"><div>신청</div><div>사용처</div><div>쿠팡</div></div>
  <svg class="ico" width="122" height="122" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21s-8-4.6-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6.4-8 11-8 11z" />
  </svg>
  <div class="foot">heelovee.tistory.com</div>
</div>
