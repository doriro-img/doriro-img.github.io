<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #f2f7ea, #d5e6c1);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #253a14;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #4b7226; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #4b7226; }
  .sub { margin-top: 26px; font-size: 25px; color: #66805a; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #4b7226; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 30px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(75,114,38,.13); color: #4b7226; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #93a985; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>배출 방식</small>3가지</div>
  <div class="tag">음식물 종량제</div>
  <h1>RFID와<br /><span class="hl">전용봉투</span></h1>
  <p class="sub">물기가 곧 요금입니다</p>
  <div class="chips"><div>무게 계량</div><div>봉투값</div><div>품목 기준</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
