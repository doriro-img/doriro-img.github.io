<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #f9eef0, #ecd0d6);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #4d2028;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #a83a52; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #a83a52; }
  .sub { margin-top: 26px; font-size: 25px; color: #8a5060; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #a83a52; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 32px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(168,58,82,.12); color: #a83a52; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b58794; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>명절 농수산물</small>두 배</div>
  <div class="tag">청탁금지법</div>
  <h1>명절 선물<br /><span class="hl">가액 한도</span></h1>
  <p class="sub">상품권은 금액과 무관하게 안 됩니다</p>
  <div class="chips"><div>농수산물</div><div>경조사비</div><div>직무관련성</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
