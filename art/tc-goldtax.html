<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;

    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #3d3117;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #7a5f1f; color: #fff;

  .sub b { color: #7a5f1f; }
  .badge { position: absolute; top: 118px; right: 64px; background: #b8443a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 30px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #7a5f1f; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b3a077; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>환차익</small>과세 아님</div>

  <h1>같은 금인데<br /><span class="hl">세금이 다릅니다</span></h1>
  <p class="sub">어떻게 담았느냐가 <b>갈림길</b>입니다</p>
  <div class="chips"><div>실물 부가세</div><div>거래소 금</div><div>금 통장</div><div>해외 ETF</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
