<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef2fa,#c9d4e9);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #242c3d;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #2f4a6b; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 57px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #2f4a6b; }
  .sub { margin-top: 28px; font-size: 25px; color: #5d6580; font-weight: 600; }
  .sub b { color: #2f4a6b; }
  .badge { position: absolute; top: 118px; right: 64px; background: #1d7050; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 30px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #2f4a6b; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #949cb8; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>혜택</small>만기 보유</div>
  <div class="tag">개인투자용 국채</div>
  <h1>중간에 팔면<br /><span class="hl">혜택이 사라져요</span></h1>
  <p class="sub">이자는 <b>만기에 한꺼번에</b> 받습니다</p>
  <div class="chips"><div>가산금리</div><div>연 복리</div><div>분리과세</div><div>월 청약</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
