<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#f3f0fa,#d8d0ee);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #33285c;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #5b4b8a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #5b4b8a; }
  .sub { margin-top: 28px; font-size: 25px; color: #6d6393; font-weight: 600; }
  .sub b { color: #4a3a7d; }
  .badge { position: absolute; top: 116px; right: 64px; background: #5b4b8a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 32px; font-weight: 800; text-align: center; line-height: 1.3; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 5px; }
  .chips { position: absolute; bottom: 110px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 470px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #4a3a7d; }
  .chips .on { background: #5b4b8a; color: #fff; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #a297c4; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>미리 정하려면</small>임의후견<br />뿐</div>
  <div class="tag">치매 대비</div>
  <h1>성년후견제도<br /><span class="hl">네 가지 유형</span></h1>
  <p class="sub">진단 후에는 <b>본인이 못 정합니다</b></p>
  <div class="chips"><div>성년후견</div><div>한정후견</div><div>특정후견</div><div class="on">임의후견</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
