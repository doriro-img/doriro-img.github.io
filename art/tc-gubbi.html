<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #fdf6e3, #f5e3b0);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #4a3a12;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #96700f; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #96700f; }
  .sub { margin-top: 26px; font-size: 25px; color: #7d6a3a; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #96700f; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 32px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(150,112,15,.14); color: #96700f; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #ae9a68; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>이용료</small>무료</div>
  <div class="tag">국민비서</div>
  <h1>행정 알림을<br /><span class="hl">카톡으로</span></h1>
  <p class="sub">문자로 오는 건 국민비서가 아닙니다</p>
  <div class="chips"><div>건강검진</div><div>과태료</div><div>스미싱 구분</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
