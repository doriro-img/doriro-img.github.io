<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #fdf4ea, #f2dcbf);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #4a3418;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #9a6a1e; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #9a6a1e; }
  .sub { margin-top: 26px; font-size: 25px; color: #7f6a44; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #9a6a1e; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 32px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(154,106,30,.13); color: #9a6a1e; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b09873; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>계층별로</small>다름</div>
  <div class="tag">행복주택</div>
  <h1>입주자격과<br /><span class="hl">거주 기간</span></h1>
  <p class="sub">자동차 가액이 복병입니다</p>
  <div class="chips"><div>청년</div><div>신혼부부</div><div>시세 비율</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
