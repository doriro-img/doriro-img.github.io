<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#fdf3e9,#eed6bb);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #3d2a17;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #8a4a1f; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 58px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #b8443a; }
  .sub { margin-top: 28px; font-size: 25px; color: #7d6b5a; font-weight: 600; }
  .sub b { color: #8a4a1f; }
  .badge { position: absolute; top: 118px; right: 64px; background: #b8443a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 34px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #8a4a1f; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b09a80; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>보관</small>말아서</div>
  <div class="tag">전기장판 안전</div>
  <h1>라텍스 위엔<br /><span class="hl">깔면 안 됩니다</span></h1>
  <p class="sub">열이 <b>빠져나가지 못해</b> 쌓입니다</p>
  <div class="chips"><div>접지 말기</div><div>얇은 요 한 겹</div><div>단독 콘센트</div><div>전도 차단</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
