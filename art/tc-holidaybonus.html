<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #fdf1ec, #f2cfc0);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #522d1c;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #a1512b; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #a1512b; }
  .sub { margin-top: 26px; font-size: 25px; color: #8a6047; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #a1512b; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 32px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(161,81,43,.13); color: #a1512b; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b59180; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>비과세</small>아님</div>
  <div class="tag">명절 상여금</div>
  <h1>떡값에도<br /><span class="hl">세금이 붙습니다</span></h1>
  <p class="sub">상품권과 선물세트도 근로소득</p>
  <div class="chips"><div>원천징수</div><div>4대보험</div><div>연말정산</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
