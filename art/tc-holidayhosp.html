<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #e9f4f7, #c3e0e8);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #12343d;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #16626f; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #16626f; }
  .sub { margin-top: 26px; font-size: 25px; color: #4c7681; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #16626f; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 34px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(22,98,111,.12); color: #16626f; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #85a8b1; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>전화 한 통</small>129</div>
  <div class="tag">추석 연휴</div>
  <h1>문 여는<br /><span class="hl">병원 약국</span></h1>
  <p class="sub">연휴 시작 전에 5분만 투자하세요</p>
  <div class="chips"><div>응급의료포털</div><div>달빛어린이</div><div>휴일 가산</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
