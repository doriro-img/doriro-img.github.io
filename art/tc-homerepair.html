<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#fdf8f0,#eee0c8);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #3d2a17;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #5f4a2f; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 57px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #5f4a2f; }
  .sub { margin-top: 28px; font-size: 25px; color: #7d6b5a; font-weight: 600; }
  .sub b { color: #5f4a2f; }
  .badge { position: absolute; top: 118px; right: 64px; background: #1d7050; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 32px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #5f4a2f; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b09a80; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>자가 가구</small>현물 지원</div>
  <div class="tag">주거급여 수선유지</div>
  <h1>내 집 있어도<br /><span class="hl">받을 수 있어요</span></h1>
  <p class="sub">돈이 아니라 <b>집을 고쳐줍니다</b></p>
  <div class="chips"><div>경보수</div><div>중보수</div><div>대보수</div><div>편의시설</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
