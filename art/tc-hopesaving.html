<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eaf9f5,#c6e7de);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1c3a35;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #2f6b5f; color: #fff;

  .sub { margin-top: 28px; font-size: 25px; color: #547069; font-weight: 600; }
  .sub b { color: #2f6b5f; }
  .badge { position: absolute; top: 118px; right: 64px; background: #b8443a; color: #fff;
    border-radius: 26px; padding: 20px 30px; font-size: 40px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #2f6b5f; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #85a89f; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>기간</small>3년</div>
  <div class="tag">희망저축계좌</div>
  <h1>저축만으로는<br /><span class="hl">부족합니다</span></h1>
  <p class="sub">근로 유지와 <b>교육 이수</b>까지 조건이에요</p>
  <div class="chips"><div>두 가지 유형</div><div>적립 중지</div><div>자금사용계획서</div><div>복지로</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
