<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #eaf5fb, #c2dcee);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #143145;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1a5a85; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 52px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1a5a85; }
  .sub { margin-top: 26px; font-size: 25px; color: #4f7692; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #1a5a85; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 32px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(26,90,133,.12); color: #1a5a85; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #88a6bb; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>붙는 혜택</small>3가지</div>
  <div class="tag">청년주택드림</div>
  <h1>청약통장<br /><span class="hl">뭐가 다를까</span></h1>
  <p class="sub">해지하지 말고 전환하세요</p>
  <div class="chips"><div>우대금리</div><div>이자 비과세</div><div>기간 승계</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
