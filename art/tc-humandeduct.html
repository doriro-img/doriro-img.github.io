<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #eef0f9, #cdd2ec);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #21254f;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #3b4390; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #3b4390; }
  .sub { margin-top: 26px; font-size: 25px; color: #626a9c; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #3b4390; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 34px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(59,67,144,.12); color: #3b4390; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #9298bd; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>충족 요건</small>3개</div>
  <div class="tag">연말정산</div>
  <h1>인적공제<br /><span class="hl">넣을 수 있나</span></h1>
  <p class="sub">소득 요건에서 대부분 갈립니다</p>
  <div class="chips"><div>따로 사는 부모</div><div>형제자매</div><div>중복 공제</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
