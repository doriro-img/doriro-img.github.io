<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#f0f7fd,#cadeef);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1a3a4f;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #2f5f8a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 58px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #2f5f8a; }
  .sub { margin-top: 28px; font-size: 25px; color: #587891; font-weight: 600; }
  .sub b { color: #2f5f8a; }
  .badge { position: absolute; top: 118px; right: 64px; background: #1d7050; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 36px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #2f5f8a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #90aac0; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>적정 습도</small>40~60%</div>
  <div class="tag">가습기 관리</div>
  <h1>정수기 물이<br /><span class="hl">더 위험합니다</span></h1>
  <p class="sub">염소가 없어 <b>세균이 빨리</b> 자랍니다</p>
  <div class="chips"><div>매일 물 갈기</div><div>수돗물</div><div>진동자 세척</div><div>살균제 금지</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
