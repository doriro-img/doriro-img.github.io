<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#faf5eb,#e7d8bd);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #4a3616;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #7a5c2e; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #7a5c2e; }
  .sub { margin-top: 28px; font-size: 25px; color: #8a7250; font-weight: 600; }
  .sub b { color: #6b4f22; }
  .badge { position: absolute; top: 116px; right: 64px; background: #7a5c2e; color: #fff;
    border-radius: 26px; padding: 20px 30px; font-size: 40px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .bars { position: absolute; bottom: 108px; left: 64px; display: flex; align-items: flex-end; gap: 12px; height: 110px; }
  .bars i { width: 44px; border-radius: 9px 9px 0 0; display: block; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b09a72; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>최장</small>10년</div>
  <div class="tag">상속세</div>
  <h1>연부연납과<br /><span class="hl">물납 요건</span></h1>
  <p class="sub">현금이 없으면 <b>나눠 냅니다</b></p>
  <div class="bars">
    <i style="height:104px;background:#7a5c2e;"></i>
    <i style="height:52px;background:#b99b6b;"></i>
    <i style="height:52px;background:#c9ae82;"></i>
    <i style="height:52px;background:#d8c19c;"></i>
    <i style="height:52px;background:#e5d3b7;"></i>
    <i style="height:52px;background:#efe2cd;"></i>
  </div>
  <div class="foot">heelovee.tistory.com</div>
</div>
