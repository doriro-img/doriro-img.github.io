<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#edf6fb,#c6dde9);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1c3a45;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #2f5f7a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 58px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #2f5f7a; }
  .sub { margin-top: 28px; font-size: 25px; color: #567480; font-weight: 600; }
  .sub b { color: #2f5f7a; }
  .badge { position: absolute; top: 118px; right: 64px; background: #1d7050; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 32px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #2f5f7a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8aa9b5; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>순서</small>틈새 먼저</div>
  <div class="tag">겨울 창문 단열</div>
  <h1>뽁뽁이보다<br /><span class="hl">문풍지가 먼저</span></h1>
  <p class="sub">바람 새면 <b>덮어도 소용없어요</b></p>
  <div class="chips"><div>휴지 테스트</div><div>볼록면은 유리쪽</div><div>단열 커튼</div><div>현관문 하단</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
