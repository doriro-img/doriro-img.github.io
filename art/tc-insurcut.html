<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef4f8,#cadcea);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #16344a;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #2f5d7c; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #2f5d7c; }
  .sub { margin-top: 28px; font-size: 25px; color: #547b95; font-weight: 600; }
  .sub b { color: #2f5d7c; }
  .badge { position: absolute; top: 116px; right: 64px; background: #c0554a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 32px; font-weight: 800; text-align: center; line-height: 1.3; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 5px; }
  .chips { position: absolute; bottom: 110px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 500px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #2f5d7c; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8fabbe; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>해지하면</small>보장<br />소멸</div>
  <div class="tag">보험료가 부담될 때</div>
  <h1>해지 말고<br /><span class="hl">쓸 수 있는 방법</span></h1>
  <p class="sub">해지는 <b>마지막 선택지</b>입니다</p>
  <div class="chips"><div>감액완납</div><div>감액</div><div>납입유예</div><div>중도인출</div><div>약관대출</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
