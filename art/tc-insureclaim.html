<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #ebf6f0, #c5e2d1);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #143a29;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1c6c48; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 52px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1c6c48; }
  .sub { margin-top: 26px; font-size: 25px; color: #4c7f66; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #1c6c48; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 30px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(28,108,72,.13); color: #1c6c48; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #86ab96; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>회사 동의</small>불필요</div>
  <div class="tag">고용보험</div>
  <h1>피보험자격<br /><span class="hl">확인청구</span></h1>
  <p class="sub">근로자가 직접 신청할 수 있습니다</p>
  <div class="chips"><div>소급 인정</div><div>보수 정정</div><div>실업급여</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
