<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #eef1fa, #ccd6f0);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #1d2650;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #2f3f86; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #2f3f86; }
  .sub { margin-top: 26px; font-size: 25px; color: #5d6795; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #2f3f86; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 30px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(47,63,134,.12); color: #2f3f86; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8d95b8; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>열람만으론</small>불인정</div>
  <div class="tag">실업급여</div>
  <h1>재취업활동<br /><span class="hl">인정기준</span></h1>
  <p class="sub">회차가 갈수록 기준이 올라갑니다</p>
  <div class="chips"><div>입사지원</div><div>직업훈련</div><div>부정수급</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
