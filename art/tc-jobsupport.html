<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef7f3,#c8e3d8);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #123b32;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1d6b5c; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1d6b5c; }
  .sub { margin-top: 28px; font-size: 25px; color: #4d7d72; font-weight: 600; }
  .sub b { color: #16604f; }
  .badge { position: absolute; top: 114px; right: 64px; background: #1d6b5c; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 34px; font-weight: 800; text-align: center; line-height: 1.3; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 5px; }
  .types { position: absolute; bottom: 108px; left: 64px; display: flex; gap: 14px; }
  .types div { width: 176px; border-radius: 20px; padding: 18px 12px; background: #fff; }
  .types .n { font-size: 26px; font-weight: 800; }
  .types .l { font-size: 15px; font-weight: 700; color: #6b7885; margin-top: 6px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #86a89f; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>구직촉진수당</small>월 50만원<br />6개월</div>
  <div class="tag">고용보험 없어도</div>
  <h1>국민취업<br /><span class="hl">지원제도</span></h1>
  <p class="sub">1유형과 2유형이 <b>다릅니다</b></p>
  <div class="types">
    <div><div class="n" style="color:#1d7050;">1유형</div><div class="l">현금 수당 중심</div></div>
    <div><div class="n" style="color:#2f6fb0;">2유형</div><div class="l">취업활동비용</div></div>
  </div>
  <div class="foot">heelovee.tistory.com</div>
</div>
