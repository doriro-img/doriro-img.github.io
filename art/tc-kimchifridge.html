<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#fdf0f3,#efcdd6);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #41262d;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #8a3f4f; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 58px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #8a3f4f; }
  .sub { margin-top: 28px; font-size: 25px; color: #7d6b70; font-weight: 600; }
  .sub b { color: #8a3f4f; }
  .badge { position: absolute; top: 118px; right: 64px; background: #b8443a; color: #fff;
    border-radius: 26px; padding: 20px 30px; font-size: 42px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #8a3f4f; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b995a0; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>채우기</small>80%</div>
  <div class="tag">김장 김치 보관</div>
  <h1>골마지는<br /><span class="hl">공기 탓입니다</span></h1>
  <p class="sub">비닐을 <b>표면에 밀착</b>시켜 덮으세요</p>
  <div class="chips"><div>상온 하루</div><div>눌러 담기</div><div>통 나누기</div><div>마른 도구</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
