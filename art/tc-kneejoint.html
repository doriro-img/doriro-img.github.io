<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#f4faec,#d8e9c4);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2c3720;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #4a6b2f; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 57px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #b8443a; }
  .sub { margin-top: 28px; font-size: 25px; color: #6b7a5c; font-weight: 600; }
  .sub b { color: #4a6b2f; }
  .badge { position: absolute; top: 118px; right: 64px; background: #4a6b2f; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 34px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #4a6b2f; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #97a884; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>대상</small>만 60세</div>
  <div class="tag">무릎 인공관절 지원</div>
  <h1>수술 전에<br /><span class="hl">신청해야 합니다</span></h1>
  <p class="sub">보건소에서 <b>대상자 선정</b> 먼저</p>
  <div class="chips"><div>기초연금 수급자</div><div>진단서 필요</div><div>급여 본인부담</div><div>예산 소진</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
