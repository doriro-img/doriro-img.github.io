<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #eaf1f8, #c7dbee);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #16324d;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1f4a7a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1f4a7a; }
  .sub { margin-top: 26px; font-size: 25px; color: #52708c; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #1f4a7a; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 34px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(31,74,122,.12); color: #1f4a7a; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8ba4bb; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>계약일부터</small>30일</div>
  <div class="tag">전월세 신고</div>
  <h1>주택임대차<br /><span class="hl">신고제 과태료</span></h1>
  <p class="sub">확정일자가 자동으로 따라옵니다</p>
  <div class="chips"><div>금액 변동</div><div>갱신 제외</div><div>거짓 신고</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
