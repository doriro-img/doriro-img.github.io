<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef5fb,#c6dcee);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #16324e;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1f4a7a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 57px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1f4a7a; }
  .sub { margin-top: 28px; font-size: 25px; color: #4d6b8a; font-weight: 600; }
  .sub b { color: #1f4a7a; }
  .badge { position: absolute; top: 118px; right: 64px; background: #1d7050; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 30px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #1f4a7a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8ba4bd; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>조회는</small>점수 무관</div>
  <div class="tag">신용대출 갈아타기</div>
  <h1>앱에서 비교하고<br /><span class="hl">바로 옮깁니다</span></h1>
  <p class="sub">다시 심사라 <b>한도가 줄</b> 수 있어요</p>
  <div class="chips"><div>대환 인프라</div><div>중도상환수수료</div><div>인지세</div><div>우대 조건</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
