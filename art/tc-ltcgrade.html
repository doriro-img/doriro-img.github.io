<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef4f8,#c9dceb);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #16344a;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #2f5d7c; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #2f5d7c; }
  .sub { margin-top: 28px; font-size: 25px; color: #547b95; font-weight: 600; }
  .sub b { color: #2f5d7c; }
  .badge { position: absolute; top: 118px; right: 64px; background: #1f4a7a; color: #fff;
    border-radius: 26px; padding: 20px 30px; font-size: 40px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .bars { position: absolute; bottom: 108px; left: 64px; display: flex; align-items: flex-end; gap: 12px; height: 122px; }
  .bars div { text-align: center; }
  .bars i { width: 46px; border-radius: 9px 9px 0 0; display: block; }
  .bars span { display: block; font-size: 15px; font-weight: 800; color: #4d6b8a; margin-top: 8px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8fabbe; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>1등급 기준</small>95점</div>
  <div class="tag">노인장기요양</div>
  <h1>등급 신청과<br /><span class="hl">판정 점수</span></h1>
  <p class="sub">조사 날 <b>평소 상태</b>를 그대로 알리세요</p>
  <div class="bars">
    <div><i style="height:118px;background:#1f4a7a;"></i><span>1</span></div>
    <div><i style="height:98px;background:#2f6b8a;"></i><span>2</span></div>
    <div><i style="height:80px;background:#4a8aa5;"></i><span>3</span></div>
    <div><i style="height:64px;background:#7fb0cd;"></i><span>4</span></div>
    <div><i style="height:50px;background:#a9cbe0;"></i><span>5</span></div>
    <div><i style="height:40px;background:#cfe0ec;"></i><span>인지</span></div>
  </div>
  <div class="foot">heelovee.tistory.com</div>
</div>
