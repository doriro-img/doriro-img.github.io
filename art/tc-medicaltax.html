<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #eaf6f4, #c4e3de);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #123a36;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #156b62; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #156b62; }
  .sub { margin-top: 26px; font-size: 25px; color: #4b7d77; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #156b62; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 30px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(21,107,98,.13); color: #156b62; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #85aaa5; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>문턱을 넘어야</small>시작</div>
  <div class="tag">의료비 공제</div>
  <h1>안경 렌즈<br /><span class="hl">산후조리원까지</span></h1>
  <p class="sub">실손으로 받은 돈은 빼세요</p>
  <div class="chips"><div>몰아주기</div><div>한도 없는 대상</div><div>간소화 누락</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
