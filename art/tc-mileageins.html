<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eaf7f7,#c2e0e0);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1c3a3a;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1f5f5f; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 57px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #b8443a; }
  .sub { margin-top: 28px; font-size: 25px; color: #547070; font-weight: 600; }
  .sub b { color: #1f5f5f; }
  .badge { position: absolute; top: 118px; right: 64px; background: #1f5f5f; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 32px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #1f5f5f; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #86a5a5; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>사진</small>두 번</div>
  <div class="tag">마일리지 특약</div>
  <h1>사진 안 내면<br /><span class="hl">못 받습니다</span></h1>
  <p class="sub">만기 후 <b>제출 기한</b>이 있어요</p>
  <div class="chips"><div>사후정산형</div><div>선할인형</div><div>계기판 숫자</div><div>특약 중복</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
