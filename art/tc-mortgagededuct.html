<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #eaf0f7, #c5d5e9);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #152e4a;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1c4a7c; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 52px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1c4a7c; }
  .sub { margin-top: 26px; font-size: 25px; color: #50708d; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #1c4a7c; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 30px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(28,74,124,.12); color: #1c4a7c; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #87a1ba; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>충족 요건</small>3갈래</div>
  <div class="tag">주담대 공제</div>
  <h1>이자상환액<br /><span class="hl">소득공제</span></h1>
  <p class="sub">소유자와 채무자가 같아야 합니다</p>
  <div class="chips"><div>기준시가</div><div>고정·비거치</div><div>대환 승계</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
