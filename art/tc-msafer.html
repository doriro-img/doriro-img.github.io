<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #e9f3f9, #c1dcec);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #12334a;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #17587f; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #17587f; }
  .sub { margin-top: 26px; font-size: 25px; color: #4d7590; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #17587f; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 32px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(23,88,127,.12); color: #17587f; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #87a6bb; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>통신사</small>전체</div>
  <div class="tag">명의도용 방지</div>
  <h1>내 이름으로<br /><span class="hl">몇 대나 개통</span></h1>
  <p class="sub">가입제한이 가장 강력합니다</p>
  <div class="chips"><div>현황조회</div><div>가입 통보</div><div>번호도용</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
