<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #f0f6ee, #d0e4c8);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #223a17;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #46702e; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #46702e; }
  .sub { margin-top: 26px; font-size: 25px; color: #62805a; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #46702e; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 30px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(70,112,46,.13); color: #46702e; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #90a888; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>수급자가</small>아니어도</div>
  <div class="tag">차상위계층</div>
  <h1>확인서 하나로<br /><span class="hl">받는 지원</span></h1>
  <p class="sub">자격과 신청은 따로입니다</p>
  <div class="chips"><div>통신비 감면</div><div>문화누리</div><div>에너지</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
