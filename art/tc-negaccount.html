<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef2f7,#c8d5e4);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1a3350;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #334f6d; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #334f6d; }
  .sub { margin-top: 28px; font-size: 25px; color: #56718d; font-weight: 600; }
  .sub b { color: #334f6d; }
  .badge { position: absolute; top: 114px; right: 64px; background: #c0554a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 30px; font-weight: 800; text-align: center; line-height: 1.3; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 5px; }
  .vs { position: absolute; bottom: 104px; left: 64px; display: flex; align-items: center; gap: 18px; }
  .vs div { width: 176px; border-radius: 20px; padding: 20px 12px; background: #fff; text-align: center; }
  .vs .n { font-size: 23px; font-weight: 800; }
  .vs .l { font-size: 15px; font-weight: 700; color: #6b7885; margin-top: 6px; }
  .vs .x { background: none; width: auto; padding: 0; font-size: 26px; font-weight: 800; color: #93a6ba; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #93a6ba; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>안 써도</small>한도 전액<br />DSR 반영</div>
  <div class="tag">대출 고르기</div>
  <h1>마이너스통장<br /><span class="hl">vs 신용대출</span></h1>
  <p class="sub">이자 매기는 <b>방식</b>이 다릅니다</p>
  <div class="vs">
    <div><div class="n" style="color:#334f6d;">쓴 만큼</div><div class="l">마이너스통장</div></div>
    <div class="x">vs</div>
    <div><div class="n" style="color:#1d7050;">전액</div><div class="l">신용대출</div></div>
  </div>
  <div class="foot">heelovee.tistory.com</div>
</div>
