<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eaf9f5,#c4e6dd);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1c3a35;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #2f6b5f; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 57px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #b8443a; }
  .sub { margin-top: 28px; font-size: 25px; color: #547069; font-weight: 600; }
  .sub b { color: #2f6b5f; }
  .badge { position: absolute; top: 118px; right: 64px; background: #2f6b5f; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 32px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #2f6b5f; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #85a89f; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>비누로</small>30초</div>
  <div class="tag">노로바이러스</div>
  <h1>손소독제로는<br /><span class="hl">안 죽습니다</span></h1>
  <p class="sub">추울수록 <b>더 잘 퍼져요</b></p>
  <div class="chips"><div>굴 익혀 먹기</div><div>탈수 예방</div><div>염소 소독</div><div>조리 제외</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
