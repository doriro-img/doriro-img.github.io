<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#faf5eb,#e7d8bd);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #4a3616;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #7a5c2e; color: #fff;

  .sub b { color: #6b4f22; }
  .badge { position: absolute; top: 118px; right: 64px; background: #c0554a; color: #fff;
    border-radius: 26px; padding: 20px 32px; font-size: 44px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 110px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 490px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #5c4520; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b09a72; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>중간예납 기한</small>11/30</div>
  <div class="tag">11월 체크리스트</div>
  <h1>이달에<br /><span class="hl">챙길 것</span></h1>
  <p class="sub">세금 고지서가 <b>몰리는 달</b>입니다</p>
  <div class="chips"><div>종부세 고지</div><div>중간예납</div><div>연말정산 준비</div><div>겨울 점검</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
