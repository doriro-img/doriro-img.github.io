<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #eaf1f8, #c4d8ec);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #16324d;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #2f6fb0; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #2f6fb0; }
  .sub { margin-top: 26px; font-size: 25px; color: #55738f; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #2f6fb0; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 32px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(47,111,176,.13); color: #2f6fb0; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8ba6bf; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>보험료 없이</small>기간 인정</div>
  <div class="tag">국민연금</div>
  <h1>출산·군복무<br /><span class="hl">크레딧 제도</span></h1>
  <p class="sub">실업 크레딧은 그때만 신청됩니다</p>
  <div class="chips"><div>둘째부터</div><div>자동 반영</div><div>소급 불가</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
