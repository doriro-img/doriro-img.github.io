<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #edf1fa, #cbd4ee);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #1e2650;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #364391; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #364391; }
  .sub { margin-top: 26px; font-size: 25px; color: #626a9d; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #364391; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 30px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(54,67,145,.12); color: #364391; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #9299bf; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>보험료</small>전액 본인</div>
  <div class="tag">국민연금</div>
  <h1>소득 없어도<br /><span class="hl">임의가입</span></h1>
  <p class="sub">물가에 따라 조정되는 연금입니다</p>
  <div class="chips"><div>기준소득월액</div><div>최소 가입기간</div><div>임의계속</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
