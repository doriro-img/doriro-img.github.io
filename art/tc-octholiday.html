<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#fdeeeb,#f6cec6);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #5a1d16;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #b8443a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 58px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #b8443a; }
  .sub { margin-top: 28px; font-size: 25px; color: #8a5049; font-weight: 600; }
  .cal { position: absolute; top: 108px; right: 60px; display: grid;
    grid-template-columns: repeat(4, 52px); gap: 7px; }
  .cal div { height: 52px; border-radius: 11px; background: #fff; color: #b58e88;
    font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .cal .on { background: #f3b6ac; color: #7d281f; }
  .cal .hot { background: #b8443a; color: #fff; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b98f88; font-weight: 700; }
</style>
<div id="art">
  <div class="cal">
    <div>1</div><div>2</div><div class="on">3</div><div class="on">4</div>
    <div class="hot">5</div><div>6</div><div>7</div><div>8</div>
    <div class="on">9</div><div class="on">10</div><div class="on">11</div><div>12</div>
  </div>
  <div class="tag">2026 10월</div>
  <h1>개천절 대체공휴일<br /><span class="hl">10월 5일 월요일</span></h1>
  <p class="sub">연차 3일이면 <b>9일 연휴</b>가 됩니다</p>
  <div class="foot">heelovee.tistory.com</div>
</div>
