<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#fdf4e8,#f5dfbe);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #55381a;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #b0701c; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #b0701c; }
  .sub { margin-top: 28px; font-size: 25px; color: #8a6636; font-weight: 600; }
  .sub b { color: #1d7050; }
  .badge { position: absolute; top: 130px; right: 64px; background: #b0701c; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 34px; font-weight: 800; letter-spacing: -1px; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b79a72; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>휴직 기간</small>1년6개월</div>
  <div class="tag">육아휴직</div>
  <h1>육아휴직급여<br /><span class="hl">월 250만원</span></h1>
  <p class="sub">사후지급금 폐지로 매달 전액</p>
  <div class="foot">heelovee.tistory.com</div>
</div>
