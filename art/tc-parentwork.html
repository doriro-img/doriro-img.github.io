<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef7f3,#c8e4d9);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #123b32;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1d6b5c; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1d6b5c; }
  .sub { margin-top: 28px; font-size: 25px; color: #4d7d72; font-weight: 600; }
  .sub b { color: #16604f; }
  .badge { position: absolute; top: 116px; right: 64px; background: #1d6b5c; color: #fff;
    border-radius: 26px; padding: 20px 30px; font-size: 44px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .clock { position: absolute; bottom: 100px; left: 64px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #86a89f; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>최초 10시간</small>100%</div>

  <h1>육아기<br /><span class="hl">근로시간 단축</span></h1>
  <p class="sub">쉬지 않고 <b>최대 3년</b>까지 씁니다</p>
  <svg class="clock" width="252" height="116" viewBox="0 0 252 116">
    <circle cx="56" cy="58" r="48" fill="#fff" stroke="#1d6b5c" stroke-width="5"/>
    <path d="M56 58V26M56 58l24 14" stroke="#1d6b5c" stroke-width="6" stroke-linecap="round"/>
    <path d="M56 10a48 48 0 0136 16" stroke="#f0b429" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M124 58h28M144 48l12 10-12 10" stroke="#1d6b5c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="170" y="24" width="78" height="68" rx="12" fill="#1d6b5c"/>
    <text x="209" y="58" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="21" font-weight="800" fill="#a8d8c9" text-anchor="middle">주 15~35</text>
    <text x="209" y="82" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">시간</text>
  </svg>
  <div class="foot">heelovee.tistory.com</div>
</div>
