<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #fdf5e8, #f0dcb4);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #4b3813;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #8d6410; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #8d6410; }
  .sub { margin-top: 26px; font-size: 25px; color: #7d6a3c; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #8d6410; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 30px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(141,100,16,.13); color: #8d6410; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #ac9764; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>자진납부하면</small>이의 불가</div>
  <div class="tag">주정차 위반</div>
  <h1>과태료<br /><span class="hl">이의신청</span></h1>
  <p class="sub">증거 없이 말로만은 안 통합니다</p>
  <div class="chips"><div>의견진술</div><div>주민신고제</div><div>가산금</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
