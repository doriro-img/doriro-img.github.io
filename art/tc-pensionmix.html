<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef4fa,#c9dcee);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #14304f;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1f4a7a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1f4a7a; }
  .sub { margin-top: 28px; font-size: 25px; color: #4d6b8a; font-weight: 600; }
  .sub b { color: #1f4a7a; }
  .badge { position: absolute; top: 116px; right: 64px; background: #c0554a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 30px; font-weight: 800; text-align: center; line-height: 1.3; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 5px; }
  .bars { position: absolute; bottom: 106px; left: 64px; display: flex; align-items: flex-end; gap: 13px; height: 118px; }
  .bars i { width: 46px; border-radius: 9px 9px 0 0; display: block; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8ba4bd; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>방치하면</small>대기성<br />자금</div>
  <div class="tag">DC형 · IRP</div>
  <h1>퇴직연금 수익률<br /><span class="hl">확인과 변경</span></h1>
  <p class="sub">운용은 <b>내 몫</b>입니다</p>
  <div class="bars">
    <i style="height:22px;background:#c0554a;"></i>
    <i style="height:36px;background:#d98a4a;"></i>
    <i style="height:56px;background:#e8b34a;"></i>
    <i style="height:80px;background:#7fb0cd;"></i>
    <i style="height:112px;background:#1f4a7a;"></i>
  </div>
  <div class="foot">heelovee.tistory.com</div>
</div>
