<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eaf8f8,#c2e2e2);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1c3a3a;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1f6b6b; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 58px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1f6b6b; }
  .sub { margin-top: 28px; font-size: 25px; color: #547070; font-weight: 600; }
  .sub b { color: #1f6b6b; }
  .badge { position: absolute; top: 118px; right: 64px; background: #c0554a; color: #fff;
    border-radius: 26px; padding: 20px 30px; font-size: 42px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #1f6b6b; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #85a5a5; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>평생</small>1회</div>
  <div class="tag">폐렴구균 접종</div>
  <h1>65세 넘으면<br /><span class="hl">보건소에서 무료</span></h1>
  <p class="sub">독감 주사와 <b>같은 날</b>도 됩니다</p>
  <div class="chips"><div>신분증만</div><div>소득 무관</div><div>동시 접종</div><div>접종도우미</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
