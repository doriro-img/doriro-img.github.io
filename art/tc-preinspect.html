<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#f4f9ec,#d5e6bd);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2c3720;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #4a5f2f; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 58px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #4a5f2f; }
  .sub { margin-top: 28px; font-size: 25px; color: #6b7a5c; font-weight: 600; }
  .sub b { color: #4a5f2f; }
  .badge { position: absolute; top: 118px; right: 64px; background: #b8443a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 32px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #4a5f2f; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #97a884; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>접수</small>서면으로</div>
  <div class="tag">아파트 사전점검</div>
  <h1>말로 하면<br /><span class="hl">안 남습니다</span></h1>
  <p class="sub">사진이 <b>보수 확인</b>의 기준입니다</p>
  <div class="chips"><div>마스킹테이프</div><div>손전등</div><div>줄자 실측</div><div>충전기</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
