<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef4fa,#c9dcee);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #14304f;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1f4a7a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1f4a7a; }
  .sub { margin-top: 28px; font-size: 25px; color: #4d6b8a; font-weight: 600; }
  .sub b { color: #1f4a7a; }
  .badge { position: absolute; top: 118px; right: 64px; background: #1d7050; color: #fff;
    border-radius: 26px; padding: 20px 30px; font-size: 42px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .bars { position: absolute; bottom: 110px; left: 64px; display: flex; align-items: flex-end; gap: 16px; height: 118px; }
  .bars div { text-align: center; }
  .bars i { width: 52px; border-radius: 10px 10px 0 0; display: block; }
  .bars span { display: block; font-size: 16px; font-weight: 800; color: #4d6b8a; margin-top: 8px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8ba4bd; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>3년 지나면</small>0원</div>
  <div class="tag">대출 조기상환</div>
  <h1>중도상환수수료<br /><span class="hl">계산과 면제</span></h1>
  <p class="sub">갚는 <b>시점</b>에 따라 확 달라집니다</p>
  <div class="bars">
    <div><i style="height:110px;background:#c0554a;"></i><span>1년</span></div>
    <div><i style="height:74px;background:#d98a4a;"></i><span>2년</span></div>
    <div><i style="height:38px;background:#e8b34a;"></i><span>3년</span></div>
    <div><i style="height:10px;background:#9dd3c5;"></i><span>이후</span></div>
  </div>
  <div class="foot">heelovee.tistory.com</div>
</div>
