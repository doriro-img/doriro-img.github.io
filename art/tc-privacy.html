<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #eceff6, #c9cfe2);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #1f2637;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #38455f; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #38455f; }
  .sub { margin-top: 26px; font-size: 25px; color: #616b83; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #38455f; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 32px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(56,69,95,.12); color: #38455f; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #939aad; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>조회는</small>무료</div>
  <div class="tag">개인정보</div>
  <h1>내 계정<br /><span class="hl">털렸는지 확인</span></h1>
  <p class="sub">메일 계정이 제일 중요합니다</p>
  <div class="chips"><div>유출 조회</div><div>2단계 인증</div><div>안심차단</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
