<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #eaf7f0, #c2e6d3);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #123825;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1a7a4e; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1a7a4e; }
  .sub { margin-top: 26px; font-size: 25px; color: #4b8064; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #1a7a4e; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 30px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(26,122,78,.13); color: #1a7a4e; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #86ae97; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>애매하면</small>종량제</div>
  <div class="tag">명절 쓰레기</div>
  <h1>스티로폼<br /><span class="hl">아이스팩 보냉백</span></h1>
  <p class="sub">젤 타입은 뜯지 마세요</p>
  <div class="chips"><div>재질 분리</div><div>수거 일정</div><div>과태료</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
