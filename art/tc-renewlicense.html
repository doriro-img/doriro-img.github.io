<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #eef4fa, #cbdcee);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #17325a;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #23508c; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #23508c; }
  .sub { margin-top: 26px; font-size: 25px; color: #536d95; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #23508c; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 30px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(35,80,140,.12); color: #23508c; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8fa4c0; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>방치하면</small>면허 취소</div>
  <div class="tag">운전면허</div>
  <h1>적성검사와<br /><span class="hl">면허 갱신</span></h1>
  <p class="sub">1종과 2종은 절차가 다릅니다</p>
  <div class="chips"><div>신체검사</div><div>과태료</div><div>영문 병기</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
