<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#edf8fa,#c5e2e9);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1c3a40;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #2f6b7a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 57px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #b8443a; }
  .sub { margin-top: 28px; font-size: 25px; color: #557480; font-weight: 600; }
  .sub b { color: #2f6b7a; }
  .badge { position: absolute; top: 118px; right: 64px; background: #2f6b7a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 32px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #2f6b7a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #88aab3; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>의무기간</small>3~5년</div>
  <div class="tag">렌탈 중도 해지</div>
  <h1>자동이체만 끊으면<br /><span class="hl">연체가 쌓입니다</span></h1>
  <p class="sub">위약금 · 철거비 · 등록비가 <b>따로</b></p>
  <div class="chips"><div>이전 설치</div><div>명의 변경</div><div>일시불 전환</div><div>청약철회</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
