<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#fdf1f4,#eecfd6);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #3d2630;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #7a3f4a; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 57px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #b8443a; }
  .sub { margin-top: 28px; font-size: 25px; color: #7d6b6e; font-weight: 600; }
  .sub b { color: #7a3f4a; }
  .badge { position: absolute; top: 118px; right: 64px; background: #b8443a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 30px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #7a3f4a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #b995a0; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>해지해도</small>잔액 남음</div>
  <div class="tag">카드 리볼빙</div>
  <h1>할부가 아니라<br /><span class="hl">이자입니다</span></h1>
  <p class="sub">끝나는 시점이 <b>없는 구조</b>예요</p>
  <div class="chips"><div>결제 비율</div><div>이월 잔액</div><div>한도 차지</div><div>신용평가</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
