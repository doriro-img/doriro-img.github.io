<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#fdf2f5,#eecfd8);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #5c2634;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #a8546b; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #a8546b; }
  .sub { margin-top: 28px; font-size: 25px; color: #8a5f6b; font-weight: 600; }
  .sub b { color: #96455c; }
  .badge { position: absolute; top: 116px; right: 64px; background: #1d7050; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 32px; font-weight: 800; text-align: center; line-height: 1.3; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 5px; }
  .steps { position: absolute; bottom: 108px; left: 64px; display: flex; align-items: center; gap: 10px; }
  .steps div { background: #fff; border-radius: 16px; padding: 14px 18px; font-size: 18px; font-weight: 800; color: #7d3a4c; }
  .steps span { font-size: 20px; color: #d9b4c0; font-weight: 800; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #bb8f9c; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>직업훈련</small>무료<br />수강</div>
  <div class="tag">새일센터</div>
  <h1>경력단절 이후<br /><span class="hl">다시 시작하기</span></h1>
  <p class="sub">나이 제한이 <b>없습니다</b></p>
  <div class="steps">
    <div>상담</div><span>→</span><div>훈련</div><span>→</span><div>인턴</div><span>→</span><div>취업</div>
  </div>
  <div class="foot">heelovee.tistory.com</div>
</div>
