<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef2f7,#c8d5e4);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1a3350;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #334f6d; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #334f6d; }
  .sub { margin-top: 28px; font-size: 25px; color: #56718d; font-weight: 600; }
  .sub b { color: #334f6d; }
  .badge { position: absolute; top: 118px; right: 64px; background: #1d7050; color: #fff;
    border-radius: 26px; padding: 20px 30px; font-size: 32px; font-weight: 800; text-align: center; line-height: 1.3; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 5px; }
  .steps { position: absolute; bottom: 106px; left: 64px; display: flex; align-items: center; gap: 10px; }
  .steps div { background: #fff; border-radius: 16px; padding: 14px 16px; font-size: 17px; font-weight: 800; color: #22405c; }
  .steps span { font-size: 20px; color: #93a6ba; font-weight: 800; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #93a6ba; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>아끼는 건</small>법무사<br />보수</div>
  <div class="tag">소유권이전</div>
  <h1>셀프등기<br /><span class="hl">준비물과 순서</span></h1>
  <p class="sub">대출을 끼면 <b>어려워집니다</b></p>
  <div class="steps">
    <div>서류 수령</div><span>→</span><div>취득세</div><span>→</span><div>채권</div><span>→</span><div>등기소</div>
  </div>
  <div class="foot">heelovee.tistory.com</div>
</div>
