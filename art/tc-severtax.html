<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #eef1f7, #cdd4e6);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #22284a;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #3a4480; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 52px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #3a4480; }
  .sub { margin-top: 26px; font-size: 25px; color: #5a628f; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #3a4480; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 30px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(58,68,128,.12); color: #3a4480; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #9198bb; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>계산 방식</small>연분연승</div>
  <div class="tag">퇴직 세금</div>
  <h1>퇴직소득세<br /><span class="hl">근속연수공제</span></h1>
  <p class="sub">오래 다닐수록 세금이 줄어듭니다</p>
  <div class="chips"><div>환산급여</div><div>중간정산</div><div>과세이연</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
