<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#f0f2f7,#ccd2e0);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #26303f;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #3f4a5f; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 57px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #3f4a5f; }
  .sub { margin-top: 28px; font-size: 25px; color: #62707f; font-weight: 600; }
  .sub b { color: #3f4a5f; }
  .badge { position: absolute; top: 118px; right: 64px; background: #b8443a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 38px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #3f4a5f; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #949cad; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>상담</small>1372</div>
  <div class="tag">미배송 대응</div>
  <h1>계좌이체만 받으면<br /><span class="hl">거르세요</span></h1>
  <p class="sub">카드 결제라야 <b>이의제기</b>가 됩니다</p>
  <div class="chips"><div>발송 기한</div><div>에스크로</div><div>할부항변권</div><div>경찰 신고</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
