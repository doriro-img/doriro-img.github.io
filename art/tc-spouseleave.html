<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;

    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1a3540;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1f5f7a; color: #fff;

  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #1f5f7a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8aa8b3; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>기준</small>출산일</div>

  <h1>기한 넘기면<br /><span class="hl">권리가 사라져요</span></h1>
  <p class="sub">청구는 <b>서면으로</b> 남기세요</p>
  <div class="chips"><div>유급 휴가</div><div>분할 사용</div><div>고용24 신청</div><div>거부 시 과태료</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
