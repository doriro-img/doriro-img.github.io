<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef6fb,#c7dded);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #22333f;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #2f5f7a; color: #fff;

  h1 .hl { color: #2f5f7a; }
  .sub { margin-top: 28px; font-size: 25px; color: #5c7280; font-weight: 600; }
  .sub b { color: #2f5f7a; }
  .badge { position: absolute; top: 118px; right: 64px; background: #1d7050; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 30px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #2f5f7a; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8ba5b3; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>보험료</small>정부 지원</div>
  <div class="tag">풍수해보험</div>
  <h1>대설과 지진도<br /><span class="hl">보장됩니다</span></h1>
  <p class="sub">재난지원금보다 <b>보상이 큽니다</b></p>
  <div class="chips"><div>주택·온실</div><div>세입자 가능</div><div>보장 개시일</div><div>주민센터 문의</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
