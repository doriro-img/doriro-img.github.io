<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #edf7f2, #c7e6d8);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #123a2c;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #17694c; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #17694c; }
  .sub { margin-top: 26px; font-size: 25px; color: #4b7c68; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #17694c; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 34px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(23,105,76,.13); color: #17694c; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #85ab9a; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>이자소득세</small>0원</div>
  <div class="tag">절세 통장</div>
  <h1>비과세<br /><span class="hl">종합저축</span></h1>
  <p class="sub">지정하지 않으면 적용되지 않습니다</p>
  <div class="chips"><div>만 65세</div><div>합산 한도</div><div>종합과세 제외</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
