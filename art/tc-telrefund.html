<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #eaf6f8, #c2e0e6);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #123840;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #146470; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #146470; }
  .sub { margin-top: 26px; font-size: 25px; color: #4a7a82; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #146470; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 30px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(20,100,112,.13); color: #146470; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #83a9af; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>조회는</small>무료</div>
  <div class="tag">통신 미환급금</div>
  <h1>잠자는 내 돈<br /><span class="hl">찾아오기</span></h1>
  <p class="sub">소멸시효가 지나면 못 받습니다</p>
  <div class="chips"><div>과오납</div><div>가입 보증금</div><div>일할 정산</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
