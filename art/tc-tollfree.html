<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #edf7ef, #c6e4cd);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #14392233;
    color: #143922;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #22683d; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #22683d; }
  .sub { margin-top: 26px; font-size: 25px; color: #4f7a5e; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #22683d; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 34px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(34,104,61,.13); color: #22683d; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #87ab93; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>지정 기간</small>0원</div>
  <div class="tag">추석 연휴</div>
  <h1>고속도로<br /><span class="hl">통행료 면제</span></h1>
  <p class="sub">하이패스는 단말기를 켜두세요</p>
  <div class="chips"><div>차종 무관</div><div>민자 노선</div><div>미납 정정</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
