<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef6f8,#c8dde3);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #22333a;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #3f5f6b; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 58px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #b8443a; }
  .sub { margin-top: 28px; font-size: 25px; color: #5c7178; font-weight: 600; }
  .sub b { color: #3f5f6b; }
  .badge { position: absolute; top: 118px; right: 64px; background: #3f5f6b; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 32px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #3f5f6b; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #8ba5ad; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>세차 후</small>10분 주행</div>
  <div class="tag">겨울 하부세차</div>
  <h1>염화칼슘이<br /><span class="hl">차를 갉아먹어요</span></h1>
  <p class="sub">겉만 닦으면 <b>소용없습니다</b></p>
  <div class="chips"><div>낮 시간 세차</div><div>문틈 물기</div><div>브레이크 고착</div><div>언더코팅</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
