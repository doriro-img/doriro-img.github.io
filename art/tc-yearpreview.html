<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#f2f0fd,#d2cbef);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2b2350;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #4a3f8f; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 57px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #4a3f8f; }
  .sub { margin-top: 28px; font-size: 25px; color: #6b6294; font-weight: 600; }
  .sub b { color: #4a3f8f; }
  .badge { position: absolute; top: 118px; right: 64px; background: #c0554a; color: #fff;
    border-radius: 26px; padding: 20px 28px; font-size: 38px; font-weight: 800; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { position: absolute; bottom: 108px; left: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 520px; }
  .chips div { background: #fff; border-radius: 15px; padding: 12px 20px; font-size: 19px;
    font-weight: 800; color: #4a3f8f; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #9a93bd; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>실적</small>1~9월</div>
  <div class="tag">연말정산 미리보기</div>
  <h1>남은 두 달을<br /><span class="hl">쓰려면 지금</span></h1>
  <p class="sub">총급여부터 <b>올해 기준</b>으로 고치세요</p>
  <div class="chips"><div>공제 문턱</div><div>체크카드 전환</div><div>맞벌이 비교</div><div>홈택스</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
