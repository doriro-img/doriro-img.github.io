<!doctype html>
<meta charset="utf-8" />
<style>

  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #a893b5; font-weight: 700; }

  <div class="chips"><div>자립수당</div><div>자립정착금</div><div>디딤씨앗통장</div><div>전세임대</div><div>의료·교육</div></div>
