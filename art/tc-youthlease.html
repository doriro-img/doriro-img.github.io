<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg, #e9f2fa, #c2d9ef);
    font-family: 'Pretendard','Malgun Gothic',sans-serif; color: #14304f;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1d5288; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 32px; }
  h1 { font-size: 54px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1d5288; }
  .sub { margin-top: 26px; font-size: 25px; color: #51738f; font-weight: 600; }
  .badge { position: absolute; top: 126px; right: 64px; background: #1d5288; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 30px; font-weight: 800; letter-spacing: -1px; text-align: center; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chips div { background: rgba(29,82,136,.12); color: #1d5288; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 22px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #89a3bd; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>목돈 없이</small>전세</div>
  <div class="tag">청년 주거</div>
  <h1>청년<br /><span class="hl">전세임대주택</span></h1>
  <p class="sub">집은 본인이 직접 찾습니다</p>
  <div class="chips"><div>권리 분석</div><div>순위</div><div>전세금 상한</div></div>
  <div class="foot">heelovee.tistory.com</div>
</div>
