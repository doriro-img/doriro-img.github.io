<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eef1f7,#cdd4e6);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #22284a;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #3a4480; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #3a4480; }
  .sub { margin-top: 28px; font-size: 25px; color: #5a628f; font-weight: 600; }
  .sub b { color: #1d7050; }
  .badge { position: absolute; top: 130px; right: 64px; background: #3a4480; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 34px; font-weight: 800; letter-spacing: -1px; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #9198bb; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>2025년 평균</small>3.7%</div>
  <div class="tag">퇴직연금</div>
  <h1>디폴트옵션<br /><span class="hl">방치하면 자동지정</span></h1>
  <p class="sub">평균 수익률 3.7%인 이유</p>
  <div class="foot">heelovee.tistory.com</div>
</div>
