<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 800px; height: 800px; padding: 74px 64px;
    background: linear-gradient(160deg,#eaf6ef,#c8e6d5);
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #143a2a;
    display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tag { display: inline-block; align-self: flex-start; background: #1d7050; color: #fff;
    font-size: 21px; font-weight: 800; padding: 10px 22px; border-radius: 30px; margin-bottom: 34px; }
  h1 { font-size: 56px; line-height: 1.2; letter-spacing: -2px; font-weight: 800; }
  h1 .hl { color: #1d7050; }
  .sub { margin-top: 28px; font-size: 25px; color: #4d7d66; font-weight: 600; }
  .sub b { color: #1d7050; }
  .badge { position: absolute; top: 130px; right: 64px; background: #1d7050; color: #fff;
    border-radius: 26px; padding: 18px 30px; font-size: 34px; font-weight: 800; letter-spacing: -1px; }
  .badge small { display: block; font-size: 17px; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .foot { position: absolute; bottom: 56px; right: 64px; font-size: 20px; color: #86a897; font-weight: 700; }
</style>
<div id="art">
  <div class="badge"><small>온라인 수수료</small>0원</div>
  <div class="tag">정부24</div>
  <h1>인감증명서<br /><span class="hl">인터넷 발급</span></h1>
  <p class="sub">되는 용도와 안 되는 용도</p>
  <div class="foot">heelovee.tistory.com</div>
</div>
