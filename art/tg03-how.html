<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f9f7f1;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2a3142; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #8a8578; margin-bottom: 18px; font-weight: 600; }
  .two { display: flex; gap: 16px; }
  .panel { flex: 1; background: #fff; border-radius: 16px; padding: 16px 18px; text-align: center;
    box-shadow: 0 5px 14px rgba(90,100,130,.07); border: 2px solid #eeeae0; }
  .panel.fest { border-color: #7fa8d8; }
  .panel.mourn { border-color: #b9bec7; }
  .ph { font-size: 16px; font-weight: 800; margin-bottom: 2px; }
  .ph small { display: block; font-size: 12px; color: #9a9482; font-weight: 600; margin-top: 2px; }
  .scene { height: 168px; display: flex; align-items: center; justify-content: center; }
  .tags { font-size: 12.5px; color: #6a7180; margin-top: 6px; }
  .fest .ph { color: #0047a0; } .mourn .ph { color: #6a7180; }
  .note { margin-top: 16px; background: #eef1f6; border-radius: 12px; padding: 13px 18px; font-size: 13.5px;
    color: #3a4356; line-height: 1.6; text-align: center; }
  .note b { color: #2a3142; }
</style>

<div id="art">
  <h1>광복절은 '경축일' — 깃봉 끝까지 올려 달아요</h1>
  <p class="sub">조기(弔旗)를 다는 날과 높이가 달라요. 헷갈리기 쉬운 부분이에요</p>

  <div class="two">
    <div class="panel fest">
      <div class="ph">경축일<small>광복절 · 3·1절 · 제헌절 · 개천절 · 한글날</small></div>
      <div class="scene">
        <svg width="150" height="168" viewBox="0 0 150 168">
          <circle cx="45" cy="16" r="6" fill="#c9a24b"/>
          <line x1="45" y1="20" x2="45" y2="164" stroke="#9a9482" stroke-width="5"/>
          <!-- 깃봉 바로 아래 태극기 -->
          <g transform="translate(48,22)"><rect x="0" y="0" width="84" height="56" fill="#fff" stroke="#e2ded4" stroke-width="1.5"/>
            <g transform="translate(42,28) scale(0.27) translate(-150,-100)"><g transform="rotate(25.75 150 100)"><circle cx="150" cy="100" r="40" fill="#cd2e3a"/><path d="M110,100 A40,40 0 0,0 190,100 Z" fill="#0047a0"/><circle cx="130" cy="100" r="20" fill="#cd2e3a"/><circle cx="170" cy="100" r="20" fill="#0047a0"/></g>
              <g fill="#111319"><g transform="translate(70,52) rotate(-45)"><rect x="-18" y="-13" width="36" height="6"/><rect x="-18" y="-3" width="36" height="6"/><rect x="-18" y="7" width="36" height="6"/></g>
                <g transform="translate(230,148) rotate(-45)"><rect x="-18" y="-13" width="15" height="6"/><rect x="3" y="-13" width="15" height="6"/><rect x="-18" y="-3" width="15" height="6"/><rect x="3" y="-3" width="15" height="6"/><rect x="-18" y="7" width="15" height="6"/><rect x="3" y="7" width="15" height="6"/></g></g></g></g>
          <path d="M96,90 l8,-8 8,8" fill="none" stroke="#3f8a52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="104" y="112" text-anchor="middle" font-size="12" font-weight="800" fill="#3f8a52">끝까지</text>
        </svg>
      </div>
      <div class="tags">깃봉과 깃면 사이를 <b style="color:#0047a0">붙여서</b> 답니다</div>
    </div>

    <div class="panel mourn">
      <div class="ph">조의일 (조기)<small>현충일 · 국가장 등</small></div>
      <div class="scene">
        <svg width="150" height="168" viewBox="0 0 150 168">
          <circle cx="45" cy="16" r="6" fill="#c9a24b"/>
          <line x1="45" y1="20" x2="45" y2="164" stroke="#9a9482" stroke-width="5"/>
          <!-- 세로너비만큼 내림 -->
          <line x1="45" y1="22" x2="45" y2="78" stroke="#c7ccd4" stroke-width="2" stroke-dasharray="4 3"/>
          <g transform="translate(48,78)"><rect x="0" y="0" width="84" height="56" fill="#fff" stroke="#e2ded4" stroke-width="1.5"/>
            <g transform="translate(42,28) scale(0.27) translate(-150,-100)"><g transform="rotate(25.75 150 100)"><circle cx="150" cy="100" r="40" fill="#cd2e3a"/><path d="M110,100 A40,40 0 0,0 190,100 Z" fill="#0047a0"/><circle cx="130" cy="100" r="20" fill="#cd2e3a"/><circle cx="170" cy="100" r="20" fill="#0047a0"/></g>
              <g fill="#111319"><g transform="translate(70,52) rotate(-45)"><rect x="-18" y="-13" width="36" height="6"/><rect x="-18" y="-3" width="36" height="6"/><rect x="-18" y="7" width="36" height="6"/></g></g></g></g>
          <text x="104" y="54" text-anchor="middle" font-size="12" font-weight="800" fill="#8a8f9a">세로너비</text>
          <text x="104" y="68" text-anchor="middle" font-size="12" font-weight="800" fill="#8a8f9a">만큼 ↓</text>
        </svg>
      </div>
      <div class="tags">깃면 <b>세로 길이만큼 내려서</b> 답니다</div>
    </div>
  </div>

  <div class="note"><b>광복절은 경축일</b>이에요. 조기로 달지 말고 <b>깃봉 끝까지</b> 올려 다는 게 맞아요</div>
</div>
