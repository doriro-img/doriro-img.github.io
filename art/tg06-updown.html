<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f9f7f1;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2a3142; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #8a8578; margin-bottom: 18px; font-weight: 600; }
  .two { display: flex; gap: 16px; }
  .panel { flex: 1; background: #fff; border-radius: 16px; padding: 16px; text-align: center;
    box-shadow: 0 5px 14px rgba(90,100,130,.07); border: 2px solid #eeeae0; }
  .panel.ok { border-color: #7fb98a; }
  .panel.no { border-color: #e0a0a0; }
  .flag { display: flex; justify-content: center; margin-bottom: 10px; }
  .badge { display: inline-block; font-size: 15px; font-weight: 800; padding: 5px 16px; border-radius: 20px; margin-bottom: 8px; }
  .ok .badge { background: #e6f2e8; color: #3f8a52; }
  .no .badge { background: #f7e6e6; color: #c0392b; }
  .panel p { font-size: 13.5px; color: #5a6072; line-height: 1.5; }
  .panel p b { color: #2a3142; }
  .tip { margin-top: 16px; background: #eef1f6; border-radius: 12px; padding: 14px 18px; font-size: 13.5px;
    color: #3a4356; line-height: 1.6; text-align: center; }
  .tip b { color: #0047a0; }
</style>

<div id="art">
  <h1>혹시 태극기, 거꾸로 달고 있진 않나요?</h1>
  <p class="sub">2026 광복절엔 인천시 현수막·송도 불꽃축제에서도 '거꾸로 태극기' 논란이 있었어요</p>

  <div class="two">
    <div class="panel ok">
      <div class="flag">
        <svg width="230" height="153" viewBox="0 0 300 200">
          <rect x="0" y="0" width="300" height="200" rx="4" fill="#ffffff" stroke="#e2ded4" stroke-width="2"/>
          <g transform="rotate(25.75 150 100)"><circle cx="150" cy="100" r="40" fill="#cd2e3a"/>
            <path d="M110,100 A40,40 0 0,0 190,100 Z" fill="#0047a0"/>
            <circle cx="130" cy="100" r="20" fill="#cd2e3a"/><circle cx="170" cy="100" r="20" fill="#0047a0"/></g>
          <g fill="#111319">
            <g transform="translate(70,52) rotate(-45)"><rect x="-18" y="-13" width="36" height="6"/><rect x="-18" y="-3" width="36" height="6"/><rect x="-18" y="7" width="36" height="6"/></g>
            <g transform="translate(230,52) rotate(45)"><rect x="-18" y="-13" width="15" height="6"/><rect x="3" y="-13" width="15" height="6"/><rect x="-18" y="-3" width="36" height="6"/><rect x="-18" y="7" width="15" height="6"/><rect x="3" y="7" width="15" height="6"/></g>
            <g transform="translate(70,148) rotate(45)"><rect x="-18" y="-13" width="36" height="6"/><rect x="-18" y="-3" width="15" height="6"/><rect x="3" y="-3" width="15" height="6"/><rect x="-18" y="7" width="36" height="6"/></g>
            <g transform="translate(230,148) rotate(-45)"><rect x="-18" y="-13" width="15" height="6"/><rect x="3" y="-13" width="15" height="6"/><rect x="-18" y="-3" width="15" height="6"/><rect x="3" y="-3" width="15" height="6"/><rect x="-18" y="7" width="15" height="6"/><rect x="3" y="7" width="15" height="6"/></g>
          </g>
        </svg>
      </div>
      <div class="badge">○ 올바름</div>
      <p>빨강(양)이 <b>위</b> · 왼쪽 위 = <b>건(막대 3개)</b></p>
    </div>

    <div class="panel no">
      <div class="flag">
        <svg width="230" height="153" viewBox="0 0 300 200">
          <rect x="0" y="0" width="300" height="200" rx="4" fill="#ffffff" stroke="#e2ded4" stroke-width="2"/>
          <g transform="rotate(180 150 100)">
            <g transform="rotate(25.75 150 100)"><circle cx="150" cy="100" r="40" fill="#cd2e3a"/>
              <path d="M110,100 A40,40 0 0,0 190,100 Z" fill="#0047a0"/>
              <circle cx="130" cy="100" r="20" fill="#cd2e3a"/><circle cx="170" cy="100" r="20" fill="#0047a0"/></g>
            <g fill="#111319">
              <g transform="translate(70,52) rotate(-45)"><rect x="-18" y="-13" width="36" height="6"/><rect x="-18" y="-3" width="36" height="6"/><rect x="-18" y="7" width="36" height="6"/></g>
              <g transform="translate(230,52) rotate(45)"><rect x="-18" y="-13" width="15" height="6"/><rect x="3" y="-13" width="15" height="6"/><rect x="-18" y="-3" width="36" height="6"/><rect x="-18" y="7" width="15" height="6"/><rect x="3" y="7" width="15" height="6"/></g>
              <g transform="translate(70,148) rotate(45)"><rect x="-18" y="-13" width="36" height="6"/><rect x="-18" y="-3" width="15" height="6"/><rect x="3" y="-3" width="15" height="6"/><rect x="-18" y="7" width="36" height="6"/></g>
              <g transform="translate(230,148) rotate(-45)"><rect x="-18" y="-13" width="15" height="6"/><rect x="3" y="-13" width="15" height="6"/><rect x="-18" y="-3" width="15" height="6"/><rect x="3" y="-3" width="15" height="6"/><rect x="-18" y="7" width="15" height="6"/><rect x="3" y="7" width="15" height="6"/></g>
            </g>
          </g>
        </svg>
      </div>
      <div class="badge">✕ 거꾸로</div>
      <p>빨강이 <b>아래</b>로 · 왼쪽 위 = <b>곤(6조각)</b></p>
    </div>
  </div>

  <div class="tip">쉬운 구별법 — 왼쪽 위를 보세요. <b>막대 3개(건 ☰, 하늘)</b>가 있고 <b>빨강이 위</b>면 정방향이에요</div>
</div>
