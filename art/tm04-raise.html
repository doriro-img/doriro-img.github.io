<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f2f6fc;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1a2b47; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6f7d95; margin-bottom: 20px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .it { background: #fff; border-radius: 13px; padding: 15px 16px; display: flex; align-items: center; gap: 13px;
    box-shadow: 0 5px 13px rgba(40,70,140,.06); }
  .it.wide { grid-column: 1 / 3; }
  .ic { flex: none; width: 40px; height: 40px; border-radius: 10px; background: #e7f2ec; display: flex; align-items: center; justify-content: center; }
  .tx { font-size: 14px; line-height: 1.4; color: #35476a; }
  .tx b { color: #1a2b47; }
</style>

<div id="art">
  <h1>점수 올리는 법 (제가 97점 만든 습관)</h1>
  <p class="sub">별거 없어요. 급하게 조작하는 것만 줄여도 확 올라가요</p>

  <div class="grid">
    <div class="it"><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24"><rect x="2" y="9" width="8" height="7" rx="2" fill="#1f8a5c"/><rect x="14" y="9" width="8" height="7" rx="2" fill="#37a877"/><path d="M11,12 h2" stroke="#1f8a5c" stroke-width="2"/></svg></div><div class="tx"><b>안전거리 확보</b><br />앞차 급정거에 안 놀라게</div></div>
    <div class="it"><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#1f8a5c" stroke-width="2.5"/><path d="M12,12 l0,-5" stroke="#1f8a5c" stroke-width="2.5" stroke-linecap="round"/><path d="M12,12 l4,3" stroke="#37a877" stroke-width="2.5" stroke-linecap="round"/></svg></div><div class="tx"><b>부드럽게 출발</b><br />페달 꾹 말고 살살</div></div>
    <div class="it"><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#fff" stroke="#1f8a5c" stroke-width="2"/><text x="12" y="16" text-anchor="middle" font-size="9" font-weight="800" fill="#1f8a5c">50</text></svg></div><div class="tx"><b>제한속도 준수</b><br />과속은 바로 감점</div></div>
    <div class="it"><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M5,20 Q5,8 14,8 L19,8" fill="none" stroke="#1f8a5c" stroke-width="2.5" stroke-linecap="round"/><path d="M16,5 l4,3 -4,3" fill="none" stroke="#37a877" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="tx"><b>미리 감속</b><br />커브·교차로 앞 예측운전</div></div>
    <div class="it wide"><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M3,17 h18" stroke="#37a877" stroke-width="2.5" stroke-linecap="round"/><rect x="5" y="9" width="14" height="6" rx="2" fill="#1f8a5c"/><circle cx="8" cy="17" r="2.5" fill="#1a2b47"/><circle cx="16" cy="17" r="2.5" fill="#1a2b47"/></svg></div><div class="tx"><b>최근 6개월 500km 이상 주행해야</b> 점수가 인정돼요. 너무 안 타면 점수 자체가 안 잡혀요</div></div>
  </div>
</div>
