<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f7f4ec;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2d2a38; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #7a7266; margin-bottom: 18px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  .c { background: #fff; border-radius: 13px; padding: 15px 17px; border: 1px solid #ece4d5;
    box-shadow: 0 5px 13px rgba(150,110,40,.06); display: flex; gap: 13px; align-items: flex-start; }
  .em { flex: none; font-size: 25px; }
  .bd .t { font-size: 14.5px; font-weight: 800; color: #b5701a; }
  .bd .t span { font-size: 11px; background: #fbe4d8; color: #c0392b; padding: 2px 8px; border-radius: 10px; margin-left: 5px; vertical-align: middle; }
  .bd .d { font-size: 12.8px; color: #4a463c; line-height: 1.45; margin-top: 3px; font-weight: 600; }
  .bd .d b { color: #2d2a38; }
</style>

<div id="art">
  <h1>이런 중고거래 사기, 조심하세요</h1>
  <p class="sub">수법을 알면 절반은 피할 수 있어요</p>

  <div class="grid">
    <div class="c"><div class="em">💸</div><div class="bd"><div class="t">선입금 후 잠적<span>최다</span></div><div class="d">시세보다 <b>싼 급매</b>로 유혹 → 입금받고 연락 끊어요</div></div></div>
    <div class="c"><div class="em">🔗</div><div class="bd"><div class="t">가짜 안전결제</div><div class="d"><b>외부 링크</b>로 결제 유도 → 카드·계좌 정보를 빼가요</div></div></div>
    <div class="c"><div class="em">🧾</div><div class="bd"><div class="t">가짜 입금 확인</div><div class="d"><b>조작한 입금 스크린샷</b>을 보내 택배부터 보내게 해요</div></div></div>
    <div class="c"><div class="em">📦</div><div class="bd"><div class="t">택배 바꿔치기</div><div class="d">고가품 주문했는데 <b>벽돌·다른 물건</b>이 오는 경우</div></div></div>
  </div>
</div>
