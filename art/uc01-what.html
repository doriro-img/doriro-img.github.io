<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 34px 36px 30px; background: #fff;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1b1b1b; }
  h1 { font-size: 20px; letter-spacing: -0.4px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6b6b6b; margin-bottom: 22px; }
  .split { display: flex; height: 84px; border-radius: 12px; overflow: hidden;
           border: 1px solid #e2e6ea; margin-bottom: 16px; }
  .s { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .s .p { font-size: 26px; font-weight: 800; letter-spacing: -1px; }
  .s .k { font-size: 13px; font-weight: 700; margin-top: 3px; }
  .gov { width: 75%; background: linear-gradient(90deg,#4faa84,#2f9e6e); color: #fff; }
  .gov .k { opacity: .95; }
  .me { width: 25%; background: #f2f5f7; }
  .me .p { color: #45505c; } .me .k { color: #7b848f; }
  .two { display: flex; gap: 12px; }
  .c { flex: 1; border: 1px solid #e2e6ea; border-radius: 11px; padding: 15px 18px; background: #fafbfc; }
  .c .t { font-size: 14.5px; font-weight: 800; margin-bottom: 6px; }
  .c p { font-size: 13px; line-height: 1.7; color: #4a5561; }
  .c p b { color: #1b1b1b; }
  .hi { background: #eef9f3; border-color: #a9dcc4; }
  .hi .t { color: #1d7050; }
</style>
<div id="art">
  <h1>국민연금 보험료를 나라가 75% 내줍니다</h1>
  <p class="sub">실업급여를 받는 동안만 쓸 수 있는 제도예요</p>
  <div class="split">
    <div class="s gov"><div class="p">75%</div><div class="k">나라가 냅니다</div></div>
    <div class="s me"><div class="p">25%</div><div class="k">내가 냅니다</div></div>
  </div>
  <div class="two">
    <div class="c hi">
      <div class="t">가입기간으로 인정됩니다</div>
      <p>지원받은 개월 수만큼 <b>국민연금 가입기간이 늘어납니다.</b>
        나중에 받을 연금액이 그만큼 올라가요</p>
    </div>
    <div class="c">
      <div class="t">평생 12개월까지</div>
      <p>한 사람이 <b>생애 통틀어 최대 12개월</b>입니다.
        여러 번 실직해도 다 더해서 1년을 넘길 수 없어요</p>
    </div>
  </div>
</div>
