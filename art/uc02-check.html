<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f7f4ec;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2d2a38; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #7a7266; margin-bottom: 16px; font-weight: 600; }
  .hero { background: #2e9e6b; border-radius: 15px; padding: 17px 22px; color: #fff; margin-bottom: 14px; text-align: center; }
  .hero .h { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
  .hero .t { font-size: 13.8px; font-weight: 600; opacity: .95; }
  .two { display: flex; gap: 13px; margin-bottom: 13px; }
  .app { flex: 1; background: #fff; border-radius: 13px; padding: 15px 18px; text-align: center; border: 1px solid #ece4d5;
    box-shadow: 0 5px 13px rgba(150,110,40,.06); }
  .app .nm { font-size: 16px; font-weight: 800; color: #2e9e6b; }
  .app .d { font-size: 12.5px; color: #6a6458; margin-top: 4px; font-weight: 600; line-height: 1.45; }
  .step { background: #fff; border: 1.5px solid #ece4d5; border-radius: 12px; padding: 13px 18px;
    font-size: 13.8px; color: #4a463c; line-height: 1.6; font-weight: 600; }
  .step b { color: #b5701a; }
</style>

<div id="art">
  <h1>거래 전 '이것만' 하세요</h1>
  <p class="sub">30초면 사기 대부분을 걸러내요</p>

  <div class="hero">
    <div class="h">판매자 번호·계좌를 '조회'하세요</div>
    <div class="t">사기 신고 이력이 있으면 바로 뜨거든요</div>
  </div>

  <div class="two">
    <div class="app"><div class="nm">더치트</div><div class="d">사기 정보 공유 앱·사이트</div></div>
    <div class="app"><div class="nm">경찰청 사이버캅</div><div class="d">공식 사기 조회 앱</div></div>
  </div>

  <div class="step">여기에 판매자 <b>전화번호나 계좌번호</b>를 넣어보고 <b>'주의' 표시가 뜨면 절대 거래하지 마세요.</b> 돈 보내기 전 이 한 번이 제일 확실한 예방이에요</div>
</div>
