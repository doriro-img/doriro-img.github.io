<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f7f4ec;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2d2a38; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #7a7266; margin-bottom: 18px; font-weight: 600; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { background: #fff; border-radius: 12px; padding: 13px 18px; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 5px 13px rgba(150,110,40,.06); border: 1px solid #ece4d5; }
  .x { flex: none; width: 26px; height: 26px; border-radius: 7px; background: #d1483f; color: #fff;
    font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .tx { font-size: 14.2px; line-height: 1.45; color: #3a362f; }
  .tx b { color: #c0392b; }
</style>

<div id="art">
  <h1>이런 말 나오면 사기 신호</h1>
  <p class="sub">하나라도 해당되면 일단 멈추세요</p>

  <div class="list">
    <div class="item"><div class="x">!</div><div class="tx"><b>"이 링크로 안전결제하세요"</b> — 앱 밖 외부 링크 결제는 십중팔구 피싱이에요</div></div>
    <div class="item"><div class="x">!</div><div class="tx"><b>"급매라 지금 바로 입금해야 해요"</b> — 시세보다 너무 싸고 재촉하면 의심</div></div>
    <div class="item"><div class="x">!</div><div class="tx"><b>"카톡·텔레그램으로 얘기해요"</b> — 번호 숨기려 외부 메신저로 유도해요</div></div>
    <div class="item"><div class="x">!</div><div class="tx"><b>"개인 계좌로 먼저 입금해주세요"</b> — 안전결제 두고 개인계좌 요구는 위험</div></div>
  </div>
</div>
