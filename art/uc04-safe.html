<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f7f4ec;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2d2a38; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #7a7266; margin-bottom: 18px; font-weight: 600; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { background: #fff; border-radius: 13px; padding: 14px 18px; display: flex; align-items: flex-start; gap: 14px;
    box-shadow: 0 5px 13px rgba(150,110,40,.06); border: 1px solid #ece4d5; }
  .ck { flex: none; width: 27px; height: 27px; border-radius: 8px; background: #2e9e6b; color: #fff;
    font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .tx { font-size: 14px; line-height: 1.5; color: #3a362f; padding-top: 2px; }
  .tx b { color: #2d2a38; } .tx .hl { color: #2e9e6b; font-weight: 800; }
</style>

<div id="art">
  <h1>안전하게 거래하는 법</h1>
  <p class="sub">이 습관만 들이면 훨씬 든든해요</p>

  <div class="list">
    <div class="item"><div class="ck">✓</div><div class="tx"><span class="hl">앱 안의 공식 안전결제만 쓰세요.</span> 판매자가 보내는 외부 링크·별도 결제는 무조건 거절</div></div>
    <div class="item"><div class="ck">✓</div><div class="tx">직거래는 <b>사람 많은 안전한 장소, 낮 시간</b>에. 지하철역·경찰서 앞 등이 좋아요</div></div>
    <div class="item"><div class="ck">✓</div><div class="tx"><b>개인 계좌 선입금은 최대한 피하세요.</b> 어쩔 수 없으면 소액부터, 반드시 조회 후에</div></div>
    <div class="item"><div class="ck">✓</div><div class="tx">택배 거래는 <b>안전결제(에스크로)</b>로. 물건 확인 후 대금이 넘어가게 하세요</div></div>
  </div>
</div>
