<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f7f4ec;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2d2a38; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #7a7266; margin-bottom: 14px; font-weight: 600; }
  .urgent { background: #d1483f; border-radius: 13px; padding: 13px 20px; color: #fff; margin-bottom: 13px;
    font-size: 14.5px; font-weight: 800; text-align: center; }
  .urgent b { color: #ffe08a; }
  .steps { display: flex; flex-direction: column; gap: 9px; margin-bottom: 13px; }
  .st { background: #fff; border-radius: 12px; padding: 12px 17px; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 4px 11px rgba(150,110,40,.05); border: 1px solid #ece4d5; }
  .n { flex: none; width: 27px; height: 27px; border-radius: 50%; background: #2d2a38; color: #fff;
    font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .tx { font-size: 13.8px; color: #3a362f; line-height: 1.45; }
  .tx b { color: #b5701a; }
  .call { display: flex; gap: 10px; }
  .cc { flex: 1; background: #fff; border: 1.5px solid #ece0c8; border-radius: 10px; padding: 10px; text-align: center; }
  .cc .num { font-size: 15px; font-weight: 800; color: #b5701a; }
  .cc .l { font-size: 11.5px; color: #8a7d66; font-weight: 700; margin-top: 1px; }
</style>

<div id="art">
  <h1>당했다면? 24시간이 골든타임</h1>
  <p class="sub">빨리 움직일수록 돈을 돌려받을 확률이 올라가요</p>

  <div class="urgent">💳 은행 <b>지급정지</b>는 <b>24시간 안에</b> 신청할 때 효과가 가장 커요</div>

  <div class="steps">
    <div class="st"><div class="n">1</div><div class="tx"><b>증거부터 확보.</b> 채팅 대화·이체 내역·판매 게시글을 스크린샷으로 저장, 계좌·연락처 메모</div></div>
    <div class="st"><div class="n">2</div><div class="tx"><b>송금한 은행에 전화</b>해 지급정지 신청</div></div>
    <div class="st"><div class="n">3</div><div class="tx"><b>112·경찰서 신고</b> 또는 온라인으로 사이버캅 앱·사이버범죄 신고(ECRM)</div></div>
  </div>

  <div class="call">
    <div class="cc"><div class="num">112</div><div class="l">경찰 신고</div></div>
    <div class="cc"><div class="num">사이버캅</div><div class="l">조회·신고 앱</div></div>
    <div class="cc"><div class="num">ECRM</div><div class="l">사이버범죄 신고</div></div>
  </div>
</div>
