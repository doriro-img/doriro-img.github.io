<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art {
    width: 860px; padding: 34px 36px 30px; background: #fff;
    font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; color: #1b1b1b;
  }
  h1 { font-size: 20px; letter-spacing: -0.4px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6b6b6b; margin-bottom: 20px; }

  .f { background: linear-gradient(160deg,#eef9f3,#d3f0e1); border: 1px solid #a9dcc4;
       border-radius: 11px; padding: 15px 22px; margin-bottom: 15px;
       display: flex; align-items: center; gap: 18px; }
  .f .eq { font-size: 20px; font-weight: 800; color: #1d7050; letter-spacing: -0.5px; white-space: nowrap; }
  .f .eq em { font-style: normal; color: #6aa78d; }
  .f p { font-size: 13px; line-height: 1.65; color: #4a5561; }
  .f p b { color: #1b1b1b; }

  .band { display: flex; gap: 12px; margin-bottom: 15px; }
  .b { flex: 1; border-radius: 11px; padding: 15px 18px; text-align: center; }
  .bu { background: #fdf6e9; border: 1px solid #f0dfc4; }
  .bl { background: #eff6fb; border: 1px solid #cfe0f0; }
  .b .k { font-size: 12px; font-weight: 700; margin-bottom: 5px; }
  .bu .k { color: #b9741a; } .bl .k { color: #4f7ba8; }
  .b .v { font-size: 26px; font-weight: 800; letter-spacing: -1px; }
  .bu .v { color: #9a6413; } .bl .v { color: #1f4a7a; }
  .b .n { font-size: 12px; margin-top: 3px; }
  .bu .n { color: #b09068; } .bl .n { color: #7b93ad; }

  .gap { flex: 0 0 168px; background: #1b1b1b; border-radius: 11px; padding: 15px 14px;
         text-align: center; display: flex; flex-direction: column; justify-content: center; }
  .gap .k { font-size: 11.5px; color: #9aa6b2; font-weight: 700; margin-bottom: 4px; }
  .gap .v { font-size: 21px; font-weight: 800; color: #ffd97a; letter-spacing: -0.7px; }
  .gap .n { font-size: 11px; color: #b8c2cc; margin-top: 4px; line-height: 1.45; }

  .days { border: 1px solid #e6e9ed; border-radius: 10px; overflow: hidden; }
  .dh { background: #f2f5f7; padding: 10px 18px; font-size: 12.5px; font-weight: 800; color: #55606c; }
  .db { display: flex; }
  .d1 { flex: 1; padding: 13px 18px; border-right: 1px solid #eef1f4; }
  .d1:last-child { border-right: none; }
  .d1 .k { font-size: 11.5px; color: #8a929c; font-weight: 700; margin-bottom: 3px; }
  .d1 .v { font-size: 16px; font-weight: 800; letter-spacing: -0.4px; color: #1b1b1b; }
</style>

<div id="art">
  <h1>얼마나 받나요</h1>
  <p class="sub">2026년 1월 이후 퇴사자 기준입니다</p>

  <div class="f">
    <div class="eq">퇴직 전 3개월 평균임금 <em>×</em> 60%</div>
    <p>이게 하루치입니다. 다만 <b>위아래로 한도가 정해져 있어서</b> 아무리 많이 벌었어도 상한을 넘지 않아요</p>
  </div>

  <div class="band">
    <div class="b bu"><div class="k">1일 상한액</div><div class="v">68,100원</div><div class="n">한 달이면 약 204만원</div></div>
    <div class="gap">
      <div class="k">둘의 차이</div>
      <div class="v">2,052원</div>
      <div class="n">생각보다 붙어 있어서<br />대부분 비슷하게 받습니다</div>
    </div>
    <div class="b bl"><div class="k">1일 하한액</div><div class="v">66,048원</div><div class="n">한 달이면 약 198만원</div></div>
  </div>

  <div class="days">
    <div class="dh">받는 기간과 자격</div>
    <div class="db">
      <div class="d1"><div class="k">소정급여일수</div><div class="v">120일 ~ 270일</div></div>
      <div class="d1"><div class="k">무엇으로 정해지나</div><div class="v">나이 + 고용보험 가입기간</div></div>
      <div class="d1"><div class="k">기본 자격</div><div class="v">18개월 중 180일 이상</div></div>
    </div>
  </div>
</div>
