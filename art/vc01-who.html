<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #eef4fb;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1f2d3d; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #5b7089; margin-bottom: 20px; font-weight: 600; }
  .three { display: flex; gap: 13px; }
  .c { flex: 1; background: #fff; border-radius: 15px; padding: 20px 16px 18px; text-align: center;
    box-shadow: 0 6px 15px rgba(40,90,150,.08); border: 1px solid #dbe6f3; }
  .ic { width: 62px; height: 62px; border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; }
  .kid { background: #fdf0dd; } .preg { background: #fbe6ee; } .old { background: #e4ebf8; }
  .c .who { font-size: 16.5px; font-weight: 800; margin-bottom: 4px; }
  .c .age { font-size: 13px; font-weight: 700; color: #2f7ed8; margin-bottom: 7px; }
  .c .d { font-size: 12.5px; line-height: 1.5; color: #5b7089; }
  .foot { margin-top: 16px; background: #2f7ed8; color: #fff; border-radius: 12px; padding: 13px 18px;
    font-size: 13.5px; font-weight: 700; text-align: center; line-height: 1.5; }
</style>

<div id="art">
  <h1>독감 예방접종, 누가 무료인가요?</h1>
  <p class="sub">국가가 이 세 부류는 매년 공짜로 맞혀줘요 (인플루엔자 기준)</p>

  <div class="three">
    <div class="c">
      <div class="ic kid">
        <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="10" r="6" fill="#f3a33a"/><path d="M7,30 a10,11 0 0,1 20,0 Z" fill="#f3a33a"/></svg>
      </div>
      <div class="who">어린이</div>
      <div class="age">생후 6개월 ~ 13세</div>
      <div class="d">첫 접종 만 9세 미만은<br/>2회 맞아야 해요</div>
    </div>
    <div class="c">
      <div class="ic preg">
        <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="15" cy="8" r="5.5" fill="#e86f9e"/><path d="M13,15 q-4,7 0,15 l6,0 q1,-6 -1,-9 q7,-1 6,-7 q-1,-4 -5,-4 Z" fill="#e86f9e"/></svg>
      </div>
      <div class="who">임신부</div>
      <div class="age">임신 주수 무관</div>
      <div class="d">엄마가 맞으면 아기도<br/>보호돼요</div>
    </div>
    <div class="c">
      <div class="ic old">
        <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="15" cy="9" r="5.5" fill="#5b83c8"/><path d="M8,30 a9,10 0 0,1 15,-2 Z" fill="#5b83c8"/><rect x="24" y="9" width="2.4" height="21" rx="1.2" fill="#5b83c8"/></svg>
      </div>
      <div class="who">어르신</div>
      <div class="age">만 65세 이상</div>
      <div class="d">부모님 꼭 챙겨드리기<br/>(폐렴구균도 무료)</div>
    </div>
  </div>

  <div class="foot">이 대상이면 보건소·지정 병의원에서 신분증만 있으면 0원이에요</div>
</div>
