<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #eef4fb;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1f2d3d; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #5b7089; margin-bottom: 20px; font-weight: 600; }
  .tl { position: relative; padding-left: 20px; }
  .tl::before { content: ''; position: absolute; left: 5px; top: 8px; bottom: 12px; width: 3px; background: #cddcf0; border-radius: 2px; }
  .row { position: relative; background: #fff; border-radius: 13px; padding: 14px 18px; margin-bottom: 11px;
    box-shadow: 0 5px 13px rgba(40,90,150,.07); border: 1px solid #dbe6f3; }
  .row::before { content: ''; position: absolute; left: -18px; top: 20px; width: 13px; height: 13px; border-radius: 50%;
    background: #2f7ed8; border: 3px solid #eef4fb; }
  .when { font-size: 13px; font-weight: 800; color: #2f7ed8; }
  .what { font-size: 15px; font-weight: 700; margin-top: 2px; color: #24303f; }
  .what small { font-size: 12.5px; color: #7488a0; font-weight: 600; }
  .note { margin-top: 15px; background: #fff4e5; border: 1.5px solid #f0d9b0; border-radius: 12px; padding: 13px 18px;
    font-size: 13px; color: #8a6a2e; line-height: 1.6; }
  .note b { color: #b5822a; }
</style>

<div id="art">
  <h1>독감, 언제부터 맞나요?</h1>
  <p class="sub">대상마다 시작일이 달라요 (아래는 직전 절기 예시)</p>

  <div class="tl">
    <div class="row">
      <div class="when">9월 넷째 주</div>
      <div class="what">어린이 2회 접종 대상 먼저 <small>(만 9세 미만 첫 접종)</small></div>
    </div>
    <div class="row">
      <div class="when">9월 말</div>
      <div class="what">어린이 1회 대상 + 임신부 <small>시작</small></div>
    </div>
    <div class="row">
      <div class="when">10월 중순부터</div>
      <div class="what">어르신은 75세 → 70대 → 65세 순 <small>연령별 순차</small></div>
    </div>
    <div class="row">
      <div class="when">이듬해 4월 말</div>
      <div class="what">무료 접종 기간 종료 <small>겨울 오기 전 미리</small></div>
    </div>
  </div>

  <div class="note"><b>올해(2026-2027절기) 정확한 날짜는 아직 안 나왔어요.</b> 보통 9월에 질병관리청이 공지해요. 접종 전에 예방접종도우미(nip.kdca.go.kr)에서 내 시작일을 꼭 확인하세요</div>
</div>
