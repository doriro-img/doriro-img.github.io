<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #eef4fb;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1f2d3d; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #5b7089; margin-bottom: 18px; font-weight: 600; }
  .hero { background: #17b3a3; border-radius: 15px; padding: 18px 22px; color: #fff; margin-bottom: 14px;
    display: flex; align-items: center; gap: 18px; }
  .hero .big { font-size: 30px; font-weight: 800; line-height: 1.1; }
  .hero .big small { font-size: 15px; font-weight: 700; opacity: .9; }
  .hero .r { font-size: 13.5px; line-height: 1.55; font-weight: 600; opacity: .96; }
  .two { display: flex; gap: 13px; margin-bottom: 14px; }
  .c { flex: 1; background: #fff; border-radius: 13px; padding: 15px 18px;
    box-shadow: 0 5px 13px rgba(40,90,150,.07); border: 1px solid #dbe6f3; }
  .c .l { font-size: 12.5px; font-weight: 800; color: #159c8e; margin-bottom: 4px; }
  .c .v { font-size: 14.5px; font-weight: 700; line-height: 1.45; color: #24303f; }
  .tip { background: #e9f7f5; border: 1.5px solid #b7e3dd; border-radius: 12px; padding: 13px 18px;
    font-size: 13.5px; color: #14766b; line-height: 1.6; font-weight: 600; }
  .tip b { color: #0f6055; }
</style>

<div id="art">
  <h1>부모님은 '폐렴구균'도 평생 1회 무료</h1>
  <p class="sub">독감이랑 별개로, 65세 넘으면 딱 한 번 공짜예요</p>

  <div class="hero">
    <div class="big">65<small>세 이상</small></div>
    <div class="r">과거에 안 맞으셨다면<br/>지금 <b>평생 1회</b> 무료로 맞을 수 있어요 (23가 다당 백신)</div>
  </div>

  <div class="two">
    <div class="c"><div class="l">언제</div><div class="v">연중 아무 때나<br/>(기간 제한 없음)</div></div>
    <div class="c"><div class="l">어디서</div><div class="v">보건소 · 지정<br/>위탁 병의원</div></div>
  </div>

  <div class="tip"><b>독감이랑 같은 날 같이 맞아도 돼요.</b> 부모님 병원 모시고 갈 때 "폐렴구균도 맞으셨어요?" 한 번 여쭤보세요. 이미 맞으셨으면 안 맞아도 됩니다</div>
</div>
