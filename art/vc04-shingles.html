<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #eef4fb;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1f2d3d; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #5b7089; margin-bottom: 18px; font-weight: 600; }
  .warnbar { background: #fbeee0; border: 1.5px solid #f0d3a8; border-radius: 13px; padding: 14px 18px; margin-bottom: 14px;
    font-size: 14px; color: #8a5a1e; line-height: 1.55; font-weight: 600; }
  .warnbar b { color: #b56a1a; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { background: #fff; border-radius: 12px; padding: 13px 17px; display: flex; align-items: flex-start; gap: 13px;
    box-shadow: 0 5px 13px rgba(40,90,150,.06); border: 1px solid #dbe6f3; }
  .bx { flex: none; width: 25px; height: 25px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: #fff; background: #2f7ed8; }
  .bx.a { background: #e0932e; }
  .tx { font-size: 14px; line-height: 1.5; color: #37475b; padding-top: 2px; }
  .tx b { color: #24303f; }
</style>

<div id="art">
  <h1>대상포진은요? 동네마다 달라요</h1>
  <p class="sub">전국 무료가 아니라, 사는 지역이 해주냐 마냐예요</p>

  <div class="warnbar">대상포진 백신은 아직 <b>전국 무료(국가접종)가 아니에요.</b> 시·군·구가 자기 예산으로 하는 선택 사업이라, 전국 229곳 중 168곳 정도만 일부 지원해요</div>

  <div class="list">
    <div class="item"><div class="bx">1</div><div class="tx"><b>보통 65세 이상 + 취약계층</b>이 기준이에요. 요즘은 50~60세로 낮추는 지역도 늘고 있어요</div></div>
    <div class="item"><div class="bx">2</div><div class="tx"><b>내가 사는 시·군·구가 하는지</b>부터 확인해야 해요. 복지로나 관할 보건소에서 1~2분이면 확인돼요</div></div>
    <div class="item"><div class="bx a">!</div><div class="tx"><b>물량 소진되면 조기 마감</b>돼요. 지원하는 동네라면 미루지 말고 서두르는 게 안전해요</div></div>
  </div>
</div>
