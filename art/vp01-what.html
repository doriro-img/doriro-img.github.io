<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f6f1ef;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2a2a33; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #8a7570; margin-bottom: 18px; font-weight: 600; }
  .stat { background: #2a2d3a; border-radius: 15px; padding: 18px 22px; color: #fff; margin-bottom: 13px;
    display: flex; align-items: center; justify-content: space-around; }
  .stat .col { text-align: center; }
  .stat .yr { font-size: 13px; color: #b0b4c2; font-weight: 700; }
  .stat .v { font-size: 26px; font-weight: 800; margin-top: 3px; }
  .stat .v.old { color: #9aa0b0; } .stat .v.new { color: #f0b429; }
  .stat .arr { font-size: 26px; color: #d13a3a; font-weight: 800; }
  .stat .arr small { display: block; font-size: 12px; color: #f0b429; font-weight: 800; }
  .box { background: #fff; border: 1.5px solid #ecddd8; border-radius: 12px; padding: 14px 18px;
    box-shadow: 0 4px 11px rgba(160,70,50,.05); font-size: 13.8px; color: #4a3a36; line-height: 1.6; }
  .box b { color: #d13a3a; }
</style>

<div id="art">
  <h1>보이스피싱, 이렇게 진화했어요</h1>
  <p class="sub">AI를 만나 더 교묘하고 무서워졌어요</p>

  <div class="stat">
    <div class="col"><div class="yr">2016년 기관사칭</div><div class="v old">3,384건</div></div>
    <div class="arr">→<small>약 4배</small></div>
    <div class="col"><div class="yr">2025년 기관사칭</div><div class="v new">13,323건</div></div>
  </div>

  <div class="box">경찰청은 <b>"전통적 수법이 막히자 신종으로 변형 중"</b>이라고 경고했어요. 보이스피싱은 사라진 게 아니라 <b>다른 얼굴로 돌아오고</b> 있어요. 특히 AI가 붙으면서 일반인이 구별하기 훨씬 어려워졌고요</div>
</div>
