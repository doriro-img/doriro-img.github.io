<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f6f1ef;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2a2a33; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #8a7570; margin-bottom: 16px; font-weight: 600; }
  .hero { background: #d13a3a; border-radius: 15px; padding: 17px 22px; color: #fff; margin-bottom: 13px;
    display: flex; align-items: center; gap: 18px; }
  .hero .big { font-size: 30px; font-weight: 800; line-height: 1.1; }
  .hero .big small { display: block; font-size: 14px; font-weight: 700; opacity: .92; margin-top: 2px; }
  .hero .r { font-size: 14px; line-height: 1.55; font-weight: 600; }
  .steps { display: flex; gap: 10px; }
  .st { flex: 1; background: #fff; border-radius: 12px; padding: 13px 12px; text-align: center; border: 1px solid #ecddd8;
    box-shadow: 0 4px 11px rgba(160,70,50,.05); }
  .st .n { font-size: 12px; font-weight: 800; color: #d13a3a; }
  .st .d { font-size: 12.8px; color: #4a3a36; line-height: 1.4; margin-top: 3px; font-weight: 600; }
  .arr { display: flex; align-items: center; font-size: 18px; color: #d0a0a0; font-weight: 800; }
</style>

<div id="art">
  <h1>제일 무서운 건 'AI 딥보이스'예요</h1>
  <p class="sub">가족 목소리를 그대로 흉내 내요</p>

  <div class="hero">
    <div class="big">30초<small>~1분이면 복제</small></div>
    <div class="r">SNS·유튜브·통화에서 딴 짧은 음성만 있으면 <b>목소리·억양·감정까지</b> 똑같이 복제해요. 진짜 자녀 목소리와 구별이 거의 불가능해요</div>
  </div>

  <div class="steps">
    <div class="st"><div class="n">1단계</div><div class="d">SNS·영상에서<br/>음성 수집</div></div>
    <div class="arr">→</div>
    <div class="st"><div class="n">2단계</div><div class="d">AI로 목소리<br/>복제</div></div>
    <div class="arr">→</div>
    <div class="st"><div class="n">3단계</div><div class="d">"엄마 나야"<br/>전화·영상통화</div></div>
  </div>
</div>
