<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f6f1ef;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2a2a33; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #8a7570; margin-bottom: 18px; font-weight: 600; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { background: #fff; border-radius: 13px; padding: 14px 18px; display: flex; align-items: flex-start; gap: 14px;
    box-shadow: 0 5px 13px rgba(160,70,50,.06); border: 1px solid #ecddd8; }
  .ck { flex: none; width: 27px; height: 27px; border-radius: 8px; background: #2e9e6b; color: #fff;
    font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .tx { font-size: 14px; line-height: 1.5; color: #3a2f2c; padding-top: 2px; }
  .tx b { color: #2a2a33; } .tx .hl { color: #d13a3a; font-weight: 800; }
</style>

<div id="art">
  <h1>이렇게 예방하세요</h1>
  <p class="sub">이 원칙만 지켜도 대부분 막아요</p>

  <div class="list">
    <div class="item"><div class="ck">✓</div><div class="tx"><span class="hl">기관은 전화로 돈·개인정보·이체를 요구하지 않아요.</span> 그런 전화는 100% 사기예요</div></div>
    <div class="item"><div class="ck">✓</div><div class="tx">문자 속 <b>링크는 절대 클릭하지 말고</b>, 시키는 대로 <b>앱을 설치하지 마세요</b></div></div>
    <div class="item"><div class="ck">✓</div><div class="tx">가족이라도 <b>목소리만으론 믿지 마세요.</b> 미리 <b>가족끼리 암호</b>를 정해두면 좋아요 (딥보이스 대비)</div></div>
    <div class="item"><div class="ck">✓</div><div class="tx">조금이라도 의심되면 <b>일단 끊고</b>, 공식 대표번호로 <b>직접 다시 확인</b>하세요</div></div>
  </div>
</div>
