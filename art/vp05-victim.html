<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 32px 40px 30px; background: #f6f1ef;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #2a2a33; }
  h1 { font-size: 23px; letter-spacing: -0.6px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #8a7570; margin-bottom: 14px; font-weight: 600; }
  .urgent { background: #d13a3a; border-radius: 13px; padding: 14px 20px; color: #fff; margin-bottom: 13px;
    display: flex; align-items: center; gap: 15px; }
  .urgent .t { font-size: 15px; font-weight: 800; line-height: 1.5; }
  .urgent .t b { color: #ffe08a; }
  .steps { display: flex; flex-direction: column; gap: 9px; margin-bottom: 13px; }
  .st { background: #fff; border-radius: 12px; padding: 12px 17px; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 4px 11px rgba(160,70,50,.05); border: 1px solid #ecddd8; }
  .n { flex: none; width: 27px; height: 27px; border-radius: 50%; background: #2a2d3a; color: #fff;
    font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .tx { font-size: 13.8px; color: #3a2f2c; line-height: 1.45; }
  .tx b { color: #d13a3a; }
  .call { display: flex; gap: 10px; }
  .cc { flex: 1; background: #fff2ef; border: 1.5px solid #f0c8bf; border-radius: 10px; padding: 10px; text-align: center; }
  .cc .num { font-size: 17px; font-weight: 800; color: #d13a3a; }
  .cc .l { font-size: 11.5px; color: #8a5a52; font-weight: 700; margin-top: 1px; }
</style>

<div id="art">
  <h1>당했다면? 골든타임 30분</h1>
  <p class="sub">1분이라도 빨리 신고할수록 돈을 막을 수 있어요</p>

  <div class="urgent">
    <div class="t">⏱️ 빠르면 <b>30분~1시간 내</b>에 피해금 이체를 막을 수 있어요. 무조건 '빨리'가 답이에요</div>
  </div>

  <div class="steps">
    <div class="st"><div class="n">1</div><div class="tx"><b>112(경찰)</b>와 <b>송금한 은행 고객센터</b>에 즉시 신고 → 계좌 지급정지 요청</div></div>
    <div class="st"><div class="n">2</div><div class="tx">경찰서에서 <b>'사건사고사실확인원'</b> 발급받기</div></div>
    <div class="st"><div class="n">3</div><div class="tx">은행에 신분증+확인원 제출해 <b>피해구제 신청</b> (인증서 재발급·명의도용 방지도)</div></div>
  </div>

  <div class="call">
    <div class="cc"><div class="num">112</div><div class="l">경찰 신고</div></div>
    <div class="cc"><div class="num">1332</div><div class="l">금융감독원</div></div>
    <div class="cc"><div class="num">1577-0199</div><div class="l">심리상담</div></div>
  </div>
</div>
