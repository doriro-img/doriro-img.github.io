<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 30px 40px 26px; background: #eef6ef;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #24352a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; }
  .sub { font-size: 13.5px; color: #6f8a76; margin: 4px 0 14px; font-weight: 600; }
  .scene { background: #fff; border-radius: 16px; border: 1px solid #dceadf; padding: 14px 20px 10px;
    box-shadow: 0 6px 15px rgba(40,110,60,.07); display: flex; align-items: center; gap: 18px; }
  .txt { flex: 1; }
  .p { display: flex; gap: 11px; align-items: center; margin-bottom: 9px; }
  .p:last-child { margin-bottom: 0; }
  .p .em { flex: none; width: 27px; height: 27px; border-radius: 8px; background: #e2f1e5; color: #2f7a45;
    font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .p .t { font-size: 14.6px; font-weight: 700; color: #3a4f41; line-height: 1.4; }
  .p .t b { color: #2f7a45; }
  .p .t i { font-style: normal; color: #c0392b; text-decoration: line-through; }
</style>
<div id="art">
  <h1>폐가전 무상수거, 스티커도 돈도 필요 없어요</h1>
  <p class="sub">집까지 와서 들고 나가줍니다. 전화 한 통이면 예약 끝</p>
  <div class="scene">
    <svg width="300" height="196" viewBox="0 0 300 196">
      <rect x="0" y="158" width="300" height="8" rx="4" fill="#dceadf"/>
      <!-- 집 -->
      <path d="M18,86 L74,44 L130,86 Z" fill="#8fc79f"/>
      <rect x="30" y="86" width="88" height="72" fill="#e6f3e9"/>
      <rect x="30" y="86" width="88" height="72" fill="none" stroke="#b9dcc3" stroke-width="2"/>
      <rect x="52" y="112" width="20" height="46" rx="2" fill="#3f8f52"/>
      <rect x="84" y="106" width="22" height="20" rx="2" fill="#bfe0c9"/>
      <!-- 트럭 -->
      <rect x="150" y="96" width="80" height="52" rx="5" fill="#3f8f52"/>
      <path d="M230,110 L258,110 L276,132 L276,148 L230,148 Z" fill="#65ad78"/>
      <rect x="238" y="116" width="24" height="16" rx="3" fill="#e6f3e9"/>
      <circle cx="176" cy="152" r="13" fill="#2f4a37"/><circle cx="176" cy="152" r="5" fill="#b9dcc3"/>
      <circle cx="254" cy="152" r="13" fill="#2f4a37"/><circle cx="254" cy="152" r="5" fill="#b9dcc3"/>
      <!-- 실려가는 냉장고 -->
      <rect x="162" y="62" width="34" height="46" rx="4" fill="#cfe3f2" stroke="#9fbdd6" stroke-width="2"/>
      <line x1="162" y1="80" x2="196" y2="80" stroke="#9fbdd6" stroke-width="2"/>
      <!-- 0원 배지 -->
      <circle cx="252" cy="56" r="30" fill="#f0c14b"/>
      <text x="252" y="66" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">0원</text>
    </svg>
    <div class="txt">
      <div class="p"><div class="em">1</div><div class="t">폐기물 <i>스티커 구매</i> <b>필요 없음</b></div></div>
      <div class="p"><div class="em">2</div><div class="t">배출 장소까지 <b>안 옮겨도 돼요</b>. 집에서 들고 나갑니다</div></div>
      <div class="p"><div class="em">3</div><div class="t">수거 비용 <b>0원</b>. 국민 누구나 신청 가능</div></div>
      <div class="p"><div class="em">4</div><div class="t">수거한 가전은 <b>분해·재활용</b>됩니다</div></div>
    </div>
  </div>
</div>
