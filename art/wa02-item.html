<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 30px 40px 28px; background: #eef6ef;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #24352a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; }
  .sub { font-size: 13.5px; color: #6f8a76; margin: 4px 0 15px; font-weight: 600; }
  .band { background: #fff; border-radius: 15px; border: 1px solid #dceadf; padding: 14px 17px;
    box-shadow: 0 5px 14px rgba(40,110,60,.06); margin-bottom: 10px; display: flex; gap: 16px; align-items: center; }
  .k { flex: none; width: 128px; }
  .k .n { font-size: 15px; font-weight: 800; color: #2f7a45; }
  .k .x { font-size: 12.4px; font-weight: 700; color: #7c9683; margin-top: 3px; line-height: 1.4; }
  .icons { flex: 1; display: flex; gap: 14px; align-items: flex-end; }
  .it { text-align: center; }
  .it .lb { font-size: 12.2px; font-weight: 700; color: #5d7a65; margin-top: 4px; }
  .badge { flex: none; font-size: 12.4px; font-weight: 800; color: #fff; background: #3f8f52;
    border-radius: 9px; padding: 5px 11px; }
  .badge.o { background: #d99a2b; }
</style>
<div id="art">
  <h1>어떤 가전을 가져가나요?</h1>
  <p class="sub">냉장고·세탁기 같은 큰 건 딱 1대만 있어도 옵니다</p>

  <div class="band">
    <div class="k"><div class="n">대형 가전</div><div class="x">1대만 있어도 신청</div></div>
    <div class="icons">
      <div class="it"><svg width="46" height="58" viewBox="0 0 46 58"><rect x="6" y="2" width="34" height="54" rx="5" fill="#cfe3f2" stroke="#9fbdd6" stroke-width="2"/><line x1="6" y1="22" x2="40" y2="22" stroke="#9fbdd6" stroke-width="2"/><rect x="32" y="9" width="4" height="8" rx="2" fill="#7fa8c9"/><rect x="32" y="28" width="4" height="9" rx="2" fill="#7fa8c9"/></svg><div class="lb">냉장고</div></div>
      <div class="it"><svg width="46" height="58" viewBox="0 0 46 58"><rect x="5" y="6" width="36" height="48" rx="5" fill="#e3eef6" stroke="#9fbdd6" stroke-width="2"/><circle cx="23" cy="34" r="13" fill="#fff" stroke="#9fbdd6" stroke-width="2"/><circle cx="23" cy="34" r="6" fill="#bcd9ec"/><circle cx="13" cy="15" r="2.6" fill="#7fa8c9"/></svg><div class="lb">세탁기</div></div>
      <div class="it"><svg width="60" height="58" viewBox="0 0 60 58"><rect x="4" y="14" width="52" height="20" rx="6" fill="#eef4f8" stroke="#9fbdd6" stroke-width="2"/><path d="M12,38 q6,8 0,14 M26,38 q6,8 0,14 M40,38 q6,8 0,14" stroke="#a9cfe6" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="12" y="21" width="30" height="4" rx="2" fill="#c8dced"/></svg><div class="lb">에어컨</div></div>
      <div class="it"><svg width="60" height="58" viewBox="0 0 60 58"><rect x="4" y="8" width="52" height="34" rx="4" fill="#3d4a56"/><rect x="8" y="12" width="44" height="26" rx="2" fill="#8fa9bd"/><rect x="24" y="42" width="12" height="7" fill="#3d4a56"/><rect x="16" y="49" width="28" height="4" rx="2" fill="#3d4a56"/></svg><div class="lb">TV</div></div>
      <div class="it"><svg width="46" height="58" viewBox="0 0 46 58"><rect x="6" y="4" width="34" height="50" rx="5" fill="#dceadf" stroke="#9fbdd6" stroke-width="2"/><rect x="12" y="12" width="22" height="14" rx="2" fill="#fff"/><line x1="6" y1="32" x2="40" y2="32" stroke="#9fbdd6" stroke-width="2"/></svg><div class="lb">김치냉장고</div></div>
    </div>
    <div class="badge">1개부터 OK</div>
  </div>

  <div class="band">
    <div class="k"><div class="n">중 · 소형 가전</div><div class="x">함께 신청하면 같이 수거</div></div>
    <div class="icons">
      <div class="it"><svg width="52" height="42" viewBox="0 0 52 42"><rect x="3" y="6" width="46" height="30" rx="4" fill="#e3eef6" stroke="#9fbdd6" stroke-width="2"/><rect x="8" y="11" width="26" height="20" rx="2" fill="#3d4a56"/><circle cx="42" cy="16" r="3.4" fill="#7fa8c9"/></svg><div class="lb">전자레인지</div></div>
      <div class="it"><svg width="40" height="52" viewBox="0 0 40 52"><rect x="5" y="4" width="30" height="44" rx="6" fill="#eef4f8" stroke="#9fbdd6" stroke-width="2"/><circle cx="20" cy="22" r="9" fill="#bcd9ec"/><path d="M14,38 h12" stroke="#9fbdd6" stroke-width="3" stroke-linecap="round"/></svg><div class="lb">공기청정기</div></div>
      <div class="it"><svg width="40" height="52" viewBox="0 0 40 52"><rect x="7" y="6" width="26" height="40" rx="5" fill="#e3eef6" stroke="#9fbdd6" stroke-width="2"/><rect x="14" y="14" width="12" height="10" rx="2" fill="#7fc9e0"/><rect x="16" y="30" width="8" height="10" rx="2" fill="#bcd9ec"/></svg><div class="lb">정수기</div></div>
      <div class="it"><svg width="46" height="52" viewBox="0 0 46 52"><circle cx="23" cy="20" r="16" fill="#eef4f8" stroke="#9fbdd6" stroke-width="2"/><path d="M23,20 l10,-8 M23,20 l-12,-3 M23,20 l4,13" stroke="#a9cfe6" stroke-width="3" stroke-linecap="round"/><rect x="20" y="36" width="6" height="10" fill="#9fbdd6"/><rect x="12" y="46" width="22" height="4" rx="2" fill="#9fbdd6"/></svg><div class="lb">선풍기</div></div>
    </div>
    <div class="badge">대형과 함께</div>
  </div>

  <div class="band" style="margin-bottom:0">
    <div class="k"><div class="n">소형 가전만 있을 때</div><div class="x">지역마다 기준이 달라요</div></div>
    <div class="icons">
      <div class="it"><svg width="36" height="46" viewBox="0 0 36 46"><rect x="8" y="4" width="20" height="38" rx="4" fill="#dcd7f2" stroke="#a9a0d6" stroke-width="2"/><rect x="13" y="10" width="10" height="16" rx="2" fill="#fff"/></svg><div class="lb">보조배터리</div></div>
      <div class="it"><svg width="44" height="46" viewBox="0 0 44 46"><rect x="6" y="14" width="32" height="18" rx="9" fill="#dcd7f2" stroke="#a9a0d6" stroke-width="2"/><circle cx="14" cy="23" r="4" fill="#fff"/><circle cx="30" cy="23" r="4" fill="#fff"/></svg><div class="lb">이어폰</div></div>
      <div class="it"><svg width="40" height="46" viewBox="0 0 40 46"><rect x="12" y="6" width="16" height="24" rx="4" fill="#dcd7f2" stroke="#a9a0d6" stroke-width="2"/><rect x="17" y="30" width="6" height="12" fill="#a9a0d6"/></svg><div class="lb">면도기</div></div>
      <div class="it"><svg width="44" height="46" viewBox="0 0 44 46"><path d="M10,8 h18 a6,6 0 0 1 0,12 h-18 Z" fill="#dcd7f2" stroke="#a9a0d6" stroke-width="2"/><rect x="8" y="20" width="8" height="22" rx="4" fill="#a9a0d6"/></svg><div class="lb">고데기</div></div>
    </div>
    <div class="badge o">여러 개 모아서</div>
  </div>
</div>
