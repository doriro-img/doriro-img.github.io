<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 30px 40px 28px; background: #eef6ef;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #24352a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; }
  .sub { font-size: 13.5px; color: #6f8a76; margin: 4px 0 15px; font-weight: 600; }
  .two { display: flex; gap: 12px; margin-bottom: 12px; }
  .w { flex: 1; background: #fff; border-radius: 15px; border: 1px solid #dceadf; padding: 16px 18px;
    box-shadow: 0 5px 14px rgba(40,110,60,.06); display: flex; align-items: center; gap: 15px; }
  .w .t { font-size: 13px; font-weight: 800; color: #7c9683; }
  .w .v { font-size: 25px; font-weight: 800; color: #2f7a45; letter-spacing: -1px; margin-top: 2px; }
  .w .x { font-size: 12.5px; font-weight: 700; color: #7c9683; margin-top: 4px; }
  .steps { display: flex; gap: 8px; align-items: stretch; }
  .s { flex: 1; background: #fff; border-radius: 13px; border: 1px solid #dceadf; padding: 13px 14px;
    box-shadow: 0 4px 11px rgba(40,110,60,.05); }
  .s .n { display: inline-block; font-size: 11.5px; font-weight: 800; color: #fff; background: #3f8f52;
    border-radius: 9px; padding: 3px 10px; }
  .s .t { font-size: 14.2px; font-weight: 800; margin-top: 8px; }
  .s .d { font-size: 12.5px; font-weight: 700; color: #7c9683; margin-top: 4px; line-height: 1.45; }
  .ar { flex: none; align-self: center; font-size: 20px; font-weight: 800; color: #a8c9b2; }
</style>
<div id="art">
  <h1>신청은 이렇게 해요</h1>
  <p class="sub">전화가 제일 빠르고, 인터넷은 24시간 예약돼요</p>
  <div class="two">
    <div class="w">
      <svg width="58" height="58" viewBox="0 0 58 58">
        <circle cx="29" cy="29" r="26" fill="#e2f1e5"/>
        <path d="M20,17 l7,8 l-5,6 a20,20 0 0 0 11,11 l6,-5 l8,7 l-6,7 a30,30 0 0 1 -28,-28 Z" fill="#3f8f52"/>
      </svg>
      <div><div class="t">전화 신청</div><div class="v">1599-0903</div><div class="x">평일 상담 · 주소와 품목만 말하면 끝</div></div>
    </div>
    <div class="w">
      <svg width="58" height="58" viewBox="0 0 58 58">
        <rect x="6" y="10" width="46" height="32" rx="4" fill="#3f8f52"/>
        <rect x="10" y="14" width="38" height="24" rx="2" fill="#e6f3e9"/>
        <rect x="20" y="44" width="18" height="4" rx="2" fill="#3f8f52"/>
        <path d="M20,26 l5,5 l10,-11" stroke="#3f8f52" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div><div class="t">인터넷 신청</div><div class="v">15990903.or.kr</div><div class="x">배출예약시스템 · 지자체 카톡 채널도 가능</div></div>
    </div>
  </div>
  <div class="steps">
    <div class="s"><div class="n">STEP 1</div><div class="t">주소·품목 입력</div><div class="d">가전 종류와 개수를 적어요</div></div>
    <div class="ar">›</div>
    <div class="s"><div class="n">STEP 2</div><div class="t">수거 날짜 선택</div><div class="d">원하는 날짜를 골라 예약</div></div>
    <div class="ar">›</div>
    <div class="s"><div class="n">STEP 3</div><div class="t">방문 · 확인</div><div class="d">기사님이 와서 품목 확인</div></div>
    <div class="ar">›</div>
    <div class="s"><div class="n">STEP 4</div><div class="t">무상 수거 완료</div><div class="d">비용 0원. 그대로 끝이에요</div></div>
  </div>
</div>
