<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 30px 40px 26px; background: #eef6ef;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #24352a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; }
  .sub { font-size: 13.5px; color: #6f8a76; margin: 4px 0 15px; font-weight: 600; }
  .g { display: flex; gap: 11px; }
  .c { flex: 1; background: #fff; border-radius: 15px; border: 1px solid #f0d8d4; padding: 16px 16px 17px;
    box-shadow: 0 5px 14px rgba(150,60,50,.06); text-align: center; }
  .c .ill { height: 88px; display: flex; align-items: center; justify-content: center; }
  .c .t { font-size: 15px; font-weight: 800; color: #c0392b; margin-top: 6px; }
  .c .d { font-size: 12.7px; font-weight: 700; color: #8c7a76; margin-top: 5px; line-height: 1.45; }
  .ok { margin-top: 13px; background: #e2f1e5; border-radius: 13px; padding: 13px 17px;
    font-size: 13.6px; font-weight: 800; color: #2f7a45; }
</style>
<div id="art">
  <h1>이럴 땐 수거를 못 해요</h1>
  <p class="sub">헛걸음하면 다시 예약해야 하니 미리 확인하세요</p>
  <div class="g">
    <div class="c">
      <div class="ill">
        <svg width="104" height="82" viewBox="0 0 104 82">
          <rect x="8" y="4" width="88" height="60" fill="#f2ece4"/>
          <rect x="24" y="18" width="52" height="20" rx="6" fill="#eef4f8" stroke="#c9a9a4" stroke-width="2.4"/>
          <path d="M30,38 v18 M50,38 v18 M70,38 v18" stroke="#c9a9a4" stroke-width="3" stroke-linecap="round"/>
          <circle cx="76" cy="58" r="18" fill="#e05c50"/>
          <path d="M67,58 h18" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="t">벽에 그대로 붙어 있는 제품</div>
      <div class="d">벽걸이 에어컨처럼 <b>철거가 안 된</b> 상태면 수거가 안 돼요</div>
    </div>
    <div class="c">
      <div class="ill">
        <svg width="104" height="82" viewBox="0 0 104 82">
          <rect x="6" y="10" width="42" height="62" fill="#e8eef2"/>
          <rect x="14" y="18" width="12" height="12" fill="#b9cdd9"/><rect x="30" y="18" width="12" height="12" fill="#b9cdd9"/>
          <rect x="14" y="38" width="12" height="12" fill="#b9cdd9"/><rect x="30" y="38" width="12" height="12" fill="#b9cdd9"/>
          <path d="M58,72 L92,26" stroke="#d0a24a" stroke-width="6" stroke-linecap="round"/>
          <path d="M64,68 L96,32" stroke="#e6c07a" stroke-width="6" stroke-linecap="round"/>
          <circle cx="72" cy="20" r="17" fill="#e05c50"/>
          <path d="M64,20 h16" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="t">사다리차가 필요한 위치</div>
      <div class="d">고층 외벽에 달린 실외기처럼 <b>장비가 필요한</b> 경우</div>
    </div>
    <div class="c">
      <div class="ill">
        <svg width="104" height="82" viewBox="0 0 104 82">
          <path d="M22,8 h52 v64 h-52 Z" fill="#e8eef2" stroke="#c9a9a4" stroke-width="2.4"/>
          <path d="M34,8 L44,34 L28,42 L42,72" stroke="#c0392b" stroke-width="3.4" fill="none"/>
          <path d="M62,8 L54,30 L70,44 L58,72" stroke="#c0392b" stroke-width="3.4" fill="none"/>
          <circle cx="80" cy="60" r="17" fill="#e05c50"/>
          <path d="M72,60 h16" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="t">심하게 부서진 제품</div>
      <div class="d">안전 문제가 있을 만큼 <b>파손된</b> 가전은 대상이 아니에요</div>
    </div>
  </div>
  <div class="ok">에어컨은 미리 철거만 해두면 실내기·실외기 모두 무상 수거됩니다</div>
</div>
