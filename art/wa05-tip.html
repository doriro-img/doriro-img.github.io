<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 30px 40px 26px; background: #eef6ef;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #24352a; }
  h1 { font-size: 23px; letter-spacing: -0.6px; }
  .sub { font-size: 13.5px; color: #6f8a76; margin: 4px 0 15px; font-weight: 600; }
  .wrap { display: flex; gap: 14px; }
  .note { flex: none; width: 214px; background: #fff; border-radius: 16px; border: 1px solid #dceadf;
    box-shadow: 0 6px 15px rgba(40,110,60,.07); padding: 16px 17px; }
  .note .h { font-size: 14.5px; font-weight: 800; color: #2f7a45; }
  .note .x { font-size: 12.6px; font-weight: 700; color: #7c9683; margin-top: 6px; line-height: 1.5; }
  .list { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .i { background: #fff; border-radius: 13px; border: 1px solid #dceadf; padding: 13px 15px;
    display: flex; gap: 11px; align-items: flex-start; box-shadow: 0 4px 11px rgba(40,110,60,.05); }
  .ck { flex: none; width: 22px; height: 22px; border-radius: 7px; background: #3f8f52; display: flex;
    align-items: center; justify-content: center; }
  .t { font-size: 14px; font-weight: 800; color: #24352a; }
  .d { font-size: 12.5px; font-weight: 700; color: #7c9683; margin-top: 3px; line-height: 1.45; }
</style>
<div id="art">
  <h1>수거일 전에 이것만 해두세요</h1>
  <p class="sub">기사님 오시기 전 5분이면 되는 것들이에요</p>
  <div class="wrap">
    <div class="note">
      <svg width="176" height="104" viewBox="0 0 176 104">
        <rect x="14" y="10" width="62" height="84" rx="6" fill="#cfe3f2" stroke="#9fbdd6" stroke-width="2"/>
        <line x1="14" y1="42" x2="76" y2="42" stroke="#9fbdd6" stroke-width="2"/>
        <rect x="66" y="20" width="5" height="14" rx="2.5" fill="#7fa8c9"/>
        <path d="M96,56 q10,-22 24,0 q-12,16 -24,0" fill="#8fc79f"/>
        <circle cx="132" cy="34" r="15" fill="#f0c14b"/>
        <path d="M126,34 l4,5 l9,-11" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="96" y="76" width="62" height="8" rx="4" fill="#dceadf"/>
      </svg>
      <div class="h">문 앞까지 안 옮겨도 돼요</div>
      <div class="x">집 안에 있는 그대로 두면 기사님이 들고 나갑니다. 무거운 거 혼자 끌지 마세요</div>
    </div>
    <div class="list">
      <div class="i"><div class="ck"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2,6 L5,9 L10,3" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><div class="t">냉장고는 속을 비워요</div><div class="d">음식·얼음을 미리 빼두면 바로 실어요</div></div></div>
      <div class="i"><div class="ck"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2,6 L5,9 L10,3" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><div class="t">개인정보를 지워요</div><div class="d">TV·PC는 계정 로그아웃과 초기화</div></div></div>
      <div class="i"><div class="ck"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2,6 L5,9 L10,3" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><div class="t">부속품도 같이 내놔요</div><div class="d">리모컨·전원선·받침대까지 한 번에</div></div></div>
      <div class="i"><div class="ck"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2,6 L5,9 L10,3" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><div class="t">품목이 늘면 미리 알려요</div><div class="d">예약과 다르면 못 싣고 가기도 해요</div></div></div>
    </div>
  </div>
</div>
