<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  #art { width: 860px; padding: 34px 36px 30px; background: #fff;
    font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; color: #1b1b1b; }
  h1 { font-size: 20px; letter-spacing: -0.4px; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6b6b6b; margin-bottom: 20px; }
  .two { display: flex; gap: 14px; margin-bottom: 15px; }
  .p { flex: 1; border-radius: 12px; overflow: hidden; border: 1px solid #e2e6ea; }
  .ph { padding: 12px 18px; font-size: 15px; font-weight: 800; color: #fff;
        display: flex; justify-content: space-between; align-items: center; }
  .pa .ph { background: #8a929c; } .pb .ph { background: #8a929c; }
  .ph .e { font-size: 11.5px; font-weight: 700; opacity: .95; }
  .bd { padding: 15px 18px 17px; background: #f6f7f8; }
  .r { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #dfe4e9; }
  .r:last-child { border-bottom: none; }
  .r .k { font-size: 12.5px; color: #8a929c; font-weight: 700; }
  .r .v { font-size: 14px; font-weight: 800; color: #55606c; }
  .closed { display: inline-block; background: #cf4f43; color: #fff; font-size: 11px;
            font-weight: 800; padding: 3px 10px; border-radius: 11px; }
  .now { background: #1b1b1b; color: #fff; border-radius: 11px; padding: 15px 20px;
         display: flex; align-items: flex-start; gap: 16px; }
  .now .tag { background: #ffd97a; color: #1b1b1b; font-size: 12px; font-weight: 800;
              padding: 5px 13px; border-radius: 13px; white-space: nowrap; flex-shrink: 0; margin-top: 1px; }
  .now p { font-size: 13.5px; line-height: 1.75; color: #d8dee4; }
  .now p b { color: #ffd97a; }
</style>
<div id="art">
  <h1>지금은 둘 다 신규 가입이 안 됩니다</h1>
  <p class="sub">검색해서 오신 분들이 제일 먼저 아셔야 할 부분이에요</p>
  <div class="two">
    <div class="p pa">
      <div class="ph"><span>청년도약계좌</span><span class="closed">종료</span></div>
      <div class="bd">
        <div class="r"><span class="k">신규 가입</span><span class="v">2025년 12월 마감</span></div>
        <div class="r"><span class="k">만기</span><span class="v">5년</span></div>
        <div class="r"><span class="k">월 납입한도</span><span class="v">70만원</span></div>
        <div class="r"><span class="k">기여금</span><span class="v">월 최대 3만 3천원</span></div>
      </div>
    </div>
    <div class="p pb">
      <div class="ph"><span>청년미래적금</span><span class="closed">마감</span></div>
      <div class="bd">
        <div class="r"><span class="k">신청 기간</span><span class="v">2026년 6/22 ~ 7/3</span></div>
        <div class="r"><span class="k">만기</span><span class="v">3년</span></div>
        <div class="r"><span class="k">월 납입한도</span><span class="v">50만원</span></div>
        <div class="r"><span class="k">기여금</span><span class="v">월 최대 6만원</span></div>
      </div>
    </div>
  </div>
  <div class="now">
    <div class="tag">그래서 지금은</div>
    <p>새로 들어갈 수 있는 창구는 <b>지금 열려 있지 않습니다.</b>
      이미 가입해두신 분은 <b>만기까지 혜택이 그대로 유지</b>되니 유지하는 게 핵심이고요.<br />
      아직 못 넣으신 분은 <b>다음 회차 공고를 기다리는 것</b> 말고는 방법이 없습니다</p>
  </div>
</div>
